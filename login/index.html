<style>
:root{--bg:#f7f8fa;--surface:#fff;--ink:#0f1218;--text:#111318;--muted:#667085;--line:#e6e8ec;--brand:#3157ff;--brand2:#2341c8;--soft:#eef2ff;--thread:#ff6b3d;--ok:#12a065;--warn:#c58a12;--bad:#d14343;--r:16px;--sh:0 10px 30px rgba(16,24,40,.07);--sh2:0 30px 80px rgba(16,24,40,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--xss);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%}
.serif{font-family:var(--xsf);font-weight:400;font-style:italic;letter-spacing:-.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:14px;transition:.15s}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(49,87,255,.25)}.btn.primary:hover{background:var(--brand2);transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#262b36}
.btn.secondary{background:#fff;border:1px solid var(--line);color:#344054}.btn.secondary:hover{border-color:#c9ced8}
.btn.ghost{background:transparent;color:var(--brand)}.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}.btn.lg{padding:15px 24px;font-size:15px}.btn.block{width:100%}
.btn.danger{background:#fff1f1;color:var(--bad)}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.6px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.logo b{color:var(--brand);font-weight:900}
.eyebrow{font-size:11.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap-row{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}.pad{padding:22px}.pad-lg{padding:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#f2f4f7;color:#475467;font-size:11.5px;font-weight:750}
.chip.blue{background:var(--soft);color:var(--brand)}.chip.green{background:#e8f8f0;color:#0e7c4f}.chip.orange{background:#fff3e8;color:#b5541d}.chip.red{background:#fff1f1;color:#b42318}.chip.dark{background:var(--ink);color:#fff}
input,select,textarea{width:100%;border:1px solid #dde1e7;border-radius:11px;padding:12px 13px;background:#fff;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px #eef2ff}
.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12.5px;font-weight:800;color:#344054}.field .hint{font-size:11.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:850;font-size:13px;flex:none}
.avatar.lg{width:64px;height:64px;font-size:20px}.avatar.xl{width:88px;height:88px;font-size:28px}.avatar.sm{width:30px;height:30px;font-size:11px}
/* marketing */
.mnav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(230,232,236,.7)}
.mnav .in{max-width:1240px;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.mnav .links{display:flex;gap:28px;font-size:14px;font-weight:700;color:#344054}.mnav .links a:hover,.mnav .links a.on{color:var(--brand)}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
.hero{padding:84px 0 70px;background:radial-gradient(1200px 500px at 80% -10%,#e9eeff 0,transparent 60%),radial-gradient(800px 400px at -10% 10%,#fff1ea 0,transparent 55%),#fff}
.hero .in{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.hero h1{font-size:68px;line-height:1.0;letter-spacing:-3.4px;margin:18px 0 22px}
.hero p.lead{font-size:19px;line-height:1.6;color:#4a5465;max-width:580px}
.badge-line{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:13px;font-weight:700;color:#344054}
.badge-line .dot{background:var(--ink);color:#fff;border-radius:99px;padding:3px 9px;font-size:11px}
.trust{display:flex;gap:22px;margin-top:34px;color:var(--muted);font-size:13px;font-weight:700;flex-wrap:wrap}
.trust span{display:flex;align-items:center;gap:7px}
.sec{padding:100px 0}.sec.alt{background:var(--bg)}.sec.dark{background:var(--ink);color:#fff}
.sec h2{font-size:48px;letter-spacing:-2.2px;line-height:1.05;margin:12px 0 18px}.sec p.lead{font-size:18px;color:#5b6576;line-height:1.7;max-width:720px}
.sec.dark p.lead{color:#aab3c4}
/* demo stage */
.stage{position:relative;height:560px}
.phone{position:absolute;width:270px;height:540px;border-radius:44px;background:#0b0d12;padding:12px;box-shadow:var(--sh2)}
.phone .scr{width:100%;height:100%;border-radius:34px;background:#fff;overflow:hidden;position:relative}
.phone.a{left:0;top:20px;transform:rotate(-6deg)}.phone.b{right:0;top:0;transform:rotate(5deg)}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#0b0d12;border-radius:99px;z-index:3}
.scr .top{padding:46px 18px 14px}
.tapwave{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:wave 3s infinite;z-index:5}
.tapwave.d2{animation-delay:1s}.tapwave.d3{animation-delay:2s}
@keyframes wave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.threadline{position:absolute;left:24%;right:24%;top:50%;height:3px;background:linear-gradient(90deg,var(--brand),var(--thread));border-radius:3px;z-index:4;transform-origin:left;animation:draw 3s infinite}
@keyframes draw{0%,20%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
.mini-card{margin:0 14px;border-radius:18px;background:linear-gradient(150deg,#10131a,#273047);color:#fff;padding:18px}
.q-opt{display:flex;align-items:center;justify-content:space-between;margin:8px 14px 0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;font-weight:750}
.q-opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px}
.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.step .n{font-size:13px;font-weight:900;color:var(--brand);letter-spacing:.1em}
.step h3{font-size:24px;letter-spacing:-.8px;margin:14px 0 8px}.step p{color:var(--muted);line-height:1.6;margin:0}
.step .vis{height:150px;margin-top:22px;border-radius:14px;background:var(--bg);display:grid;place-items:center;position:relative;overflow:hidden}
.compare{width:100%;border-collapse:separate;border-spacing:0;margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.compare th,.compare td{padding:16px 18px;text-align:left;border-bottom:1px solid #eef0f3;font-size:14px}
.compare th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#98a2b3;background:#fafbfc}
.compare td.us{background:#f5f7ff;font-weight:800;color:var(--brand)}.compare tr:last-child td{border-bottom:0}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.layer{border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.layer h3{font-size:22px;margin:14px 0 8px}.layer p{color:#aab3c4;line-height:1.6;margin:0}
.price{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--brand);box-shadow:0 20px 50px rgba(49,87,255,.15)}
.plan .amt{font-size:40px;font-weight:900;letter-spacing:-1.5px;margin:12px 0 2px}.plan ul{list-style:none;padding:0;margin:18px 0 24px;flex:1}
.plan li{display:flex;gap:9px;font-size:13.5px;margin:10px 0;color:#344054}
.seg{display:inline-flex;background:#f2f4f7;border-radius:12px;padding:4px}.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:800;font-size:13px;color:#475467}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cta{background:var(--ink);color:#fff;border-radius:28px;padding:80px 30px;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:52px;letter-spacing:-2px;margin:0 0 14px}.cta p{color:#aab3c4;font-size:18px}
.foot{background:var(--ink);color:#98a2b3;padding:70px 0 40px}.foot .grid{grid-template-columns:1.6fr repeat(4,1fr)}.foot h4{color:#fff;margin:0 0 14px;font-size:14px}.foot a{display:block;margin:9px 0;font-size:13.5px}.foot a:hover{color:#fff}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:10px}.faq summary{font-weight:800;cursor:pointer}.faq p{color:var(--muted);line-height:1.6;margin:12px 0 0}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .form{display:grid;place-items:center;padding:40px;background:#fff}.auth .box{width:min(420px,100%)}
.auth h1{font-size:34px;letter-spacing:-1.2px;margin:0 0 8px}
.oauth{display:grid;gap:10px;margin:24px 0}.or{display:flex;align-items:center;gap:12px;color:#98a2b3;font-size:12px;margin:18px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.progress{display:flex;gap:6px;margin-bottom:26px}.progress span{flex:1;height:5px;border-radius:9px;background:#eceef2}.progress span.on{background:var(--brand)}
/* app */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#475467;font-size:14px;font-weight:650;margin:2px 0}
.nav:hover{background:#f5f6f8}.nav.on{background:var(--soft);color:var(--brand);font-weight:800}.nav .cnt{margin-left:auto;background:var(--thread);color:#fff;border-radius:99px;font-size:10.5px;padding:2px 7px;font-weight:850}
.navgroup{margin:18px 0 6px;padding:0 12px;color:#98a2b3;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:850}
.main{margin-left:252px;flex:1;min-width:0}
.topbar{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:9px;width:380px;background:#f5f6f8;border:1px solid var(--line);border-radius:11px;padding:9px 13px;color:#98a2b3;font-size:13.5px}
.search input{border:0;background:transparent;padding:0;box-shadow:none!important}
.content{padding:30px;max-width:1320px;margin:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}.ph h1{font-size:30px;letter-spacing:-1.1px;margin:6px 0 6px}.ph p{margin:0;color:var(--muted)}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}.metric .l{font-size:12.5px;color:var(--muted);font-weight:700}.metric .v{font-size:30px;font-weight:900;letter-spacing:-1px;margin:6px 0 2px}.metric .d{font-size:12px;color:var(--ok);font-weight:750}
.tl{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:.15s;cursor:pointer}
.tl:hover{border-color:#c7d0ff;box-shadow:0 6px 18px rgba(49,87,255,.08)}
.tl .meta{flex:1;min-width:0}.tl .meta b{display:block;font-size:14.5px}.tl .meta span{font-size:12.5px;color:var(--muted)}
.ring{width:44px;height:44px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:900}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{border:0;background:transparent;padding:11px 14px;font-weight:800;color:#667085;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}.tabs button.on{color:var(--brand);border-color:var(--brand)}
.answer{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ans{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;transition:.15s}
.ans:hover{border-color:#b9c4ff}.ans.on{border-color:var(--brand);background:var(--soft)}.ans b{display:block;font-size:15px;margin:8px 0 3px}.ans span{font-size:12.5px;color:var(--muted)}
.reveal{border-radius:18px;padding:22px;background:linear-gradient(135deg,#0f1218,#24304d);color:#fff;position:relative;overflow:hidden}
.side-two{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.lock{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.event{position:relative;padding:0 0 18px 26px}.event:before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:1.5px;background:#e3e6eb}.event:last-child:before{display:none}
.event:after{content:"";position:absolute;left:2px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--brand)}
.event b{font-size:13.5px}.event div{font-size:12.5px;color:var(--muted);margin-top:2px}
.bizcard{border-radius:22px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:250px;box-shadow:var(--sh2)}
.bizcard:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-120px;background:rgba(255,255,255,.07)}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:inline-block;line-height:0}
.qrbox img,.qrbox canvas{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:999;box-shadow:var(--sh2);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.5);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.open{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:var(--sh2);padding:28px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.x{border:0;background:#f2f4f7;border-radius:9px;width:34px;height:34px;display:grid;place-items:center}
.draft{background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.warm{display:flex;gap:3px}.warm i{width:7px;height:16px;border-radius:3px;background:#e6e8ec}.warm i.on{background:linear-gradient(180deg,var(--thread),#ff9a6b)}
.mobile-tab{display:none}
.pub{min-height:100vh;background:radial-gradient(900px 500px at 50% -20%,#e6ecff,transparent 60%),var(--bg);padding:30px 16px 60px}
.pubcard{max-width:440px;margin:0 auto}
.livefeed .tl{cursor:default}
@media(max-width:1000px){.hero .in,.auth{grid-template-columns:1fr}.auth .side{display:none}.stage{height:520px;max-width:560px;margin:auto}.steps,.layers,.g3,.g4,.price{grid-template-columns:1fr 1fr}.foot .grid{grid-template-columns:1fr 1fr}.hero h1{font-size:50px;letter-spacing:-2px}.mnav .links{display:none}.sec h2{font-size:38px}}
@media(max-width:760px){.sidebar{display:none}.main{margin-left:0}.search{display:none}.content{padding:18px 16px 90px}.g2,.steps,.layers,.g3,.g4,.price,.answer{grid-template-columns:1fr}.mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:8px 0 14px}.mobile-tab a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:#667085}.mobile-tab a.on{color:var(--brand)}.hero h1{font-size:42px}.phone{width:220px;height:450px}.stage{height:470px}.compare{font-size:12px}.cta h2{font-size:36px}.side-two{grid-template-columns:1fr}.topbar{padding:0 16px}}

/* ===== v4 design system: navy + blue, Instrument Serif + Manrope ===== */
:root{--xb:#1f5eff;--xb2:#1748d6;--xink:#0b1122;--xtx:#1d2433;--xmu:#5b6478;--xln:#e6e9f0;--xbg:#f7f8fb;--xor:#ff6a3d;--xsf:'Instrument Serif',Georgia,serif;--xss:Manrope,Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.x-wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.x-logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--xss);font-weight:700;font-size:22px;letter-spacing:-.4px;color:var(--xink);text-decoration:none}
.x-logo b{font-weight:700;color:var(--xb)}.x-logo.dk{color:#fff}.x-logo.dk b{color:#4f86ff}
.x-lm{display:inline-flex;align-items:center}.x-lm i{width:17px;height:17px;border-radius:50%;background:var(--xink);display:block}.x-lm i+i{background:var(--xor);margin-left:-6px;opacity:.95}
.x-logo.dk .x-lm i:first-child,.x-card .x-lm i:first-child{background:#fff}.x-card.lt .x-lm i:first-child{background:var(--xink)}
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:10px;padding:12px 20px;background:var(--xb);color:#fff;font:700 14.5px/1 var(--xss);text-decoration:none;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s;box-shadow:0 8px 22px -8px rgba(31,94,255,.6)}
.x-btn:hover{background:var(--xb2);transform:translateY(-1px)}.x-btn:disabled{opacity:.7;cursor:wait;transform:none}
.x-btn.sm{padding:10px 16px;font-size:13.5px}.x-btn.lg{padding:16px 24px;font-size:15.5px}.x-btn.block{width:100%}.x-btn.grow{flex:1}
.x-btn.ghost{background:#fff;color:var(--xtx);border:1px solid var(--xln);box-shadow:none}.x-btn.ghost:hover{border-color:#c5cbd8;background:#fff}
.x-btn.dk2{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#fff;box-shadow:none}
.x-play{width:24px;height:24px;border-radius:50%;background:var(--xink);color:#fff;display:grid;place-items:center}
.x-eye{font:700 12px/1 var(--xss);letter-spacing:.14em;text-transform:uppercase;color:var(--xb);margin-bottom:14px}
.x-h1{font-family:var(--xsf);font-weight:400;font-size:clamp(48px,5.6vw,78px);line-height:1;letter-spacing:-.02em;color:var(--xink);margin:22px 0 22px}
.x-h1 em,.x-h2 em,.x-sh em{font-style:italic;color:var(--xb)}
.x-h2{font-family:var(--xsf);font-weight:400;font-size:clamp(38px,3.9vw,54px);line-height:1.02;letter-spacing:-.015em;color:var(--xink);margin:0}
.x-h2 em.ink{color:var(--xink)}
.x-lead{font:400 18px/1.6 var(--xss);color:#3d4659;max-width:520px;margin:0}
.x-sub{font:400 16.5px/1.65 var(--xss);color:var(--xmu);margin:0;max-width:460px}
/* nav */
.x-nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(15,23,42,.06)}
.x-nav-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.x-links{display:flex;align-items:center;gap:30px;font:600 14.5px var(--xss);color:var(--xtx)}
.x-links a,.x-dd>button{color:var(--xtx);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:8px 0}
.x-links a:hover,.x-links a.on,.x-dd>button:hover{color:var(--xb)}
.x-dd{position:relative}.x-dd-m{position:absolute;top:100%;left:-16px;min-width:210px;background:#fff;border:1px solid var(--xln);border-radius:12px;box-shadow:0 20px 40px -12px rgba(15,23,42,.18);padding:8px;display:none}
.x-dd:hover .x-dd-m,.x-dd:focus-within .x-dd-m{display:block}.x-dd-m a{display:block;padding:10px 12px;border-radius:8px}.x-dd-m a:hover{background:var(--xbg)}
.x-nav-r{display:flex;align-items:center;gap:18px}.x-login{font:700 14.5px var(--xss);color:var(--xb);text-decoration:none}
.x-burger{display:none;background:none;border:0;color:var(--xink);padding:6px;cursor:pointer}
/* hero */
.x-hero{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 85% 30%,rgba(255,150,100,.16),transparent 60%),radial-gradient(50% 60% at 70% 60%,rgba(31,94,255,.12),transparent 60%),linear-gradient(180deg,#fff,#f8f9fc)}
.x-hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:64px}
.x-pill{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border:1px solid var(--xln);border-radius:999px;background:#fff;font:600 13px var(--xss);color:var(--xtx);box-shadow:0 2px 8px rgba(15,23,42,.04)}
.x-pill-ic{width:22px;height:22px;border-radius:50%;background:var(--xbg);display:grid;place-items:center;color:var(--xink)}
.x-cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:32px}
.x-checks{list-style:none;padding:0;margin:30px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:14px 36px;font:500 14px var(--xss);color:#3d4659}
.x-checks li{display:flex;align-items:center;gap:9px}.x-checks svg{color:#12a065;flex:none}
.x-hero-art{position:relative;height:560px}
.x-hero-art .x-phone{position:absolute;left:4%;top:10px;transform:rotate(-5deg);z-index:2}
.x-pcard{position:absolute;right:2%;top:70px;width:236px;height:350px;border-radius:22px;transform:rotate(9deg);padding:22px;color:#fff;background:radial-gradient(120% 70% at 100% 0%,rgba(52,92,220,.35),transparent 55%),linear-gradient(160deg,#0b1122,#141c33);box-shadow:0 40px 70px -25px rgba(8,14,40,.55);font-family:var(--xss);z-index:1}
.x-pcard-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;letter-spacing:.08em;opacity:.85}
.x-pcard .x-av{margin:26px 0 12px}.x-pcard-n{font-weight:700;font-size:19px}.x-pcard-r{font-size:12.5px;color:rgba(255,255,255,.66);line-height:1.45;margin-top:3px}
.x-qr{background:#fff;border-radius:10px;padding:7px;display:inline-block;line-height:0;margin-top:16px}.x-qr img{display:block}
.x-pcard-f{position:absolute;left:22px;bottom:18px;font-size:12px;color:rgba(255,255,255,.75);line-height:1.35}
.x-hand{position:absolute;font-family:var(--xss);font-style:italic;font-size:23px;line-height:1.1;color:#333b4f;transform:rotate(-4deg)}
.x-hero-art .x-hand{right:0;bottom:6px;text-align:left}.x-hero-art .x-hand svg{position:absolute;left:-58px;top:-26px}
/* phone */
.x-phone{width:252px;border-radius:42px;padding:9px;background:linear-gradient(145deg,#2b2f38,#0b0d12);box-shadow:inset 0 0 0 1.5px #474c58,0 50px 80px -30px rgba(5,10,30,.6)}
.x-scr{position:relative;height:510px;border-radius:34px;overflow:hidden;background:#0b1122}
.x-scr:before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:86px;height:24px;border-radius:14px;background:#000;z-index:5}
.x-sbar{position:absolute;top:13px;left:24px;right:22px;display:flex;justify-content:space-between;font:700 11.5px var(--xss);color:#fff;z-index:4}
.x-scr.wh{background:#fff}.x-scr.wh .x-sbar{color:var(--xink)}
/* card */
.x-card{position:relative;border-radius:22px;padding:22px 22px 20px;overflow:hidden;font-family:var(--xss);box-shadow:0 34px 70px -28px rgba(8,14,40,.55);color:#fff}
.x-card-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15.5px;letter-spacing:-.2px}
.x-card-brand{display:inline-flex;gap:9px;align-items:center}.x-card .x-lm i{width:14px;height:14px}.x-card .x-lm i+i{margin-left:-5px}
.x-card-id{text-align:center;margin-top:16px}
.x-av{border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--xor);color:#fff;font-weight:700;letter-spacing:.02em;object-fit:cover;box-shadow:0 0 0 4px rgba(255,255,255,.1)}
img.x-av{display:block}
.x-card-name{font-weight:700;font-size:23px;letter-spacing:-.4px;margin-top:14px}
.x-card-role{font-size:14px;color:var(--sub);margin-top:4px}
.x-card-icons{display:flex;justify-content:center;gap:9px;margin-top:18px}
.x-card-icons span{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);display:grid;place-items:center}
.x-card-icons span:first-child{color:#4f8bff}
.x-card-save{display:block;margin-top:16px;background:var(--xb);color:#fff!important;text-align:center;border-radius:10px;padding:13px;font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer}
.x-card-rows{margin-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.x-card-rows div{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:13.5px}
.x-card-rows span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-card-rows svg{flex:none;opacity:.85}
.x-card-about{margin-top:16px;text-align:left}.x-card-about b{font-size:13px}.x-card-about p{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:var(--sub)}
.x-card-tags{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:2px}
.x-card-tags b{display:block;font-size:14px;margin-bottom:10px}
.x-card-tags span{display:inline-block;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:12px;margin:0 6px 6px 0}
.x-card.lt{color:var(--xink);box-shadow:0 30px 60px -30px rgba(15,23,42,.35),inset 0 0 0 1px rgba(15,23,42,.06)}
.x-card.lt .x-card-icons span{border-color:rgba(15,23,42,.12);background:rgba(255,255,255,.55)}
.x-card.lt .x-card-rows,.x-card.lt .x-card-tags{border-color:rgba(15,23,42,.1)}.x-card.lt .x-card-tags span{border-color:rgba(15,23,42,.16)}
.x-card.ph{border-radius:0;box-shadow:none;height:100%;padding:44px 16px 16px}
.x-card.ph .x-card-top{font-size:13px}.x-card.ph .x-card-name{font-size:19px;margin-top:10px}.x-card.ph .x-card-role{font-size:12px}
.x-card.ph .x-card-icons{gap:6px;margin-top:13px}.x-card.ph .x-card-icons span{width:33px;height:33px;border-radius:8px}
.x-card.ph .x-card-save{padding:10px;font-size:13px;margin-top:12px}.x-card.ph .x-card-rows div{font-size:12px;padding:7px 2px}
/* sections */
.x-sec{padding:96px 0;background:#fff}.x-sec.alt{background:var(--xbg)}
.x-head2{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end;margin-bottom:46px}
.x-strip{border-top:1px solid var(--xln);border-bottom:1px solid var(--xln);background:#fff}
.x-strip-in{display:flex;align-items:center;gap:40px;padding-top:26px;padding-bottom:26px}
.x-strip-l{font:700 13px/1.4 var(--xss);color:var(--xink);flex:none}
.x-strip-items{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px 34px;flex:1;font:700 15px var(--xss);color:#2c3445}
.x-strip-items span{display:inline-flex;align-items:center;gap:9px}.x-strip-items svg{color:var(--xb)}
.x-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.x-step{position:relative;background:#fff;border:1px solid var(--xln);border-radius:18px;padding:16px 16px 24px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:box-shadow .2s,transform .2s}
.x-step:hover{transform:translateY(-3px);box-shadow:0 24px 40px -24px rgba(15,23,42,.25)}
.x-step-n{position:absolute;top:-14px;left:22px;width:28px;height:28px;border-radius:50%;background:var(--xb);color:#fff;display:grid;place-items:center;font:700 13px var(--xss);box-shadow:0 0 0 5px #f7f8fb}
.x-step-v{height:170px;border-radius:12px;background:linear-gradient(160deg,#eef2fb,#f8f9fd);display:grid;place-items:center;overflow:hidden;position:relative;margin-bottom:20px}
.x-step h3{font:700 17px var(--xss);color:var(--xink);margin:0 0 8px;letter-spacing:-.2px}.x-step p{font:400 14px/1.6 var(--xss);color:var(--xmu);margin:0}
.v-mini{background:#fff;border-radius:12px;box-shadow:0 12px 26px -12px rgba(15,23,42,.25);padding:12px 14px;font:600 12px var(--xss);color:var(--xink);width:78%}
.v-row{display:flex;align-items:center;gap:9px}.v-row small{display:block;font-weight:500;color:var(--xmu);font-size:11px;line-height:1.35}
.v-opt{display:flex;align-items:center;gap:8px;border:1px solid var(--xln);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:11.5px;font-weight:600}
.v-opt.on{border-color:var(--xb);background:#eef3ff;color:var(--xb)}.v-opt.on em{margin-left:auto;font-style:normal}
.v-pill{display:inline-flex;align-items:center;gap:6px;background:#e8f8f0;color:#0f7a4b;border-radius:999px;padding:5px 10px 5px 5px;font:700 11px var(--xss);margin-top:10px}
.v-pill img,.v-pill i{width:20px;height:20px;border-radius:50%;object-fit:cover;display:block}
.v-ph{position:absolute;width:62px;height:118px;border-radius:13px;background:#0b1122;border:3px solid #23293a;box-shadow:0 16px 30px -12px rgba(15,23,42,.5);display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:6px}
.v-ph i{width:22px;height:22px;border-radius:50%;background:var(--xor);display:block}.v-ph b{width:32px;height:4px;border-radius:2px;background:rgba(255,255,255,.5)}.v-ph s{width:38px;height:9px;border-radius:3px;background:var(--xb);margin-top:6px}
.v-ph.a{left:22%;transform:rotate(-12deg)}.v-ph.b{right:22%;transform:rotate(12deg)}.v-ph.b i{background:#fff}
.v-wave{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--xb)}
/* difference */
.x-diff{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center}
.x-cmp{display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden;background:#0b1122;color:#fff;font-family:var(--xss);box-shadow:0 40px 70px -35px rgba(8,14,40,.6)}
.x-cmp>div{padding:30px 30px 34px}.x-cmp>div+div{background:linear-gradient(160deg,#16213f,#101934);position:relative}
.x-cmp h4{margin:0 0 22px;font-size:16px;font-weight:700}.x-cmp>div:first-child h4{color:#c9cfdc}
.x-cmp li{list-style:none;display:flex;align-items:center;gap:12px;font-size:14.5px;padding:9px 0}
.x-cmp ul{margin:0;padding:0}.x-cmp>div:first-child li{color:#8d96ab}
.x-cmp .no{width:22px;height:22px;border-radius:50%;border:1px solid #3a4258;display:grid;place-items:center;color:#6b748a;flex:none}
.x-cmp .yes{width:22px;height:22px;border-radius:50%;background:var(--xb);display:grid;place-items:center;color:#fff;flex:none}
/* use cases */
.x-uses{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.x-use{background:#fff;border:1px solid var(--xln);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s}
.x-use:hover{transform:translateY(-3px);box-shadow:0 24px 40px -24px rgba(15,23,42,.3)}
.x-use img{width:100%;height:170px;object-fit:cover;display:block}
.x-use-b{position:relative;padding:34px 20px 22px}.x-use-ic{position:absolute;top:-24px;left:18px;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--xb);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(15,23,42,.3)}
.x-use h3{font:700 16.5px var(--xss);margin:0 0 7px;color:var(--xink)}.x-use p{font:400 14px/1.55 var(--xss);color:var(--xmu);margin:0}
/* principle */
.x-quote{display:grid;grid-template-columns:1fr 1px 1.1fr;gap:56px;align-items:center}
.x-quote .x-sh{font-family:var(--xsf);font-style:italic;font-size:clamp(30px,3vw,40px);line-height:1.12;color:var(--xink);margin:0}
.x-quote .bar{background:var(--xln);height:100%}
.x-quote blockquote{margin:0;font:500 19px/1.6 var(--xss);color:#2c3445}
.x-quote cite{display:flex;align-items:center;gap:12px;margin-top:20px;font:700 14.5px var(--xss);font-style:normal;color:var(--xink)}.x-quote cite small{display:block;font-weight:500;color:var(--xmu)}
/* cta */
.x-ctab{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(60% 120% at 100% 100%,rgba(255,106,61,.28),transparent 60%),radial-gradient(50% 90% at 0% 0%,rgba(31,94,255,.3),transparent 60%),#0b1122;color:#fff;padding:64px 64px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.x-ctab .x-eye{color:#6f9bff}.x-ctab h2{font-family:var(--xsf);font-weight:400;font-size:clamp(36px,3.6vw,50px);line-height:1.05;margin:0 0 14px}
.x-ctab p{color:#b9c1d4;font:400 16px/1.6 var(--xss);margin:0 0 28px}
.x-ctab-art{position:relative;height:260px}
.x-wcard{position:absolute;width:190px;height:240px;border-radius:18px;padding:18px;font-family:var(--xss)}
.x-wcard.w{background:linear-gradient(170deg,#fff,#f3efe9);color:var(--xink);left:6%;top:6px;transform:rotate(-6deg);z-index:3;text-align:center;box-shadow:0 30px 50px -20px rgba(0,0,0,.6)}
.x-wcard.d{background:#151d33;border:1px solid #2a3350;right:10%;top:24px;transform:rotate(7deg);z-index:2;box-shadow:0 30px 50px -20px rgba(0,0,0,.6)}
.x-wcard.o{background:linear-gradient(160deg,#ff8a5c,#e2501f);right:2%;top:2px;transform:rotate(14deg);z-index:1}
.x-wcard .x-av{margin:22px auto 10px}
/* footer */
.x-foot{background:#fff;border-top:1px solid var(--xln);padding:60px 0 30px;font-family:var(--xss)}
.x-foot-g{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:30px}
.x-foot p{color:var(--xmu);font-size:14px;margin:14px 0 0}
.x-foot h4{font-size:13.5px;font-weight:700;color:var(--xink);margin:4px 0 14px}
.x-foot a:not(.x-logo){display:block;color:var(--xmu);font-size:14px;text-decoration:none;padding:5px 0}.x-foot a:not(.x-logo):hover{color:var(--xb)}
.x-foot-b{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--xln);margin-top:44px;padding-top:22px;font-size:13px;color:var(--xmu)}
/* ===== auth / onboarding ===== */
.x-auth{display:grid;grid-template-columns:var(--sw,46%) 1fr;min-height:100vh;background:#fff;font-family:var(--xss)}
.auth{grid-template-columns:minmax(0,46%) 1fr!important}
.x-side{position:relative;overflow:hidden;color:#fff;padding:44px 56px 48px;display:flex;flex-direction:column;background:radial-gradient(70% 40% at 0% 0%,rgba(40,70,170,.35),transparent 70%),linear-gradient(170deg,#0b1224,#0a1020 60%,#0c1326);min-height:100vh}
.x-side:before{content:'';position:absolute;width:560px;height:560px;border-radius:50%;right:-260px;bottom:-120px;background:radial-gradient(circle at 30% 30%,rgba(31,94,255,.18),rgba(10,16,32,0) 65%);border:1px solid rgba(255,140,90,.35);box-shadow:inset 18px 18px 60px rgba(255,106,61,.12)}
.x-side:after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;left:-140px;top:-90px;background:radial-gradient(circle,rgba(70,100,200,.22),transparent 70%)}
.x-side>*{position:relative;z-index:1}
.x-side-top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.x-side-top small{font-family:var(--xsf);font-style:italic;font-size:15.5px;color:#aeb7cb;text-align:right;line-height:1.3}
.x-side .x-eye{color:#aeb9d6;letter-spacing:.24em;font-size:11.5px;line-height:1.8;font-weight:600;margin:64px 0 0;max-width:300px}

.x-links .x-mlogin{display:none}body.x-open .x-links .x-mlogin{display:block}
.x-hero-art .x-phone{left:0;z-index:3}.x-pcard{right:-2%;z-index:2}.x-wave,.x-tline{z-index:1}
.x-pcard-f{left:auto;right:22px;text-align:right}

/* inner pages */
.x-ph{position:relative;overflow:hidden;background:radial-gradient(55% 70% at 85% 35%,rgba(255,150,100,.14),transparent 60%),radial-gradient(45% 60% at 70% 60%,rgba(31,94,255,.1),transparent 60%),linear-gradient(180deg,#fff,#f8f9fc);padding:64px 0 56px}
.x-ph.c{text-align:center}.x-ph.c .x-h1{max-width:900px;margin-left:auto;margin-right:auto}
.x-ph-in{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}.x-ph-in.solo{grid-template-columns:1fr}
.x-ph-h{font-size:clamp(42px,4.8vw,66px);margin:16px 0 20px}
.x-ph-art{position:relative;display:grid;place-items:center;min-height:440px}
.x-ph-art>*:not(.x-ph-glow){position:relative;z-index:1}
.x-ph-glow{position:absolute;inset:6% 4%;border-radius:50%;background:radial-gradient(circle,rgba(31,94,255,.22),rgba(255,106,61,.1) 45%,transparent 70%);animation:xglow 4s ease-in-out infinite}
.x-ph-art .x-phone{transform:rotate(-4deg);animation:xfloatA 6s ease-in-out infinite}
.x-f3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.x-f4{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.x-f3-i,.x-flow-i{position:relative;background:#fff;border:1px solid var(--xln);border-radius:18px;padding:28px 26px;transition:transform .2s,box-shadow .2s}
.x-f3-i:hover,.x-flow-i:hover{transform:translateY(-3px);box-shadow:0 24px 40px -26px rgba(15,23,42,.3)}
.x-f3-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#3f7bff,#1f5eff 55%,#1748d6);box-shadow:0 12px 22px -12px rgba(31,94,255,.8);margin-bottom:18px}
.x-f3-i h3,.x-flow-i h3{font:700 18px var(--xss);color:var(--xink);margin:0 0 8px}.x-f3-i p,.x-flow-i p{font:400 15px/1.65 var(--xss);color:var(--xmu);margin:0}
.x-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:f}
.x-flow-n{position:absolute;top:24px;right:24px;font-family:var(--xsf);font-size:34px;color:#c9d2e6;line-height:1}
.x-faqw{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.x-faq details{border-bottom:1px solid var(--xln);padding:4px 0}.x-faq details:first-child{border-top:1px solid var(--xln)}
.x-faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;font:700 17px var(--xss);color:var(--xink)}
.x-faq summary::-webkit-details-marker{display:none}.x-faq summary span{color:var(--xmu);transition:transform .2s}.x-faq details[open] summary span{transform:rotate(180deg);color:var(--xb)}
.x-faq p{margin:0 0 20px;font:400 15.5px/1.7 var(--xss);color:#3d4659;max-width:620px}
.x-ctab.one{grid-template-columns:1fr;text-align:center;justify-items:center}.x-ctab.one .x-cta-row{justify-content:center}
/* rooms report */
.x-rep{width:min(420px,100%);border-radius:22px;padding:24px;background:radial-gradient(70% 60% at 100% 0%,rgba(31,94,255,.35),transparent 60%),#0b1122;color:#fff;font-family:var(--xss);box-shadow:0 40px 80px -30px rgba(8,14,40,.6);animation:xfloatB0 6s ease-in-out infinite}
@keyframes xfloatB0{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.x-rep-h{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9fb0d4}
.x-rep-h em{font-style:normal;display:inline-flex;align-items:center;gap:7px;color:#5fe3a1}.x-rep-h em i{width:8px;height:8px;border-radius:50%;background:#2fd384;animation:xpulse2 1.6s infinite}
@keyframes xpulse2{0%,100%{box-shadow:0 0 0 0 rgba(47,211,132,.6)}50%{box-shadow:0 0 0 6px rgba(47,211,132,0)}}
.x-rep-t{display:block;font-family:var(--xsf);font-weight:400;font-size:26px;margin-top:14px;line-height:1.1}.x-rep-s{color:#8f9bb8;font-size:12px}
.x-rep-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.x-rep-g div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px}
.x-rep-g b{display:block;font-size:26px;font-weight:700;letter-spacing:-.5px}.x-rep-g small{font-size:12px;color:#aab5cd}
.x-rep-bar{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;color:#c7d0e3}.x-rep-bar b{color:#fff}
.x-rep-bar i{grid-column:1/3;height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.x-rep-bar s{display:block;height:100%;background:linear-gradient(90deg,#1f5eff,#ff6a3d);border-radius:5px}
/* warmth */
.x-warm{width:min(440px,100%);background:#fff;border:1px solid var(--xln);border-radius:22px;padding:24px;font-family:var(--xss);box-shadow:0 40px 80px -36px rgba(15,23,42,.4);animation:xfloatB0 6s ease-in-out infinite}
.x-warm>small{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--xb)}.x-warm>b{display:block;font-size:19px;color:var(--xink);margin:6px 0 14px}
.x-warm-r{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--xln)}.x-warm-r>div{flex:1;min-width:0}.x-warm-r b{font-size:14.5px;color:var(--xink)}.x-warm-r small{display:block;font-size:12.5px;color:var(--xmu);margin:2px 0 7px}
.x-warm-r i{display:block;height:6px;border-radius:4px;background:#eef1f6;overflow:hidden}.x-warm-r s{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#1f5eff,#ff6a3d)}
.x-warm-r em{font-style:normal;font:700 15px var(--xss);color:var(--xink);width:30px;text-align:right}
.x-warm p{display:flex;align-items:center;gap:7px;margin:12px 0 0;font-size:12.5px;color:var(--xmu)}
/* pricing */
.x-plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch}
.x-plan{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--xln);border-radius:20px;padding:28px 24px;font-family:var(--xss)}
.x-plan.hot{background:radial-gradient(80% 60% at 100% 0%,rgba(31,94,255,.35),transparent 60%),#0b1122;color:#fff;border-color:#0b1122;box-shadow:0 40px 70px -35px rgba(8,14,40,.65);transform:translateY(-8px)}
.x-plan-tag{position:absolute;top:-12px;left:24px;background:var(--xor);color:#fff;font:700 11.5px var(--xss);letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:999px}
.x-plan-n{font-size:19px}.x-plan-w{display:block;font-size:13.5px;color:var(--xmu);margin-top:4px}.x-plan.hot .x-plan-w,.x-plan.hot .x-plan-a small{color:#aab5cd}
.x-plan-a{font-family:var(--xsf);font-size:52px;line-height:1;margin:22px 0 20px;letter-spacing:-.02em}.x-plan-a small{display:block;font:500 13px var(--xss);color:var(--xmu);margin-top:8px;letter-spacing:0}
.x-plan ul{list-style:none;padding:20px 0 0;margin:22px 0 0;border-top:1px solid var(--xln);display:grid;gap:12px}.x-plan.hot ul{border-color:rgba(255,255,255,.12)}
.x-plan li{display:flex;gap:10px;font-size:14.5px;line-height:1.4}.x-plan li svg{color:#12a065;flex:none;margin-top:1px}.x-plan.hot li svg{color:#5fe3a1}
.x-plan-note{text-align:center;font:500 13.5px var(--xss);color:var(--xmu);margin-top:26px}
/* about */
.x-quotecard{max-width:440px;background:#0b1122;color:#fff;border-radius:22px;padding:34px;font-family:var(--xsf);box-shadow:0 40px 80px -30px rgba(8,14,40,.6);animation:xfloatB0 6s ease-in-out infinite}
.x-quotecard span{display:block;font-size:90px;line-height:.6;height:40px;color:var(--xor)}.x-quotecard p{margin:0;font-size:27px;line-height:1.25}
.x-story{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px}.x-story p{font:400 17.5px/1.75 var(--xss);color:#3d4659;margin:0 0 18px}
.x-contact{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:start}
.x-mailto{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font:700 17px var(--xss);color:var(--xb);text-decoration:none}
.x-cform{background:#fff;border:1px solid var(--xln);border-radius:20px;padding:28px;margin-top:0;box-shadow:0 30px 60px -40px rgba(15,23,42,.35)}
/* privacy */
.x-shield{width:300px;height:300px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;font-family:var(--xss);background:radial-gradient(circle at 30% 25%,#2b4fb5,#0b1122 70%);box-shadow:0 40px 80px -30px rgba(8,14,40,.6),0 0 0 14px rgba(31,94,255,.08),0 0 0 28px rgba(31,94,255,.05);animation:xfloatB0 6s ease-in-out infinite}
.x-shield b{font-size:19px}.x-shield small{font-size:12px;color:#aab5cd;max-width:200px;line-height:1.5}
.x-reg{display:flex;gap:18px;align-items:flex-start;margin-top:20px;background:#fff;border:1px solid var(--xln);border-radius:18px;padding:24px 26px;font-family:var(--xss)}.x-reg .x-f3-ic{margin:0;flex:none}
.x-reg b{font-size:17px;color:var(--xink)}.x-reg p{margin:6px 0 0;font-size:15px;line-height:1.65;color:var(--xmu)}.x-reg a{color:var(--xb);font-weight:700}
@media (max-width:1180px){.x-ph-in,.x-faqw,.x-story,.x-contact{grid-template-columns:1fr}.x-flow,.x-plans{grid-template-columns:repeat(2,1fr)}.x-plan.hot{transform:none}.x-ph-art{min-height:380px}}
@media (max-width:760px){.x-f3,.x-f4,.x-flow,.x-plans{grid-template-columns:1fr}.x-ph{padding:44px 0}.x-ph-art .x-phone{transform:scale(.9)}}
@media (prefers-reduced-motion:reduce){.x-ph-glow,.x-ph-art .x-phone,.x-rep,.x-warm,.x-quotecard,.x-shield{animation:none}}

.x-up{display:flex;align-items:center;gap:12px}
.x-up-in{flex:1;display:flex;align-items:center;gap:14px;padding:12px 14px;border:1.5px dashed #cfd6e3;border-radius:12px;background:#fafbfd;cursor:pointer;transition:border-color .15s,background .15s}
.x-up-in:hover{border-color:var(--xb);background:#f5f8ff}.x-up-in input{position:absolute;width:1px;height:1px;opacity:0}
.x-up-in img,.x-up-ph{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}.x-up-ph{display:grid;place-items:center;background:#eef1f6;color:#8a93a6}
.x-up-t b{display:block;font-size:14.5px;color:var(--xink)}.x-up-t small{font-size:12.5px;color:var(--xmu)}
.x-up-rm{border:0;background:none;color:#d14343;font:600 13.5px var(--xss);cursor:pointer}
.x-prow{display:flex;gap:16px;align-items:center;padding-bottom:16px;margin-bottom:4px;border-bottom:1px solid var(--line,#e6e8ec)}.x-prow .x-av{margin:0;box-shadow:none}
.x-prow b{display:block;font-size:15px}.x-prow small{display:block;font-size:13px;color:var(--xmu)}.x-prow-b{display:flex;gap:8px;margin-top:8px}.x-prow-b .x-btn{cursor:pointer}
@media (min-width:1081px) and (max-height:820px){.x-up-in{padding:8px 12px}.x-up-in img,.x-up-ph{width:38px;height:38px}}

/* ===== v4 app dashboard ===== */
:root{--brand:#1f5eff;--brand2:#1748d6;--soft:#eef3ff;--ink:#0b1122;--bg:#f6f7fb;--line:#e6e9f0;--muted:#5b6478}
.app{background:var(--bg);font-family:var(--xss)}
.app .sidebar{background:radial-gradient(80% 40% at 0% 0%,rgba(31,94,255,.25),transparent 70%),linear-gradient(180deg,#0b1224,#0a1020);border-right:0;color:#dfe5f2}
.app .sidebar .nav{color:#b4bdd0;border-radius:10px;font-weight:600}.app .sidebar .nav svg{opacity:.85}
.app .sidebar .nav:hover{background:rgba(255,255,255,.06);color:#fff}

.app .sidebar .cnt{background:var(--xor);color:#fff}
.app .sidebar .navgroup{color:#6f7a93}
.app .sidebar .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:none;color:#e6ebf5}
.app .sidebar .card .muted,.app .sidebar .tiny.muted{color:#97a2ba}
.app .sidebar .row b{color:#fff}.app .sidebar .x{color:#b4bdd0;background:transparent}
.app .sidebar .btn.primary{box-shadow:0 10px 24px -10px rgba(31,94,255,.9)}
.app .topbar{background:rgba(255,255,255,.85);border-bottom:1px solid var(--line)}
.app .topbar .search{border-radius:10px;background:#f3f5f9;border:1px solid transparent}.app .topbar .search:focus-within{border-color:var(--brand);background:#fff}
.app .ph h1{font-family:var(--xsf);font-weight:400;font-size:40px;letter-spacing:-.015em;line-height:1.05}
.app .eyebrow{color:var(--brand);letter-spacing:.14em;font-weight:700}
.app .card{border-radius:18px;border-color:var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04),0 20px 40px -32px rgba(15,23,42,.25)}
.app .metric{border-radius:18px;border-color:var(--line);box-shadow:0 20px 40px -34px rgba(15,23,42,.3);position:relative;overflow:hidden}
.app .metric:after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(31,94,255,.12),transparent 70%)}
.app .metric .v{font-family:var(--xsf);font-weight:400;font-size:40px;letter-spacing:-.02em}
.app .btn{border-radius:10px;font-weight:700}.app .btn.primary{background:var(--brand)}.app .btn.primary:hover{background:var(--brand2)}
.app .tl{border-radius:14px}.app .tl:hover{border-color:#c9d6ff;box-shadow:0 16px 30px -22px rgba(31,94,255,.45)}

.app .x-card{max-width:380px}
.app .mobile-tab{background:rgba(11,17,34,.96);border-top:0}.app .mobile-tab a{color:#9aa5bd}.app .mobile-tab a.on{color:#fff}

.x-hero-art .x-wave,.x-hero-art .x-tline{z-index:5}.x-hero-art .x-glow{z-index:0}

/* v4.4 audit fixes */
.x-hero-art .x-tline{left:47%;top:66%;width:56px}
.x-hero-art .x-wave{left:52%;top:66%;width:110px;height:110px;margin:-55px 0 0 -55px}

/* v4.5 sans headline */

/* v13 home: How it works */
.hw-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:34px}
.hw-h2{margin:10px 0 12px}.hw-h2 span{color:var(--xb)}

.hw-see{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border:1px solid var(--xln);border-radius:12px;background:#fff;color:var(--xink);font:600 15px var(--xss);text-decoration:none;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.05);flex:none}

.hw-step{background:#fff;border:1px solid var(--xln);border-radius:18px;padding:14px 14px 22px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:box-shadow .2s,transform .2s}

.hw-v{position:relative;height:172px;border-radius:12px;background:linear-gradient(160deg,#eef2fb,#f7f9fd);display:grid;place-items:center;overflow:hidden;margin-bottom:18px}
.hw-n{position:absolute;left:10px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--xb);color:#fff;display:grid;place-items:center;font:700 13px var(--xss);z-index:2}
.hw-step h3{margin:0 0 8px;padding:0 4px;font:700 17px var(--xss);color:var(--xink);letter-spacing:-.2px}
.hw-step p{margin:0;padding:0 4px;font:400 14px/1.6 var(--xss);color:var(--xmu)}
.hw-nfc{position:relative;display:flex;align-items:center;gap:6px}
.hw-card{position:relative;width:132px;height:88px;border-radius:12px;padding:12px;transform:rotate(-8deg);background:radial-gradient(90% 80% at 110% 110%,rgba(255,106,61,.45),transparent 60%),linear-gradient(150deg,#0b1430,#16224a);box-shadow:0 18px 30px -14px rgba(8,14,40,.7)}

@keyframes hwp{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
.hw-mini{width:84%;background:#fff;border-radius:12px;padding:12px;box-shadow:0 12px 26px -16px rgba(15,23,42,.35);font-family:var(--xss)}
.hw-who{display:flex;gap:10px;align-items:center}.hw-who img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}

.hw-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}.hw-ic.o{background:#fff1ec;color:#ff6a3d}.hw-ic.b{background:#eef3ff;color:var(--xb)}

<script>
/* Introthread prototype — local data store, router, views */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5,HR=36e5;
const COLORS=['#3157ff','#ff6b3d','#12a065','#7a5af8','#0ea5e9','#e11d74','#c58a12','#0f766e'];
const colorFor=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(n,cls='')=>`<div class="avatar ${cls}" style="background:${colorFor(n)}">${esc(initials(n))}</div>`;
const ago=t=>{const d=Date.now()-t;if(d<HR)return Math.max(1,Math.round(d/6e4))+'m ago';if(d<DAY)return Math.round(d/HR)+'h ago';return Math.round(d/DAY)+'d ago'};
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'me';

const IC={
 logo:'<svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32"><defs><linearGradient id="itlg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ea0ff"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs><path d="M9 22C22 36 26 -4 39 10" fill="none" stroke="url(#itlg)" stroke-width="3.6" stroke-linecap="round"/><circle cx="9" cy="22" r="6.5" fill="#ffffff"/><circle cx="39" cy="10" r="6.5" fill="#ff5a1f"/></svg>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 thread:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12c2-4 5-4 7 0M8.5 12c2 4 5 4 7 0"/>',
 tap:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/><path d="M2 9c1.5-1.5 1.5-4.5 0-6M22 9c-1.5-1.5-1.5-4.5 0-6" transform="translate(0 6)"/>',
 room:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
 bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',
 intro:'<circle cx="5" cy="7" r="2.5"/><circle cx="19" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 8.5l3.5 7.5M17 8.5l-3.5 7.5"/>',
 keep:'<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',
 pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
 out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 nfc:'<path d="M6 8a6 6 0 010 8M10 5a10 10 0 010 14M14 2a14 14 0 010 20"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'
};
const ic=(n,s=18,c='currentColor',w=1.9)=>n==='logo'?IC.logo:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

/* What's next options */
const NEXT={
 meet:{label:'Meet again',desc:'Book a proper conversation',icon:'calendar'},
 intro:{label:'Introduce someone',desc:'One of us knows someone useful',icon:'intro'},
 keep:{label:'Stay in touch',desc:'Keep the thread warm',icon:'keep'},
 notnow:{label:'Not now',desc:'Quietly close, no awkwardness',icon:'pause'}
};

/* ---------- store ---------- */
const KEY='introthread_v1';
let DB=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:[],session:null,threads:[],rooms:[]}}catch(e){return{users:[],session:null,threads:[],rooms:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const me=()=>DB.users.find(u=>u.id===DB.session);
const myThreads=()=>DB.threads.filter(t=>t.ownerId===DB.session).sort((a,b)=>b.createdAt-a.createdAt);
const myRooms=()=>DB.rooms.filter(r=>r.ownerId===DB.session).sort((a,b)=>b.date-a.date);
const findThread=id=>DB.threads.find(t=>t.id===id);

function threadState(t){
 if(t.mine==='notnow'||t.theirs==='notnow'){if(t.mine&&t.theirs)return'closed'}
 if(t.resolvedAt)return'resolved';
 if(t.mine&&t.theirs)return t.mine==='notnow'||t.theirs==='notnow'?'closed':'matched';
 if(!t.confirmed)return'pending';
 return'open';
}
function stateChip(t){const s=threadState(t);return{
 pending:'<span class="chip orange">Awaiting confirmation</span>',
 open:'<span class="chip blue">Waiting on "What\'s next?"</span>',
 matched:'<span class="chip green">Matched, act now</span>',
 resolved:'<span class="chip dark">Resolved</span>',
 closed:'<span class="chip">Closed gently</span>'}[s]}
/* Resolve window: 7 days. Pulse = remaining share. */
function pulse(t){if(t.resolvedAt||threadState(t)==='closed')return 1;const left=Math.max(0,t.createdAt+7*DAY-Date.now());return left/(7*DAY)}
function ring(t){const p=pulse(t),st=threadState(t);const c=st==='resolved'?'#0f1218':st==='closed'?'#98a2b3':p>.5?'#3157ff':p>.2?'#ff6b3d':'#d14343';const r=18,C=2*Math.PI*r;const days=Math.ceil(p*7);
 const label=st==='resolved'?ic('check',14,'#0f1218',3):st==='closed'?'–':days+'d';
 return`<div class="ring" title="Thread pulse"><svg width="44" height="44"><circle cx="22" cy="22" r="${r}" stroke="#eceef2" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="${r}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div class="t" style="color:${c}">${label}</div></div>`}
function warmth(t){let s=1;if(t.confirmed)s++;if(t.mine&&t.theirs)s++;if(t.events.some(e=>e.k==='followup'))s++;if(t.resolvedAt)s++;return s}
const warmBar=n=>`<div class="warm" title="Verified warmth ${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;

function seed(u){
 const now=Date.now();
 const people=[
  ['Sarah Williams','Marketing Director','Acme Technologies','London Tech Week','Interested in an enterprise partnership. Wants a pilot proposal.',2*DAY,true,'meet','meet',false],
  ['James Carter','CEO','Northwind Capital','SaaStr Europa','Raising a fund focused on HR tech. Asked about our data story.',4*DAY,true,'intro',null,false],
  ['Priya Shah','Head of Platform','Lattice Ventures','Founders Breakfast, Shoreditch','Runs portfolio talent programme. Possible design partner.',6*DAY+10*HR,true,null,null,false],
  ['Daniel Okafor','Partner','Atlas Seed','Web Summit','Great chat on Africa to UK expansion.',11*DAY,true,'keep','keep',true],
  ['Emma Laurent','Product Lead','Helio','London Tech Week','Not a fit right now.',9*DAY,true,'notnow','keep',false],
  ['Michael Brown','VP Sales','Brightline','Coffee, Kings Cross','',5*HR,false,null,null,false]
 ];
 const room={id:uid(),ownerId:u.id,name:'London Tech Week Founders Night',date:now-2*DAY,location:'Shoreditch, London',code:'LTW26',created:now-3*DAY};
 DB.rooms.push(room);
 people.forEach(([name,role,company,where,note,age,conf,mine,theirs,res],i)=>{
  const c=now-age;const t={id:uid(),ownerId:u.id,other:{name,role,company,email:slug(name)+'@example.com'},where,note,createdAt:c,confirmed:conf,mine,theirs,resolvedAt:res?c+3*DAY:null,roomId:where==='London Tech Week'?room.id:null,
   events:[{k:'tap',at:c,text:'Tapped at '+where}]};
  if(conf)t.events.push({k:'confirm',at:c+20*6e4,text:name.split(' ')[0]+' confirmed the Thread'});
  if(mine)t.events.push({k:'answer',at:c+HR,text:'You answered "What\'s next?"'});
  if(theirs)t.events.push({k:'answer',at:c+3*HR,text:name.split(' ')[0]+' answered "What\'s next?"'});
  if(res){t.events.push({k:'followup',at:c+DAY,text:'Follow-up sent'});t.events.push({k:'resolved',at:c+3*DAY,text:'Thread resolved: stayed in touch'})}
  DB.threads.push(t)});
 for(let i=0;i<14;i++){const n=['Ava Thompson','Leo Martins','Grace Kim','Noah Patel','Zara Ahmed','Oliver Grant','Mia Rossi','Ethan Cole','Isla Murray','Lucas Bauer','Chloe Evans','Ben Adeyemi','Sofia Ruiz','Jack Turner'][i];
  const c=room.date+i*9*6e4;const mine=['meet','intro','keep','keep','meet',null,'notnow'][i%7];const theirs=i%3?mine:'keep';
  DB.threads.push({id:uid(),ownerId:u.id,other:{name:n,role:['Founder','Investor','Engineer','Designer','Operator'][i%5],company:['Kite','Orbit','Fable','Verve','Atlas'][i%5],email:slug(n)+'@example.com'},where:room.name,note:'',createdAt:c,confirmed:i%5!==4,mine,theirs:i%5!==4?theirs:null,resolvedAt:i%4===0?c+DAY:null,roomId:room.id,events:[{k:'tap',at:c,text:'Tapped in room '+room.code}]})}
}
/* ---------- UI helpers ---------- */
function toast(msg){const t=$('#toast');t.innerHTML=ic('check',16,'#7ee2b0',3)+esc(msg);t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function modal(html){$('#modal').innerHTML=html;$('#mback').classList.add('open')}
function closeModal(){$('#mback').classList.remove('open')}
function RH(){return '#'+(location.pathname||'/')}
function go(h){const p=String(h).replace(/^#/,'')||'/';if(location.pathname!==p){history.pushState(null,'',p);window.dispatchEvent(new Event('itroute'))}}
function copy(text,msg){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(msg||'Copied'),()=>{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();toast(msg||'Copied')})}
let profileUrl=u=>'https://introthread.com/'+u.handle;
function qr(el,text,size=150){if(!el)return;el.innerHTML='';try{if(window.qrcode){const q=qrcode(0,'M');q.addData(text);q.make();el.innerHTML=q.createImgTag(Math.max(2,Math.floor(size/q.getModuleCount())),0)}else throw 0}catch(e){el.innerHTML=`<div style="width:${size}px;height:${size}px;background:repeating-conic-gradient(#0f1218 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:6px"></div>`}}

<a href="#/how" class="${on==='how'?'on':''}">How it works</a><a href="#/rooms" class="${on==='rooms'?'on':''}">Events &amp; communities</a><a href="#/networks" class="${on==='networks'?'on':''}">For networks</a><a href="#/pricing" class="${on==='pricing'?'on':''}">Pricing</a></nav>

 return{meet:`Hi ${f},\n\nGreat meeting you at ${t.where}.${ctx} We both said we'd like to meet again, so let's make it happen. Would any of these work for a 30-minute call?\n\n- Thursday, 10:00\n- Friday, 14:30\n- Next Tuesday, 11:00\n\nOr grab a time here: introthread.com/${u.handle}\n\nBest,\n${u.name.split(' ')[0]}`,

function roomStats(r){const T=DB.threads.filter(t=>t.roomId===r.id);const v=T.filter(t=>t.confirmed).length,a=T.filter(t=>t.mine||t.theirs).length,m=T.filter(t=>t.mine&&t.mine===t.theirs&&t.mine!=='notnow').length,res=T.filter(t=>t.resolvedAt).length;return{T,v,a,m,res,rate:T.length?Math.round(res/T.length*100):0}}
function vRooms(){const R=myRooms();return shell('rooms',`<div class="ph"><div><div class="eyebrow">Thread Rooms</div><h1>Events and communities</h1><p>Every tap in a Room becomes a Thread. See which connections went somewhere.</p></div><button class="btn primary" onclick="newRoomModal()">${ic('plus',16)} Create a Room</button></div>

function vRoom(id){const r=DB.rooms.find(x=>x.id===id);if(!r)return shell('rooms','<div class="card empty">Room not found.</div>');const s=roomStats(r);const by=k=>s.T.filter(t=>t.mine===k||t.theirs===k).length;
 return shell('rooms',`<a href="#/app/rooms" class="small muted" style="font-weight:800">&larr; Rooms</a><div class="ph" style="margin-top:14px"><div><div class="eyebrow">Resolution Report &middot; ${esc(r.code)}</div><h1>${esc(r.name)}</h1><p>${fmtDate(r.date)}${r.location?' &middot; '+esc(r.location):''}</p></div><div class="row"><button class="btn secondary" onclick="exportRoom('${r.id}')">${ic('chart',16)} Export CSV</button><button class="btn primary" onclick="simTap('${r.id}')">${ic('tap',16)} Simulate a tap</button></div></div>
 <div class="grid g4">${[['Threads',s.T.length],['Verified by both',s.v],['Mutual matches',s.m],['Resolution rate',s.rate+'%']].map(([l,v])=>`<div class="metric"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:1fr 1.3fr;margin-top:20px"><div class="stack" style="gap:18px"><div class="card pad"><b>What people want next</b>${Object.entries(NEXT).map(([k,v])=>{const n=by(k);return`<div class="row between small" style="margin:14px 0 6px"><span>${v.label}</span><b>${n}</b></div><div class="bar"><i style="width:${s.T.length?n/s.T.length*100:0}%"></i></div>`}).join('')}</div>
 <div class="card pad center"><b>Room QR</b><p class="small muted">Put this on screens, badges and tables.</p><div class="qrbox" id="qrRoom" style="border:1px solid var(--line)"></div><div class="small" style="margin-top:8px;font-weight:800">introthread.com/r/${esc(r.code)}</div></div></div>
 <div class="card pad livefeed"><div class="row between"><b>Live Threads</b><span class="chip green">Live</span></div><div class="stack" style="gap:8px;margin-top:14px">${s.T.sort((a,b)=>b.createdAt-a.createdAt).map(t=>`<div class="tl" onclick="go('#/app/thread/${t.id}')" style="cursor:pointer">${av(t.other.name,'sm')}<div class="meta"><b>${esc(t.other.name)}</b><span>${esc(t.other.role)}, ${esc(t.other.company)} &middot; ${ago(t.createdAt)}</span></div>${stateChip(t)}</div>`).join('')||'<div class="empty">No taps yet.</div>'}</div></div></div>`)}
function simTap(rid){const r=DB.rooms.find(x=>x.id===rid);const N=['Hannah Reid','Omar Haddad','Lily Chen','Samuel Ndungu','Ruby Walsh','Tom Fischer','Aisha Bello','Max Larsen'];const n=N[Math.floor(Math.random()*N.length)];
 DB.threads.push({id:uid(),ownerId:DB.session,other:{name:n,role:['Founder','Investor','Head of Growth','CTO'][Math.floor(Math.random()*4)],company:['Nova','Pillar','Quanta','Rivet'][Math.floor(Math.random()*4)],email:slug(n)+'@example.com'},where:r.name,note:'',createdAt:Date.now(),confirmed:true,mine:null,theirs:['meet','intro','keep'][Math.floor(Math.random()*3)],resolvedAt:null,roomId:r.id,events:[{k:'tap',at:Date.now(),text:'Tapped in room '+r.code},{k:'confirm',at:Date.now(),text:n.split(' ')[0]+' confirmed the Thread'}]});save();toast(n+' just tapped in');render()}

 const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='resolution-report.csv';a.click();toast('Report downloaded')}

/* ===== v6 Tap to Thread: card tags, recent activity, sharing analytics ===== */
function tapTags(u){const c=['b','v','g'];const t=(u.tags||[]).filter(Boolean).slice(0,3);return t.length?`<div class="t-tags">${t.map((x,k)=>`<span class="${c[k]}">${esc(x)}</span>`).join('')}</div>`:''}
function tapInsights(){const T=myThreads().slice().sort((a,b)=>b.createdAt-a.createdAt);const D=864e5,now=Date.now();
 const m30=T.filter(t=>now-t.createdAt<30*D),conf=m30.filter(t=>t.confirmed).length,both=m30.filter(t=>t.mine&&t.theirs).length,rate=m30.length?Math.round(conf/m30.length*100):0;
 const days=[...Array(7)].map((_,k)=>{const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()-(6-k));const e=s.getTime()+D;return{l:s.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2),n:T.filter(t=>t.createdAt>=s.getTime()&&t.createdAt<e).length}});const mx=Math.max(1,...days.map(d=>d.n));
 const wk=days.reduce((a,d)=>a+d.n,0);
 const act=T.slice(0,5).map(t=>`<button type="button" class="t-act" onclick="go('/app/thread/${t.id}')">${av(t.other.name,'sm')}<span class="t-act-m"><b>${esc(t.other.name)}</b><small>${esc([t.other.role,t.other.company].filter(Boolean).join(', ')||'New connection')} &middot; ${esc(t.where||'In person')}</small></span><span class="t-act-r">${stateChip(t)}<small>${ago(t.createdAt)}</small></span></button>`).join('');
 const st=(n,l,s)=>`<div class="t-stat"><b>${n}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
 return`<div class="t-ins">
 <section class="t-panel"><div class="t-panel-h"><div><h3>Recent activity</h3><p>Your latest Threads and where each one stands.</p></div><a href="/app/threads">View all ${sv('chev',14)}</a></div>
  ${act?`<div class="t-acts-l">${act}</div>`:`<div class="t-empty">${sv('link',22)}<b>No Threads yet</b><small>Start your first Thread above. It will appear here with its status.</small></div>`}</section>
 <section class="t-panel"><div class="t-panel-h"><div><h3>Sharing analytics</h3><p>Last 30 days</p></div></div>
  <div class="t-stats">${st(m30.length,'Threads started')}${st(conf,'Confirmed',m30.length?rate+'% confirmation rate':'')}${st(both,'Both answered','&ldquo;What&rsquo;s next?&rdquo;')}${st(wk,'This week')}</div>
  <div class="t-chart" role="img" aria-label="Threads started in the last 7 days">${days.map(d=>`<div><span style="height:${Math.round(d.n/mx*100)}%" title="${d.n} Thread${d.n===1?'':'s'}"></span><small>${d.l}</small></div>`).join('')}</div></section>
 </div>`}

/* ===== v16 Account menu: one professional dropdown for the top bar and the sidebar footer ===== */
function amClose(){const m=document.getElementById('acm');if(m)m.remove();document.querySelectorAll('[data-am]').forEach(b=>b.setAttribute('aria-expanded','false'));document.removeEventListener('keydown',amKey,true);document.removeEventListener('mousedown',amOut,true)}
function amOut(e){const m=document.getElementById('acm');if(m&&!m.contains(e.target)&&!e.target.closest('[data-am]'))amClose()}
function amKey(e){const m=document.getElementById('acm');if(!m)return;const it=[...m.querySelectorAll('[role="menuitem"]')];const i=it.indexOf(document.activeElement);
 if(e.key==='Escape'){e.preventDefault();const t=document.querySelector('[data-am][aria-expanded="true"]');amClose();if(t)t.focus()}
 else if(e.key==='ArrowDown'){e.preventDefault();(it[(i+1)%it.length]||it[0]).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(it[(i-1+it.length)%it.length]||it[0]).focus()}
 else if(e.key==='Tab'){amClose()}}
function amGo(path,tab){amClose();if(tab){STAB=tab}go(path)}
function acctMenu(btn,dir){const open=document.getElementById('acm');if(open){const same=btn&&btn.getAttribute('aria-expanded')==='true';amClose();if(same)return}
 const u=me();if(!u)return;btn=btn||document.querySelector('.t-user');const pro=u.plan&&u.plan!=='Free';const pub=!(u.links&&u.links.hidden);
 const it=(ic,l,act,o={})=>`<button type="button" role="menuitem" class="am-it ${o.cls||''}" onclick="${act}">${sv(ic,18)}<span>${l}</span>${o.badge?`<em class="${o.bc||''}">${o.badge}</em>`:''}${o.ext?sv('arrow',14):''}</button>`;
 const m=document.createElement('div');m.id='acm';m.className='am';m.setAttribute('role','menu');m.setAttribute('aria-label','Account menu');
 m.innerHTML=`<div class="am-h">${avatarC(u,48)}<div class="am-hi"><b>${esc(u.name||'')}</b><small>${esc(u.email||('introthread.com/'+u.handle))}</small><span class="am-tags"><span class="am-plan ${pro?'pro':''}">${pro?sv('spark',11)+' '+esc(u.plan):'Free plan'}</span><span class="am-vis ${pub?'':'off'}"><i></i>${pub?'Profile live':'Profile private'}</span></span></div></div>
 <div class="am-link"><span>introthread.com/${esc(u.handle)}</span><button type="button" role="menuitem" aria-label="Copy my link" onclick="copy('${profileUrl(u)}','Link copied')">${sv('copy',15)}</button></div>
 <div class="am-g">${it('user','My card',"amGo('/app/card')")}${it('globe','Public profile',"amGo('/app/profile')")}${it('eye','View as visitor',`amClose();window.open('/${esc(u.handle)}','_blank','noopener')`,{ext:1})}</div>
 <div class="am-g">${it('gear','Account settings',"amGo('/app/settings','account')")}${it('shield','Privacy &amp; visibility',"amGo('/app/settings','privacy')")}${it('bell','Notifications',"amGo('/app/settings','notifications')")}${it('brief','Plan &amp; billing',"amGo('/app/settings','billing')",{badge:pro?'':'Upgrade',bc:'up'})}</div>
 <div class="am-g">${it('mail','Help &amp; support',"amClose();location.href='mailto:hello@introthread.com?subject=Introthread%20support'")}${it('play','How Introthread works',"amClose();go('/how')")}</div>
 <div class="am-g">${it('out','Log out',"amClose();logout()",{cls:'am-out'})}</div>`;
 document.body.appendChild(m);btn.setAttribute('aria-expanded','true');
 const r=btn.getBoundingClientRect(),W=m.offsetWidth,H=m.offsetHeight,vw=innerWidth,vh=innerHeight;let left,top;
 if(dir==='up'){left=Math.max(8,Math.min(r.left,vw-W-8));top=Math.max(8,r.top-H-8)}else{left=Math.max(8,Math.min(r.right-W,vw-W-8));top=Math.min(r.bottom+8,vh-H-8);if(top<8)top=8}
 m.style.left=left+'px';m.style.top=top+'px';m.classList.add(dir==='up'?'up':'down');
 document.addEventListener('keydown',amKey,true);setTimeout(()=>document.addEventListener('mousedown',amOut,true),0);
 const f=m.querySelector('[role="menuitem"]');if(f)f.focus({preventScroll:true})}
window.addEventListener('resize',amClose);window.addEventListener('itroute',amClose);window.addEventListener('popstate',amClose);
const _shell16=shell;shell=function(on,inner){let h=_shell16(on,inner);const u=me();if(!u)return h;const pro=u.plan&&u.plan!=='Free';
