<style>
:root{--bg:#f7f8fa;--surface:#fff;--ink:#0f1218;--text:#111318;--muted:#667085;--line:#e6e8ec;--brand:#3157ff;--brand2:#2341c8;--soft:#eef2ff;--thread:#ff6b3d;--ok:#12a065;--warn:#c58a12;--bad:#d14343;--r:16px;--sh:0 10px 30px rgba(16,24,40,.07);--sh2:0 30px 80px rgba(16,24,40,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--xss);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%}
.serif{font-family:var(--xsf);font-weight:400;font-style:italic;letter-spacing:-.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:14px;transition:.15s}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(49,87,255,.25)}.btn.primary:hover{background:var(--brand2);transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#262b36}
.btn.secondary{background:#fff;border:1px solid var(--line);color:#344054}.btn.secondary:hover{border-color:#c9ced8}
.btn.ghost{background:transparent;color:var(--brand)}.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}.btn.lg{padding:15px 24px;font-size:15px}.btn.block{width:100%}
.btn.danger{background:#fff1f1;color:var(--bad)}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.6px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.logo b{color:var(--brand);font-weight:900}
.eyebrow{font-size:11.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap-row{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}.pad{padding:22px}.pad-lg{padding:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#f2f4f7;color:#475467;font-size:11.5px;font-weight:750}
.chip.blue{background:var(--soft);color:var(--brand)}.chip.green{background:#e8f8f0;color:#0e7c4f}.chip.orange{background:#fff3e8;color:#b5541d}.chip.red{background:#fff1f1;color:#b42318}.chip.dark{background:var(--ink);color:#fff}
input,select,textarea{width:100%;border:1px solid #dde1e7;border-radius:11px;padding:12px 13px;background:#fff;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px #eef2ff}
.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12.5px;font-weight:800;color:#344054}.field .hint{font-size:11.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:850;font-size:13px;flex:none}
.avatar.lg{width:64px;height:64px;font-size:20px}.avatar.xl{width:88px;height:88px;font-size:28px}.avatar.sm{width:30px;height:30px;font-size:11px}
/* marketing */
.mnav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(230,232,236,.7)}
.mnav .in{max-width:1240px;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.mnav .links{display:flex;gap:28px;font-size:14px;font-weight:700;color:#344054}.mnav .links a:hover,.mnav .links a.on{color:var(--brand)}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
.hero{padding:84px 0 70px;background:radial-gradient(1200px 500px at 80% -10%,#e9eeff 0,transparent 60%),radial-gradient(800px 400px at -10% 10%,#fff1ea 0,transparent 55%),#fff}
.hero .in{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.hero h1{font-size:68px;line-height:1.0;letter-spacing:-3.4px;margin:18px 0 22px}
.hero p.lead{font-size:19px;line-height:1.6;color:#4a5465;max-width:580px}
.badge-line{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:13px;font-weight:700;color:#344054}
.badge-line .dot{background:var(--ink);color:#fff;border-radius:99px;padding:3px 9px;font-size:11px}
.trust{display:flex;gap:22px;margin-top:34px;color:var(--muted);font-size:13px;font-weight:700;flex-wrap:wrap}
.trust span{display:flex;align-items:center;gap:7px}
.sec{padding:100px 0}.sec.alt{background:var(--bg)}.sec.dark{background:var(--ink);color:#fff}
.sec h2{font-size:48px;letter-spacing:-2.2px;line-height:1.05;margin:12px 0 18px}.sec p.lead{font-size:18px;color:#5b6576;line-height:1.7;max-width:720px}
.sec.dark p.lead{color:#aab3c4}
/* demo stage */
.stage{position:relative;height:560px}
.phone{position:absolute;width:270px;height:540px;border-radius:44px;background:#0b0d12;padding:12px;box-shadow:var(--sh2)}
.phone .scr{width:100%;height:100%;border-radius:34px;background:#fff;overflow:hidden;position:relative}
.phone.a{left:0;top:20px;transform:rotate(-6deg)}.phone.b{right:0;top:0;transform:rotate(5deg)}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#0b0d12;border-radius:99px;z-index:3}
.scr .top{padding:46px 18px 14px}
.tapwave{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:wave 3s infinite;z-index:5}
.tapwave.d2{animation-delay:1s}.tapwave.d3{animation-delay:2s}
@keyframes wave{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.threadline{position:absolute;left:24%;right:24%;top:50%;height:3px;background:linear-gradient(90deg,var(--brand),var(--thread));border-radius:3px;z-index:4;transform-origin:left;animation:draw 3s infinite}
@keyframes draw{0%,20%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
.mini-card{margin:0 14px;border-radius:18px;background:linear-gradient(150deg,#10131a,#273047);color:#fff;padding:18px}
.q-opt{display:flex;align-items:center;justify-content:space-between;margin:8px 14px 0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;font-weight:750}
.q-opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px}
.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.step .n{font-size:13px;font-weight:900;color:var(--brand);letter-spacing:.1em}
.step h3{font-size:24px;letter-spacing:-.8px;margin:14px 0 8px}.step p{color:var(--muted);line-height:1.6;margin:0}
.step .vis{height:150px;margin-top:22px;border-radius:14px;background:var(--bg);display:grid;place-items:center;position:relative;overflow:hidden}
.compare{width:100%;border-collapse:separate;border-spacing:0;margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.compare th,.compare td{padding:16px 18px;text-align:left;border-bottom:1px solid #eef0f3;font-size:14px}
.compare th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#98a2b3;background:#fafbfc}
.compare td.us{background:#f5f7ff;font-weight:800;color:var(--brand)}.compare tr:last-child td{border-bottom:0}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.layer{border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.layer h3{font-size:22px;margin:14px 0 8px}.layer p{color:#aab3c4;line-height:1.6;margin:0}
.price{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--brand);box-shadow:0 20px 50px rgba(49,87,255,.15)}
.plan .amt{font-size:40px;font-weight:900;letter-spacing:-1.5px;margin:12px 0 2px}.plan ul{list-style:none;padding:0;margin:18px 0 24px;flex:1}
.plan li{display:flex;gap:9px;font-size:13.5px;margin:10px 0;color:#344054}
.seg{display:inline-flex;background:#f2f4f7;border-radius:12px;padding:4px}.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:800;font-size:13px;color:#475467}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cta{background:var(--ink);color:#fff;border-radius:28px;padding:80px 30px;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:52px;letter-spacing:-2px;margin:0 0 14px}.cta p{color:#aab3c4;font-size:18px}
.foot{background:var(--ink);color:#98a2b3;padding:70px 0 40px}.foot .grid{grid-template-columns:1.6fr repeat(4,1fr)}.foot h4{color:#fff;margin:0 0 14px;font-size:14px}.foot a{display:block;margin:9px 0;font-size:13.5px}.foot a:hover{color:#fff}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:10px}.faq summary{font-weight:800;cursor:pointer}.faq p{color:var(--muted);line-height:1.6;margin:12px 0 0}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .form{display:grid;place-items:center;padding:40px;background:#fff}.auth .box{width:min(420px,100%)}
.auth h1{font-size:34px;letter-spacing:-1.2px;margin:0 0 8px}
.oauth{display:grid;gap:10px;margin:24px 0}.or{display:flex;align-items:center;gap:12px;color:#98a2b3;font-size:12px;margin:18px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.progress{display:flex;gap:6px;margin-bottom:26px}.progress span{flex:1;height:5px;border-radius:9px;background:#eceef2}.progress span.on{background:var(--brand)}
/* app */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#475467;font-size:14px;font-weight:650;margin:2px 0}
.nav:hover{background:#f5f6f8}.nav.on{background:var(--soft);color:var(--brand);font-weight:800}.nav .cnt{margin-left:auto;background:var(--thread);color:#fff;border-radius:99px;font-size:10.5px;padding:2px 7px;font-weight:850}
.navgroup{margin:18px 0 6px;padding:0 12px;color:#98a2b3;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:850}
.main{margin-left:252px;flex:1;min-width:0}
.topbar{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:9px;width:380px;background:#f5f6f8;border:1px solid var(--line);border-radius:11px;padding:9px 13px;color:#98a2b3;font-size:13.5px}
.search input{border:0;background:transparent;padding:0;box-shadow:none!important}
.content{padding:30px;max-width:1320px;margin:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}.ph h1{font-size:30px;letter-spacing:-1.1px;margin:6px 0 6px}.ph p{margin:0;color:var(--muted)}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}.metric .l{font-size:12.5px;color:var(--muted);font-weight:700}.metric .v{font-size:30px;font-weight:900;letter-spacing:-1px;margin:6px 0 2px}.metric .d{font-size:12px;color:var(--ok);font-weight:750}
.tl{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:.15s;cursor:pointer}
.tl:hover{border-color:#c7d0ff;box-shadow:0 6px 18px rgba(49,87,255,.08)}
.tl .meta{flex:1;min-width:0}.tl .meta b{display:block;font-size:14.5px}.tl .meta span{font-size:12.5px;color:var(--muted)}
.ring{width:44px;height:44px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:900}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{border:0;background:transparent;padding:11px 14px;font-weight:800;color:#667085;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}.tabs button.on{color:var(--brand);border-color:var(--brand)}
.answer{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ans{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;transition:.15s}
.ans:hover{border-color:#b9c4ff}.ans.on{border-color:var(--brand);background:var(--soft)}.ans b{display:block;font-size:15px;margin:8px 0 3px}.ans span{font-size:12.5px;color:var(--muted)}
.reveal{border-radius:18px;padding:22px;background:linear-gradient(135deg,#0f1218,#24304d);color:#fff;position:relative;overflow:hidden}
.side-two{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.lock{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.event{position:relative;padding:0 0 18px 26px}.event:before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:1.5px;background:#e3e6eb}.event:last-child:before{display:none}
.event:after{content:"";position:absolute;left:2px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--brand)}
.event b{font-size:13.5px}.event div{font-size:12.5px;color:var(--muted);margin-top:2px}
.bizcard{border-radius:22px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:250px;box-shadow:var(--sh2)}
.bizcard:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-120px;background:rgba(255,255,255,.07)}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:inline-block;line-height:0}
.qrbox img,.qrbox canvas{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:999;box-shadow:var(--sh2);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.5);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.open{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:var(--sh2);padding:28px;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.x{border:0;background:#f2f4f7;border-radius:9px;width:34px;height:34px;display:grid;place-items:center}
.draft{background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.warm{display:flex;gap:3px}.warm i{width:7px;height:16px;border-radius:3px;background:#e6e8ec}.warm i.on{background:linear-gradient(180deg,var(--thread),#ff9a6b)}
.mobile-tab{display:none}
.pub{min-height:100vh;background:radial-gradient(900px 500px at 50% -20%,#e6ecff,transparent 60%),var(--bg);padding:30px 16px 60px}
.pubcard{max-width:440px;margin:0 auto}
.livefeed .tl{cursor:default}
@media(max-width:1000px){.hero .in,.auth{grid-template-columns:1fr}.auth .side{display:none}.stage{height:520px;max-width:560px;margin:auto}.steps,.layers,.g3,.g4,.price{grid-template-columns:1fr 1fr}.foot .grid{grid-template-columns:1fr 1fr}.hero h1{font-size:50px;letter-spacing:-2px}.mnav .links{display:none}.sec h2{font-size:38px}}
@media(max-width:760px){.sidebar{display:none}.main{margin-left:0}.search{display:none}.content{padding:18px 16px 90px}.g2,.steps,.layers,.g3,.g4,.price,.answer{grid-template-columns:1fr}.mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:8px 0 14px}.mobile-tab a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:#667085}.mobile-tab a.on{color:var(--brand)}.hero h1{font-size:42px}.phone{width:220px;height:450px}.stage{height:470px}.compare{font-size:12px}.cta h2{font-size:36px}.side-two{grid-template-columns:1fr}.topbar{padding:0 16px}}

/* ===== v4 design system: navy + blue, Instrument Serif + Manrope ===== */
:root{--xb:#1f5eff;--xb2:#1748d6;--xink:#0b1122;--xtx:#1d2433;--xmu:#5b6478;--xln:#e6e9f0;--xbg:#f7f8fb;--xor:#ff6a3d;--xsf:'Instrument Serif',Georgia,serif;--xss:Manrope,Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.x-wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.x-logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--xss);font-weight:700;font-size:22px;letter-spacing:-.4px;color:var(--xink);text-decoration:none}
.x-logo b{font-weight:700;color:var(--xb)}.x-logo.dk{color:#fff}.x-logo.dk b{color:#4f86ff}
.x-lm{display:inline-flex;align-items:center}.x-lm i{width:17px;height:17px;border-radius:50%;background:var(--xink);display:block}.x-lm i+i{background:var(--xor);margin-left:-6px;opacity:.95}
.x-logo.dk .x-lm i:first-child,.x-card .x-lm i:first-child{background:#fff}.x-card.lt .x-lm i:first-child{background:var(--xink)}
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:10px;padding:12px 20px;background:var(--xb);color:#fff;font:700 14.5px/1 var(--xss);text-decoration:none;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s;box-shadow:0 8px 22px -8px rgba(31,94,255,.6)}
.x-btn:hover{background:var(--xb2);transform:translateY(-1px)}.x-btn:disabled{opacity:.7;cursor:wait;transform:none}
.x-btn.sm{padding:10px 16px;font-size:13.5px}.x-btn.lg{padding:16px 24px;font-size:15.5px}.x-btn.block{width:100%}.x-btn.grow{flex:1}
.x-btn.ghost{background:#fff;color:var(--xtx);border:1px solid var(--xln);box-shadow:none}.x-btn.ghost:hover{border-color:#c5cbd8;background:#fff}

.v-ph i{width:22px;height:22px;border-radius:50%;background:var(--xor);display:block}.v-ph b{width:32px;height:4px;border-radius:2px;background:rgba(255,255,255,.5)}.v-ph s{width:38px;height:9px;border-radius:3px;background:var(--xb);margin-top:6px}

/* privacy */
.x-shield{width:300px;height:300px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#fff;font-family:var(--xss);background:radial-gradient(circle at 30% 25%,#2b4fb5,#0b1122 70%);box-shadow:0 40px 80px -30px rgba(8,14,40,.6),0 0 0 14px rgba(31,94,255,.08),0 0 0 28px rgba(31,94,255,.05);animation:xfloatB0 6s ease-in-out infinite}

<script>
/* Introthread prototype — local data store, router, views */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5,HR=36e5;
const COLORS=['#3157ff','#ff6b3d','#12a065','#7a5af8','#0ea5e9','#e11d74','#c58a12','#0f766e'];
const colorFor=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(n,cls='')=>`<div class="avatar ${cls}" style="background:${colorFor(n)}">${esc(initials(n))}</div>`;
const ago=t=>{const d=Date.now()-t;if(d<HR)return Math.max(1,Math.round(d/6e4))+'m ago';if(d<DAY)return Math.round(d/HR)+'h ago';return Math.round(d/DAY)+'d ago'};
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'me';

const IC={
 logo:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="3" fill="#fff"/><circle cx="18" cy="12" r="3" fill="#ff6b3d"/><path d="M9 12c2-4 4-4 6 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M9 12c2 4 4 4 6 0" stroke="#6f8cff" stroke-width="2" stroke-linecap="round"/></svg>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 thread:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12c2-4 5-4 7 0M8.5 12c2 4 5 4 7 0"/>',
 tap:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/><path d="M2 9c1.5-1.5 1.5-4.5 0-6M22 9c-1.5-1.5-1.5-4.5 0-6" transform="translate(0 6)"/>',
 room:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
 bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',
 intro:'<circle cx="5" cy="7" r="2.5"/><circle cx="19" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 8.5l3.5 7.5M17 8.5l-3.5 7.5"/>',
 keep:'<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',
 pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
 out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 nfc:'<path d="M6 8a6 6 0 010 8M10 5a10 10 0 010 14M14 2a14 14 0 010 20"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'
};
const ic=(n,s=18,c='currentColor',w=1.9)=>n==='logo'?IC.logo:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

/* What's next options */
const NEXT={
 meet:{label:'Meet again',desc:'Book a proper conversation',icon:'calendar'},
 intro:{label:'Introduce someone',desc:'One of us knows someone useful',icon:'intro'},
 keep:{label:'Stay in touch',desc:'Keep the thread warm',icon:'keep'},
 notnow:{label:'Not now',desc:'Quietly close, no awkwardness',icon:'pause'}
};

/* ---------- store ---------- */
const KEY='introthread_v1';
let DB=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:[],session:null,threads:[],rooms:[]}}catch(e){return{users:[],session:null,threads:[],rooms:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const me=()=>DB.users.find(u=>u.id===DB.session);
const myThreads=()=>DB.threads.filter(t=>t.ownerId===DB.session).sort((a,b)=>b.createdAt-a.createdAt);
const myRooms=()=>DB.rooms.filter(r=>r.ownerId===DB.session).sort((a,b)=>b.date-a.date);
const findThread=id=>DB.threads.find(t=>t.id===id);

function threadState(t){
 if(t.mine==='notnow'||t.theirs==='notnow'){if(t.mine&&t.theirs)return'closed'}
 if(t.resolvedAt)return'resolved';
 if(t.mine&&t.theirs)return t.mine==='notnow'||t.theirs==='notnow'?'closed':'matched';
 if(!t.confirmed)return'pending';
 return'open';
}
function stateChip(t){const s=threadState(t);return{
 pending:'<span class="chip orange">Awaiting confirmation</span>',
 open:'<span class="chip blue">Waiting on "What\'s next?"</span>',
 matched:'<span class="chip green">Matched, act now</span>',
 resolved:'<span class="chip dark">Resolved</span>',
 closed:'<span class="chip">Closed gently</span>'}[s]}
/* Resolve window: 7 days. Pulse = remaining share. */
function pulse(t){if(t.resolvedAt||threadState(t)==='closed')return 1;const left=Math.max(0,t.createdAt+7*DAY-Date.now());return left/(7*DAY)}
function ring(t){const p=pulse(t),st=threadState(t);const c=st==='resolved'?'#0f1218':st==='closed'?'#98a2b3':p>.5?'#3157ff':p>.2?'#ff6b3d':'#d14343';const r=18,C=2*Math.PI*r;const days=Math.ceil(p*7);
 const label=st==='resolved'?ic('check',14,'#0f1218',3):st==='closed'?'–':days+'d';
 return`<div class="ring" title="Thread pulse"><svg width="44" height="44"><circle cx="22" cy="22" r="${r}" stroke="#eceef2" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="${r}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div class="t" style="color:${c}">${label}</div></div>`}
function warmth(t){let s=1;if(t.confirmed)s++;if(t.mine&&t.theirs)s++;if(t.events.some(e=>e.k==='followup'))s++;if(t.resolvedAt)s++;return s}
const warmBar=n=>`<div class="warm" title="Verified warmth ${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;

function seed(u){
 const now=Date.now();
 const people=[
  ['Sarah Williams','Marketing Director','Acme Technologies','London Tech Week','Interested in an enterprise partnership. Wants a pilot proposal.',2*DAY,true,'meet','meet',false],
  ['James Carter','CEO','Northwind Capital','SaaStr Europa','Raising a fund focused on HR tech. Asked about our data story.',4*DAY,true,'intro',null,false],
  ['Priya Shah','Head of Platform','Lattice Ventures','Founders Breakfast, Shoreditch','Runs portfolio talent programme. Possible design partner.',6*DAY+10*HR,true,null,null,false],
  ['Daniel Okafor','Partner','Atlas Seed','Web Summit','Great chat on Africa to UK expansion.',11*DAY,true,'keep','keep',true],
  ['Emma Laurent','Product Lead','Helio','London Tech Week','Not a fit right now.',9*DAY,true,'notnow','keep',false],
  ['Michael Brown','VP Sales','Brightline','Coffee, Kings Cross','',5*HR,false,null,null,false]
 ];
 const room={id:uid(),ownerId:u.id,name:'London Tech Week Founders Night',date:now-2*DAY,location:'Shoreditch, London',code:'LTW26',created:now-3*DAY};
 DB.rooms.push(room);
 people.forEach(([name,role,company,where,note,age,conf,mine,theirs,res],i)=>{
  const c=now-age;const t={id:uid(),ownerId:u.id,other:{name,role,company,email:slug(name)+'@example.com'},where,note,createdAt:c,confirmed:conf,mine,theirs,resolvedAt:res?c+3*DAY:null,roomId:where==='London Tech Week'?room.id:null,
   events:[{k:'tap',at:c,text:'Tapped at '+where}]};
  if(conf)t.events.push({k:'confirm',at:c+20*6e4,text:name.split(' ')[0]+' confirmed the Thread'});
  if(mine)t.events.push({k:'answer',at:c+HR,text:'You answered "What\'s next?"'});
  if(theirs)t.events.push({k:'answer',at:c+3*HR,text:name.split(' ')[0]+' answered "What\'s next?"'});
  if(res){t.events.push({k:'followup',at:c+DAY,text:'Follow-up sent'});t.events.push({k:'resolved',at:c+3*DAY,text:'Thread resolved: stayed in touch'})}
  DB.threads.push(t)});
 for(let i=0;i<14;i++){const n=['Ava Thompson','Leo Martins','Grace Kim','Noah Patel','Zara Ahmed','Oliver Grant','Mia Rossi','Ethan Cole','Isla Murray','Lucas Bauer','Chloe Evans','Ben Adeyemi','Sofia Ruiz','Jack Turner'][i];
  const c=room.date+i*9*6e4;const mine=['meet','intro','keep','keep','meet',null,'notnow'][i%7];const theirs=i%3?mine:'keep';
  DB.threads.push({id:uid(),ownerId:u.id,other:{name:n,role:['Founder','Investor','Engineer','Designer','Operator'][i%5],company:['Kite','Orbit','Fable','Verve','Atlas'][i%5],email:slug(n)+'@example.com'},where:room.name,note:'',createdAt:c,confirmed:i%5!==4,mine,theirs:i%5!==4?theirs:null,resolvedAt:i%4===0?c+DAY:null,roomId:room.id,events:[{k:'tap',at:c,text:'Tapped in room '+room.code}]})}
}
/* ---------- UI helpers ---------- */
function toast(msg){const t=$('#toast');t.innerHTML=ic('check',16,'#7ee2b0',3)+esc(msg);t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function modal(html){$('#modal').innerHTML=html;$('#mback').classList.add('open')}
function closeModal(){$('#mback').classList.remove('open')}
function RH(){return '#'+(location.pathname||'/')}
function go(h){const p=String(h).replace(/^#/,'')||'/';if(location.pathname!==p){history.pushState(null,'',p);window.dispatchEvent(new Event('itroute'))}}
function copy(text,msg){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(msg||'Copied'),()=>{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();toast(msg||'Copied')})}
let profileUrl=u=>'https://introthread.com/'+u.handle;
function qr(el,text,size=150){if(!el)return;el.innerHTML='';try{if(window.qrcode){const q=qrcode(0,'M');q.addData(text);q.make();el.innerHTML=q.createImgTag(Math.max(2,Math.floor(size/q.getModuleCount())),0)}else throw 0}catch(e){el.innerHTML=`<div style="width:${size}px;height:${size}px;background:repeating-conic-gradient(#0f1218 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:6px"></div>`}}

function mnav(on){return`<header class="mnav"><div class="in">${logo()}<nav class="links">
<a href="#/how" class="${on==='how'?'on':''}">How it works</a><a href="#/rooms" class="${on==='rooms'?'on':''}">Events &amp; communities</a><a href="#/networks" class="${on==='networks'?'on':''}">For networks</a><a href="#/pricing" class="${on==='pricing'?'on':''}">Pricing</a></nav>
<div class="row">${me()?`<a class="btn primary sm" href="#/app">Open app</a>`:`<a href="#/login" class="btn ghost sm">Log in</a><a href="#/signup" class="btn primary sm">Get your card</a>`}</div></div></header>`}
function foot(){return`<footer class="foot"><div class="wrap"><div class="grid"><div>${logo(true)}<p style="max-width:300px;line-height:1.6;margin-top:16px">Every handshake, followed through. Verified professional relationships for the UK, USA and beyond.</p><p class="small">introthread.com</p></div>
<div><h4>Product</h4><a href="#/how">How it works</a><a href="#/rooms">Thread Rooms</a><a href="#/networks">Warmth for networks</a><a href="#/pricing">Pricing</a></div>
<div><h4>Use cases</h4><a href="#/rooms">Conferences</a><a href="#/networks">VC platform teams</a><a href="#/how">Founders</a><a href="#/how">Sales &amp; BD</a></div>
<div><h4>Company</h4><a href="#/about">About</a><a href="#/about">Contact</a><a href="#/signup">Get started</a></div>
<div><h4>Trust</h4><a href="#/privacy">Privacy</a><a href="#/privacy">Consent model</a><a href="#/privacy">Security</a></div></div>

 if(s===3)body=`<div class="eyebrow">Step 3 of 3</div><h1>Choose your card</h1><p class="muted">You can change this any time.</p><div class="grid g3" style="margin:20px 0">${Object.entries(THEMES).map(([k,v])=>`<button class="ans ${SU.theme===k?'on':''}" onclick="SU.theme='${k}';render()" style="padding:10px"><div style="height:62px;border-radius:10px;background:${v}"></div><b style="font-size:13px">${k[0].toUpperCase()+k.slice(1)}</b></button>`).join('')}</div>
 ${bizCard({name:SU.name,role:SU.role,company:SU.company,handle:SU.handle,theme:SU.theme||'midnight',city:SU.city})}<div class="row" style="margin-top:20px"><button class="btn secondary" onclick="SU.step=2;render()">Back</button><button class="btn primary" style="flex:1" onclick="su3()">Create my card</button></div>`;
 return`<div class="auth">${authSide()}<div class="form"><div class="box">${bar}${body}${s===1?`<p class="small muted center" style="margin-top:20px">Already have an account? <a href="#/login" style="color:var(--brand);font-weight:800">Log in</a></p>`:''}</div></div></div>`}
function su1(e){e.preventDefault();const em=$('#se').value.trim().toLowerCase();if(DB.users.some(u=>u.email===em)){$('#serr').textContent='An account with this email already exists. Log in instead.';return false}
 Object.assign(SU,{name:$('#sn').value.trim(),email:em,pw:btoa($('#sp').value),step:2});render();return false}
function su2(e){e.preventDefault();const h=slug($('#sh').value);if(DB.users.some(u=>u.handle===h)){$('#shh').textContent='That link is taken. Try another.';$('#shh').style.color='var(--bad)';return false}
 Object.assign(SU,{role:$('#sr').value.trim(),company:$('#sc').value.trim(),city:$('#sct').value.trim(),handle:h,bio:$('#sb').value.trim(),step:3,theme:SU.theme||'midnight'});render();return false}
function su3(){const u={id:uid(),name:SU.name,email:SU.email,pw:SU.pw,role:SU.role,company:SU.company,city:SU.city,bio:SU.bio,handle:SU.handle,theme:SU.theme||'midnight',links:{},plan:'Free',created:Date.now()};
 DB.users.push(u);DB.session=u.id;save();SU={step:1};modal(`<div class="center"><div style="width:64px;height:64px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',30,'#12a065',3)}</div><h2 style="letter-spacing:-.8px">Your card is live</h2><p class="muted">introthread.com/${esc(u.handle)}</p><p class="small muted">Want to see how Threads work with sample data first?</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn secondary" onclick="closeModal();go('#/app/tap')">Start sharing</button><button class="btn primary" onclick="seed(me());save();closeModal();render();toast('Sample Threads added')">Add sample Threads</button></div></div>`);go('#/app')}

/* ---------- app shell ---------- */

 const nav=(h,i,l,k,c)=>`<a href="${h}" class="nav ${on===k?'on':''}">${ic(i)}${l}${c?`<span class="cnt">${c}</span>`:''}</a>`;
 return`<div class="app"><aside class="sidebar"><div style="padding:6px 10px 18px">${logo(true)}</div>
 <a href="#/app/tap" class="btn primary block" style="margin-bottom:14px">${ic('tap',16)} Tap to Thread</a>
 ${nav('#/app','home','Today','today')}${nav('#/app/threads','thread','Threads','threads',open)}${nav('#/app/rooms','room','Rooms','rooms')}
 <div class="navgroup">You</div>${nav('#/app/card','user','My card','card')}${nav('#/app/profile','globe','Public profile','pub')}${nav('#/app/settings','gear','Settings','settings')}
 <div style="margin-top:auto" class="card pad" ><div class="small" style="font-weight:850">Your Warmth</div><div class="small muted" style="margin:4px 0 10px">${myThreads().filter(t=>t.confirmed).length} verified relationships</div>${warmBar(Math.min(5,1+Math.floor(myThreads().filter(t=>t.resolvedAt).length/2)))}</div>
 <div class="row" style="margin-top:14px;padding:8px">${av(u.name,'sm')}<div style="flex:1;min-width:0"><b class="small" style="display:block">${esc(u.name)}</b><span class="tiny muted">${esc(u.plan)} plan</span></div><button class="x" title="Log out" onclick="logout()">${ic('out',15)}</button></div></aside>
 <main class="main"><div class="topbar"><div class="search">${ic('search',16)}<input placeholder="Search Threads, people, rooms, events..." oninput="Q=this.value" onkeydown="if(event.key==='Enter')go('#/app/threads')"></div><div class="t-tb"><button type="button" class="t-chip" onclick="copy('${profileUrl(u)}','Link copied')" title="Copy your link">${sv('globe',16)}<span>introthread.com/${esc(u.handle)}</span>${sv('copy',16)}</button><button type="button" class="t-bell" onclick="showNudges()" aria-label="Nudges">${sv('bell',20)}${nudges().length?'<i></i>':''}</button><button type="button" class="t-user" onclick="acctMenu()">${avatarC(u,40)}<span><b>${esc(u.name)}</b><small>${esc(u.role||u.plan+' plan')}</small></span>${sv('chevd',16)}</button></div></div><div class="content">${inner}</div></main>
 <nav class="mobile-tab">${[['#/app','home','Today','today'],['#/app/threads','thread','Threads','threads'],['#/app/tap','tap','Tap','tap'],['#/app/rooms','room','Rooms','rooms'],['#/app/card','user','Card','card']].map(([h,i,l,k])=>`<a href="${h}" class="${on===k?'on':''}">${ic(i,20)}${l}</a>`).join('')}</nav></div>`}
let Q='';
function logout(){DB.session=null;save();toast('Logged out');go('#/')}
function tRow(t){return`<div class="tl" onclick="go('#/app/thread/${t.id}')">${ring(t)}${av(t.other.name)}<div class="meta"><b>${esc(t.other.name)}</b><span>${esc(t.other.role)}${t.other.company?', '+esc(t.other.company):''} &middot; ${esc(t.where)} &middot; ${ago(t.createdAt)}</span></div>${warmBar(warmth(t))}<div class="hide-sm">${stateChip(t)}</div></div>`}
function nudges(){return myThreads().filter(t=>{const s=threadState(t);return(s==='open'&&!t.mine)||s==='matched'||(s==='pending'&&Date.now()-t.createdAt>HR)})}
function showNudges(){const n=nudges();modal(`<div class="row between"><h3 style="margin:0">Nudges</h3><button class="x" onclick="closeModal()">&times;</button></div><div class="stack" style="margin-top:16px">${n.length?n.map(t=>`<div class="tl" onclick="closeModal();go('#/app/thread/${t.id}')">${av(t.other.name,'sm')}<div class="meta"><b>${esc(t.other.name)}</b><span>${threadState(t)==='matched'?'You matched. Send the follow-up.':threadState(t)==='pending'?'Waiting for them to confirm.':'Answer "What\'s next?" before the Thread fades.'}</span></div></div>`).join(''):'<div class="empty">All caught up.</div>'}</div>`)}

function vToday(){const u=me(),T=myThreads();const conf=T.filter(t=>t.confirmed).length,res=T.filter(t=>t.resolvedAt).length,ans=T.filter(t=>t.mine).length;
 const act=T.filter(t=>['matched','open','pending'].includes(threadState(t))).sort((a,b)=>pulse(a)-pulse(b));
 const h=new Date().getHours();const greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 return shell('today',`<div class="ph"><div><div class="eyebrow">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${greet}, ${esc(u.name.split(' ')[0])}</h1><p>${act.length?`${act.length} Thread${act.length>1?'s':''} need${act.length>1?'':'s'} a next step. The ones fading fastest are first.`:'Every Thread is resolved. Time to meet someone new.'}</p></div><div class="row"><button class="btn secondary" onclick="go('#/app/card')">${ic('user',16)} My card</button><button class="btn primary" onclick="go('#/app/tap')">${ic('tap',16)} Tap to Thread</button></div></div>
 <div class="grid g4">${[['Threads',T.length,'all time'],['Verified',conf,T.length?Math.round(conf/T.length*100)+'% confirmed by both':'confirmed by both'],['Answered',ans,'"What\'s next?" replies'],['Resolved',res,T.length?Math.round(res/T.length*100)+'% resolution rate':'resolution rate']].map(([l,v,d])=>`<div class="metric"><div class="l">${l}</div><div class="v">${v}</div><div class="d" style="color:var(--muted)">${d}</div></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:20px"><div class="card pad"><div class="row between" style="margin-bottom:14px"><b>Needs a next step</b><a href="#/app/threads" class="small" style="color:var(--brand);font-weight:800">All Threads</a></div><div class="stack" style="gap:10px">${act.slice(0,6).map(tRow).join('')||`<div class="empty">${ic('thread',40,'#c3c9d4')}<p>No open Threads yet.</p><button class="btn primary sm" onclick="go('#/app/tap')">Start your first Thread</button></div>`}</div></div>
 <div class="stack" style="gap:18px"><div class="card pad" style="background:var(--ink);color:#fff;border:0"><div class="tiny" style="letter-spacing:.12em;font-weight:800;color:#8ea2ff">YOUR CARD</div><div class="row" style="margin-top:14px;align-items:flex-start;justify-content:space-between"><div><b style="font-size:18px">${esc(u.name)}</b><div class="small" style="color:#aab3c4">${esc(u.role)}, ${esc(u.company)}</div><button class="btn sm" style="margin-top:18px;background:rgba(255,255,255,.1);color:#fff" onclick="copy('${profileUrl(u)}','Link copied')">${ic('link',14)} Copy link</button></div><div class="qrbox" id="qrToday"></div></div></div>
 <div class="card pad"><b>Thread pulse</b><p class="small muted" style="margin:6px 0 14px">Every Thread has 7 days to resolve. Blue is healthy, orange is fading, red is about to go cold.</p>${['matched','open','pending','resolved','closed'].map(s=>{const n=T.filter(t=>threadState(t)===s).length;return`<div class="row between small" style="margin:8px 0"><span>${{matched:'Matched',open:'Awaiting answers',pending:'Awaiting confirmation',resolved:'Resolved',closed:'Closed gently'}[s]}</span><b>${n}</b></div><div class="bar"><i style="width:${T.length?n/T.length*100:0}%;background:${{matched:'#12a065',open:'#3157ff',pending:'#ff6b3d',resolved:'#0f1218',closed:'#c3c9d4'}[s]}"></i></div>`}).join('')}</div></div></div>`)}

let TF='all';
function vThreads(){let T=myThreads();if(TF!=='all')T=T.filter(t=>threadState(t)===TF);if(Q)T=T.filter(t=>(t.other.name+t.other.company+t.where+t.note).toLowerCase().includes(Q.toLowerCase()));
 return shell('threads',`<div class="ph"><div><div class="eyebrow">Threads</div><h1>Every relationship, followed through</h1><p>${myThreads().length} Threads &middot; sorted by most recent</p></div><button class="btn primary" onclick="go('#/app/tap')">${ic('plus',16)} New Thread</button></div>
 <div class="row between wrap-row" style="margin-bottom:6px"><div class="tabs" style="border:0;margin:0;flex-wrap:wrap">${[['all','All'],['matched','Matched'],['open','Awaiting answers'],['pending','Awaiting confirmation'],['resolved','Resolved'],['closed','Closed']].map(([k,l])=>`<button class="${TF===k?'on':''}" onclick="TF='${k}';render()">${l}</button>`).join('')}</div><input style="max-width:260px" placeholder="Filter by name, company, place" value="${esc(Q)}" oninput="Q=this.value;clearTimeout(window._q);window._q=setTimeout(render,250)"></div>
 <div class="stack" style="gap:10px;margin-top:10px">${T.map(tRow).join('')||'<div class="card empty">No Threads match.</div>'}</div>`)}

function draftFor(t){const u=me(),f=t.other.name.split(' ')[0];const m=t.mine==='notnow'||t.theirs==='notnow'?'keep':t.mine;
 const ctx=t.note?` I keep thinking about what you said: ${t.note.replace(/\.$/,'').toLowerCase()}.`:'';
 return{meet:`Hi ${f},\n\nGreat meeting you at ${t.where}.${ctx} We both said we'd like to meet again, so let's make it happen. Would any of these work for a 30-minute call?\n\n- Thursday, 10:00\n- Friday, 14:30\n- Next Tuesday, 11:00\n\nOr grab a time here: introthread.com/${u.handle}\n\nBest,\n${u.name.split(' ')[0]}`,
 intro:`Hi ${f},\n\nIt was great to connect at ${t.where}.${ctx} As promised, I'd like to introduce you to someone I think you should know. I'll send a short double opt-in note first so it's useful for both of you.\n\nSpeak soon,\n${u.name.split(' ')[0]}`,
 keep:`Hi ${f},\n\nReally enjoyed our conversation at ${t.where}.${ctx} No agenda for now, I just wanted to say thanks and stay in touch. If there's ever anything I can help with, my details are at introthread.com/${u.handle}.\n\nAll the best,\n${u.name.split(' ')[0]}`}[m||'keep']}
function vThread(id){const t=findThread(id);if(!t||t.ownerId!==DB.session)return shell('threads','<div class="card empty">Thread not found. <a href="#/app/threads" style="color:var(--brand)">Back to Threads</a></div>');
 const s=threadState(t),both=t.mine&&t.theirs;const shareLink=threadLink(t);
 let reveal;
 if(!t.confirmed)reveal=`<div class="card pad-lg" style="border-style:dashed"><div class="row">${ic('mail',22,'#ff6b3d')}<div style="flex:1"><b>Waiting for ${esc(t.other.name.split(' ')[0])} to confirm</b><div class="small muted">They received a link. When they confirm, the relationship becomes verified.</div></div><button class="btn secondary sm" onclick="copy('${shareLink}','Thread link copied')">${ic('copy',14)} Copy link</button><button class="btn dark sm" onclick="go('#/t/${t.token||t.id}')">Open their view</button></div></div>`;
 else if(!t.mine)reveal=`<div class="card pad-lg"><div class="eyebrow">One question</div><h2 style="margin:6px 0 4px;letter-spacing:-1px">What's next with ${esc(t.other.name.split(' ')[0])}?</h2><p class="small muted" style="margin:0 0 18px">${ic('lock',13)} Private until you both answer. A "Not now" is never shown to them.</p><div class="answer">${Object.entries(NEXT).map(([k,v])=>`<button class="ans" onclick="answer('${t.id}','${k}')">${ic(v.icon,22,'#3157ff')}<b>${v.label}</b><span>${v.desc}</span></button>`).join('')}</div></div>`;
 else if(!t.theirs)reveal=`<div class="reveal"><div class="tiny" style="letter-spacing:.12em;color:#aab3c4;font-weight:800">THE QUIET REVEAL</div><div class="side-two" style="margin:20px 0"><div class="center">${av(me().name,'lg')}<div class="chip" style="margin-top:10px;background:rgba(255,255,255,.12);color:#fff">${NEXT[t.mine].label}</div></div><div class="lock">${ic('lock',20,'#fff')}</div><div class="center">${av(t.other.name,'lg')}<div class="chip" style="margin-top:10px;background:rgba(255,255,255,.12);color:#aab3c4">Not answered yet</div></div></div><div style="font-size:19px;font-weight:850">Your answer is locked in. We'll reveal both when ${esc(t.other.name.split(' ')[0])} replies.</div><div class="row" style="margin-top:16px"><button class="btn sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="go('#/t/${t.token||t.id}')">Simulate their answer</button><button class="btn sm" style="background:transparent;color:#aab3c4" onclick="answer('${t.id}',null)">Change my answer</button></div></div>`;
 else{const closed=t.mine==='notnow'||t.theirs==='notnow';const shownTheirs=t.theirs==='notnow'?'keep':t.theirs;const match=!closed&&t.mine===t.theirs;
  reveal=`<div class="reveal"><div class="tiny" style="letter-spacing:.12em;color:#aab3c4;font-weight:800">REVEALED</div><div class="side-two" style="margin:20px 0"><div class="center">${av(me().name,'lg')}<div class="chip" style="margin-top:10px;background:rgba(255,255,255,.12);color:#fff">${NEXT[t.mine].label}</div></div><div class="lock">${ic(match?'check':'thread',20,match?'#7ee2b0':'#fff',2.6)}</div><div class="center">${av(t.other.name,'lg')}<div class="chip" style="margin-top:10px;background:rgba(255,255,255,.12);color:#fff">${NEXT[shownTheirs].label}</div></div></div><div style="font-size:22px;font-weight:850;letter-spacing:-.6px">${t.mine==='notnow'?'You closed this Thread gently. They will see "Stay in touch".':match?`It's a match: you both chose ${NEXT[t.mine].label.toLowerCase()}.`:`You chose ${NEXT[t.mine].label.toLowerCase()}, ${esc(t.other.name.split(' ')[0])} chose ${NEXT[shownTheirs].label.toLowerCase()}.`}</div></div>
  ${t.mine!=='notnow'&&!t.resolvedAt?`<div class="card pad-lg" style="margin-top:18px"><div class="row between"><div><div class="eyebrow">${ic('spark',13)} Drafted from this Thread</div><b>Your follow-up</b></div><span class="chip">Edit before sending</span></div><textarea id="draft" rows="11" style="margin-top:14px;line-height:1.6">${esc(draftFor(t))}</textarea><div class="row wrap-row" style="margin-top:14px"><button class="btn primary" onclick="sendFollow('${t.id}')">${ic('mail',16)} Send follow-up</button><button class="btn secondary" onclick="copy($('#draft').value,'Draft copied')">${ic('copy',16)} Copy</button>${t.mine==='meet'?`<button class="btn secondary" onclick="resolve('${t.id}','Meeting booked')">${ic('calendar',16)} Mark meeting booked</button>`:''}${t.mine==='intro'?`<button class="btn secondary" onclick="resolve('${t.id}','Introduction made')">${ic('intro',16)} Mark intro made</button>`:''}<button class="btn ghost" onclick="resolve('${t.id}','Stayed in touch')">Resolve Thread</button></div></div>`:''}`}
 return shell('threads',`<a href="#/app/threads" class="small muted" style="font-weight:800">&larr; Threads</a><div class="ph" style="margin-top:14px"><div class="row" style="gap:16px">${av(t.other.name,'xl')}<div><h1 style="margin:0">${esc(t.other.name)}</h1><p>${esc(t.other.role)}${t.other.company?', '+esc(t.other.company):''}</p><div class="row" style="margin-top:10px;gap:8px">${stateChip(t)}${t.confirmed?'<span class="chip green">'+ic('shield',12)+' Verified by both</span>':''}</div></div></div><div class="row">${ring(t)}<div><div class="small muted">Verified warmth</div>${warmBar(warmth(t))}</div></div></div>
 <div class="grid" style="grid-template-columns:1.6fr 1fr"><div>${reveal}</div><div class="stack" style="gap:18px"><div class="card pad"><b>The moment</b><div class="stack small" style="margin-top:12px;gap:9px"><div class="row between"><span class="muted">Where</span><b>${esc(t.where)}</b></div><div class="row between"><span class="muted">When</span><b>${fmtDate(t.createdAt)}</b></div>${t.roomId?`<div class="row between"><span class="muted">Room</span><a href="#/app/room/${t.roomId}" style="color:var(--brand);font-weight:800">View room</a></div>`:''}<div class="row between"><span class="muted">Email</span><b>${esc(t.other.email||'Not shared')}</b></div></div>
 <div class="field" style="margin-top:14px"><label>${ic('lock',12)} Private context (only you)</label><textarea id="note" rows="3" placeholder="What should you remember?">${esc(t.note)}</textarea><button class="btn secondary sm" style="align-self:flex-start" onclick="saveNote('${t.id}')">Save note</button></div></div>
 <div class="card pad"><b>Timeline</b><div style="margin-top:14px">${t.events.slice().reverse().map(e=>`<div class="event"><b>${esc(e.text)}</b><div>${fmtDate(e.at)} &middot; ${ago(e.at)}</div></div>`).join('')}</div></div>
 <button class="btn danger" onclick="delThread('${t.id}')">Delete my side of this Thread</button></div></div>`)}
function answer(id,k){const t=findThread(id);t.mine=k;if(k)t.events.push({k:'answer',at:Date.now(),text:'You answered "What\'s next?"'});if(k==='notnow'&&t.theirs&&!t.resolvedAt){}save();render();if(k)toast(t.theirs?'Answers revealed':'Answer locked in privately')}
function sendFollow(id){const t=findThread(id);t.events.push({k:'followup',at:Date.now(),text:'Follow-up sent to '+t.other.name.split(' ')[0]});save();toast('Follow-up sent');render()}
function resolve(id,how){const t=findThread(id);t.resolvedAt=Date.now();t.events.push({k:'resolved',at:Date.now(),text:'Thread resolved: '+how.toLowerCase()});save();toast('Thread resolved');render()}
function saveNote(id){findThread(id).note=$('#note').value;save();toast('Note saved')}
function delThread(id){if(!confirm('Delete your side of this Thread? This cannot be undone.'))return;DB.threads=DB.threads.filter(t=>t.id!==id);save();toast('Thread deleted');go('#/app/threads')}
/* ---------- tap ---------- */
function vTap(){const u=me();const rooms=myRooms();return shell('tap',`<div class="ph"><div><div class="eyebrow">Tap to Thread</div><h1>Share your card, start a Thread</h1><p>Hold this screen up, tap an NFC card, or send your link. The other person needs no app.</p></div></div>
<div class="grid g2"><div class="card pad-lg center" style="background:var(--ink);color:#fff;border:0"><div class="tiny" style="letter-spacing:.14em;font-weight:800;color:#8ea2ff">SCAN TO START A THREAD WITH</div><div style="font-size:26px;font-weight:850;letter-spacing:-.7px;margin:8px 0 2px">${esc(u.name)}</div><div class="small" style="color:#aab3c4">${esc(u.role)}, ${esc(u.company)}</div><div class="qrbox" id="qrTap" style="margin:24px auto"></div><div class="small" style="color:#aab3c4">introthread.com/${esc(u.handle)}</div>

function shareNative(){const u=me();if(navigator.share)navigator.share({title:u.name+' on Introthread',url:profileUrl(u)}).catch(()=>{});else copy(profileUrl(u),'Link copied')}
function newThread(e){e.preventDefault();const rid=$('#tw').value,room=DB.rooms.find(r=>r.id===rid);const where=room?room.name:($('#tw2').value.trim()||'In person');
 const t={id:uid(),ownerId:DB.session,other:{name:$('#tn').value.trim(),role:$('#tr').value.trim()||'Professional',company:$('#tc').value.trim(),email:$('#te').value.trim()},where,note:$('#tx').value.trim(),createdAt:Date.now(),confirmed:false,mine:null,theirs:null,resolvedAt:null,roomId:room?room.id:null,events:[{k:'tap',at:Date.now(),text:'Thread started at '+where}]};

<div class="stack" style="gap:18px;position:sticky;top:90px;align-self:start">${bizCard(u)}<div class="card pad row"><div class="qrbox" id="qrCard" style="border:1px solid var(--line)"></div><div><b>Your dynamic QR</b><p class="small muted">Print it once. It always points to your latest card.</p><button class="btn secondary sm" onclick="copy('${profileUrl(u)}','Link copied')">Copy link</button></div></div></div></div>`)}

/* ---------- rooms ---------- */
function roomStats(r){const T=DB.threads.filter(t=>t.roomId===r.id);const v=T.filter(t=>t.confirmed).length,a=T.filter(t=>t.mine||t.theirs).length,m=T.filter(t=>t.mine&&t.mine===t.theirs&&t.mine!=='notnow').length,res=T.filter(t=>t.resolvedAt).length;return{T,v,a,m,res,rate:T.length?Math.round(res/T.length*100):0}}
function vRooms(){const R=myRooms();return shell('rooms',`<div class="ph"><div><div class="eyebrow">Thread Rooms</div><h1>Events and communities</h1><p>Every tap in a Room becomes a Thread. See which connections went somewhere.</p></div><button class="btn primary" onclick="newRoomModal()">${ic('plus',16)} Create a Room</button></div>
<div class="grid g3">${R.map(r=>{const s=roomStats(r);return`<div class="card pad-lg" style="cursor:pointer" onclick="go('#/app/room/${r.id}')"><div class="row between"><span class="chip blue">${esc(r.code)}</span><span class="small muted">${fmtDate(r.date)}</span></div><h3 style="margin:14px 0 4px;letter-spacing:-.4px">${esc(r.name)}</h3><div class="small muted">${esc(r.location||'')}</div><div class="grid g3" style="margin-top:18px;gap:8px"><div><b style="font-size:22px">${s.T.length}</b><div class="tiny muted">Threads</div></div><div><b style="font-size:22px">${s.v}</b><div class="tiny muted">Verified</div></div><div><b style="font-size:22px">${s.rate}%</b><div class="tiny muted">Resolved</div></div></div></div>`}).join('')||`<div class="card empty" style="grid-column:1/-1">${ic('room',40,'#c3c9d4')}<p>No Rooms yet. Create one for your next event.</p></div>`}</div>`)}
function newRoomModal(){modal(`<div class="row between"><h3 style="margin:0">Create a Room</h3><button class="x" onclick="closeModal()">&times;</button></div><form onsubmit="return newRoom(event)" class="stack" style="margin-top:18px"><div class="field"><label>Event name</label><input id="rn" required placeholder="Founders Night, London"></div><div class="grid g2"><div class="field"><label>Date</label><input id="rd" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Location</label><input id="rl" placeholder="City or venue"></div></div><button class="btn primary">Create Room</button></form>`)}

function vRoom(id){const r=DB.rooms.find(x=>x.id===id);if(!r)return shell('rooms','<div class="card empty">Room not found.</div>');const s=roomStats(r);const by=k=>s.T.filter(t=>t.mine===k||t.theirs===k).length;
 return shell('rooms',`<a href="#/app/rooms" class="small muted" style="font-weight:800">&larr; Rooms</a><div class="ph" style="margin-top:14px"><div><div class="eyebrow">Resolution Report &middot; ${esc(r.code)}</div><h1>${esc(r.name)}</h1><p>${fmtDate(r.date)}${r.location?' &middot; '+esc(r.location):''}</p></div><div class="row"><button class="btn secondary" onclick="exportRoom('${r.id}')">${ic('chart',16)} Export CSV</button><button class="btn primary" onclick="simTap('${r.id}')">${ic('tap',16)} Simulate a tap</button></div></div>
 <div class="grid g4">${[['Threads',s.T.length],['Verified by both',s.v],['Mutual matches',s.m],['Resolution rate',s.rate+'%']].map(([l,v])=>`<div class="metric"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:1fr 1.3fr;margin-top:20px"><div class="stack" style="gap:18px"><div class="card pad"><b>What people want next</b>${Object.entries(NEXT).map(([k,v])=>{const n=by(k);return`<div class="row between small" style="margin:14px 0 6px"><span>${v.label}</span><b>${n}</b></div><div class="bar"><i style="width:${s.T.length?n/s.T.length*100:0}%"></i></div>`}).join('')}</div>
 <div class="card pad center"><b>Room QR</b><p class="small muted">Put this on screens, badges and tables.</p><div class="qrbox" id="qrRoom" style="border:1px solid var(--line)"></div><div class="small" style="margin-top:8px;font-weight:800">introthread.com/r/${esc(r.code)}</div></div></div>
 <div class="card pad livefeed"><div class="row between"><b>Live Threads</b><span class="chip green">Live</span></div><div class="stack" style="gap:8px;margin-top:14px">${s.T.sort((a,b)=>b.createdAt-a.createdAt).map(t=>`<div class="tl" onclick="go('#/app/thread/${t.id}')" style="cursor:pointer">${av(t.other.name,'sm')}<div class="meta"><b>${esc(t.other.name)}</b><span>${esc(t.other.role)}, ${esc(t.other.company)} &middot; ${ago(t.createdAt)}</span></div>${stateChip(t)}</div>`).join('')||'<div class="empty">No taps yet.</div>'}</div></div></div>`)}
function simTap(rid){const r=DB.rooms.find(x=>x.id===rid);const N=['Hannah Reid','Omar Haddad','Lily Chen','Samuel Ndungu','Ruby Walsh','Tom Fischer','Aisha Bello','Max Larsen'];const n=N[Math.floor(Math.random()*N.length)];
 DB.threads.push({id:uid(),ownerId:DB.session,other:{name:n,role:['Founder','Investor','Head of Growth','CTO'][Math.floor(Math.random()*4)],company:['Nova','Pillar','Quanta','Rivet'][Math.floor(Math.random()*4)],email:slug(n)+'@example.com'},where:r.name,note:'',createdAt:Date.now(),confirmed:true,mine:null,theirs:['meet','intro','keep'][Math.floor(Math.random()*3)],resolvedAt:null,roomId:r.id,events:[{k:'tap',at:Date.now(),text:'Tapped in room '+r.code},{k:'confirm',at:Date.now(),text:n.split(' ')[0]+' confirmed the Thread'}]});save();toast(n+' just tapped in');render()}
function exportRoom(rid){const s=roomStats(DB.rooms.find(x=>x.id===rid));const rows=[['Name','Role','Company','Verified','Your answer','Their answer','Resolved']].concat(s.T.map(t=>[t.other.name,t.other.role,t.other.company,t.confirmed?'yes':'no',t.mine||'',t.theirs==='notnow'?'keep':(t.theirs||''),t.resolvedAt?'yes':'no']));
 const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='resolution-report.csv';a.click();toast('Report downloaded')}
