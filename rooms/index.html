function delAccount(){if(!confirm('Delete your account and your side of every Thread?'))return;const id=DB.session;DB.threads=DB.threads.filter(t=>t.ownerId!==id);DB.rooms=DB.rooms.filter(r=>r.ownerId!==id);DB.users=DB.users.filter(u=>u.id!==id);DB.session=null;save();toast('Account deleted');go('#/')}

/* ---------- public profile & recipient view ---------- */
function vPublic(h){const u=DB.users.find(x=>x.handle===h);if(!u)return vNotFound(h);
 const L=u.links||{};return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div>${bizCard(u)}
 <div class="card pad-lg" style="margin-top:18px">${u.bio?`<p style="margin:0 0 16px;line-height:1.6">${esc(u.bio)}</p>`:''}<div class="stack" style="gap:8px">${L.linkedin?`<a class="btn secondary block" href="https://${esc(L.linkedin.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${ic('link',16)} LinkedIn</a>`:''}${L.website?`<a class="btn secondary block" href="https://${esc(L.website.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${ic('globe',16)} Website</a>`:''}${L.calendar?`<a class="btn secondary block" href="https://${esc(L.calendar.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">${ic('calendar',16)} Book a meeting</a>`:''}<button class="btn secondary block" onclick="vcard('${u.id}')">${ic('user',16)} Save contact</button></div></div>
 <div class="card pad-lg" style="margin-top:18px;border:2px solid var(--brand)"><div class="eyebrow">Just met ${esc(u.name.split(' ')[0])}?</div><h3 style="margin:6px 0 4px;letter-spacing:-.5px">Start a Thread</h3><p class="small muted" style="margin:0 0 14px">You'll both get a shared record of where you met, and one question: what's next? No app needed.</p>
 <form onsubmit="return guestThread(event,'${u.id}')" class="stack"><input id="gn" required placeholder="Your name"><input id="ge" type="email" required placeholder="Your email"><div class="grid g2"><input id="gr" placeholder="Your title"><input id="gc" placeholder="Company"></div><input id="gw" placeholder="Where did you meet?"><button class="btn primary block lg">${ic('thread',16)} Start a Thread</button></form><p class="tiny muted center" style="margin:12px 0 0">${ic('lock',11)} We only share your details with ${esc(u.name.split(' ')[0])}.</p></div>
 <p class="center small muted" style="margin-top:22px">Want your own card? <a href="#/signup" style="color:var(--brand);font-weight:800">Create one free</a></p></div></div>`}
function vcard(id){const u=DB.users.find(x=>x.id===id);const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${u.name}\nTITLE:${u.role}\nORG:${u.company}\nEMAIL:${u.email}\nURL:${profileUrl(u)}\nEND:VCARD`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=u.handle+'.vcf';a.click();toast('Contact saved')}
function guestThread(e,oid){e.preventDefault();const n=$('#gn').value.trim();const t={id:uid(),ownerId:oid,other:{name:n,role:$('#gr').value.trim()||'Professional',company:$('#gc').value.trim(),email:$('#ge').value.trim()},where:$('#gw').value.trim()||'In person',note:'',createdAt:Date.now(),confirmed:true,mine:null,theirs:null,resolvedAt:null,roomId:null,guest:true,events:[{k:'tap',at:Date.now(),text:n.split(' ')[0]+' started a Thread from your card'},{k:'confirm',at:Date.now(),text:'Verified by both'}]};
 DB.threads.push(t);save();go('#/t/'+t.id);return false}
function vGuest(id){const t=findThread(id);if(!t)return`<div class="pub"><div class="pubcard card pad-lg center">${logo()}<h2>This Thread is no longer available</h2></div></div>`;const o=DB.users.find(u=>u.id===t.ownerId)||{name:'Your contact',role:'',company:''};const f=o.name.split(' ')[0];let body;
 if(!t.confirmed)body=`<h2 style="letter-spacing:-.8px;margin:0 0 6px">Did you meet ${esc(o.name)}?</h2><p class="muted">${esc(f)} started a Thread after meeting you at <b>${esc(t.where)}</b>. Confirm it to keep a shared record and decide what happens next.</p><div class="row" style="margin-top:18px"><button class="btn primary" style="flex:1" onclick="guestConfirm('${t.id}')">${ic('check',16)} Yes, confirm</button><button class="btn secondary" onclick="toast('Thanks. ${esc(f)} will not be notified.')">Not me</button></div>`;
 else if(!t.theirs)body=`<div class="eyebrow">Verified Thread &middot; ${esc(t.where)}</div><h2 style="letter-spacing:-.8px;margin:8px 0 6px">What's next with ${esc(f)}?</h2><p class="small muted">${ic('lock',12)} Private until you both answer. A "Not now" is never shown.</p><div class="answer" style="margin-top:14px">${Object.entries(NEXT).map(([k,v])=>`<button class="ans" onclick="guestAnswer('${t.id}','${k}')">${ic(v.icon,20,'#3157ff')}<b>${v.label}</b><span>${v.desc}</span></button>`).join('')}</div>`;
 else body=`<div class="center"><div style="width:60px;height:60px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',28,'#12a065',3)}</div><h2 style="letter-spacing:-.8px">Answer locked in</h2><p class="muted">${t.mine?`You both answered. ${esc(f)} will follow up.`:`We'll reveal both answers when ${esc(f)} replies.`}</p><a href="#/signup" class="btn primary">Get your own free card</a>${DB.session===t.ownerId?`<div style="margin-top:14px"><a href="#/app/thread/${t.id}" class="btn ghost">Back to your view as ${esc(f)}</a></div>`:''}</div>`;
 return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div><div class="card pad row" style="margin-bottom:14px">${av(o.name,'lg')}<div><b style="font-size:17px">${esc(o.name)}</b><div class="small muted">${esc(o.role)}${o.company?', '+esc(o.company):''}</div></div></div><div class="card pad-lg">${body}</div><p class="tiny muted center" style="margin-top:16px">Introthread &middot; Every handshake, followed through.</p></div></div>`}
function guestConfirm(id){const t=findThread(id);t.confirmed=true;t.events.push({k:'confirm',at:Date.now(),text:t.other.name.split(' ')[0]+' confirmed the Thread'});save();render()}
function guestAnswer(id,k){const t=findThread(id);t.theirs=k;t.events.push({k:'answer',at:Date.now(),text:t.other.name.split(' ')[0]+' answered "What\'s next?"'});save();render()}

/* ---------- router ---------- */
function render(){const h=RH().slice(1);const p=h.split('/').filter(Boolean);let html;const authed=!!me();
 if(p[0]==='app'){if(!authed){go('#/login');return}
  html=!p[1]?vToday():p[1]==='threads'?vThreads():p[1]==='thread'?vThread(p[2]):p[1]==='tap'?vTap():p[1]==='card'?vCard():p[1]==='rooms'?vRooms():p[1]==='room'?vRoom(p[2]):p[1]==='profile'?vProfile():p[1]==='settings'?vSettings():vToday()}
 else if(!p[0])html=vHome();
 else html=({how:vHow,rooms:vRoomsPage,networks:vNetworks,pricing:vPricing,about:vAbout,privacy:vPrivacy,terms:vTerms,login:()=>authed?(go('#/app'),''):vLogin(),signup:()=>authed?(go('#/app'),''):vSignup(),t:()=>vGuest(p[1])}[p[0]]||(()=>vPublic(p[0])))();
 if(html==null)return;$('#root').innerHTML=html;
 const u=me();if(u){qr($('#qrToday'),profileUrl(u),96);qr($('#qrTap'),profileUrl(u),164);qr($('#qrCard'),profileUrl(u),96)}
 const rq=$('#qrRoom');if(rq){const r=DB.rooms.find(x=>x.id===p[2]);qr(rq,'https://introthread.com/r/'+r.code,150)}
 document.title={app:'Introthread',login:'Log in | Introthread',signup:'Create your card | Introthread',pricing:'Pricing | Introthread'}[p[0]]||'Introthread | Every handshake, followed through';
 if(!window._keepScroll)window.scrollTo(0,0)}
let lastHash=RH();const _onRoute=()=>{window._keepScroll=false;document.body.classList.remove('x-open');lastHash=RH();render()};window.addEventListener('popstate',_onRoute);window.addEventListener('itroute',_onRoute);window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')){history.replaceState(null,'',location.hash.slice(1)||'/');_onRoute()}});
const _r=render;render=function(){const same=RH()===lastHash&&window._rendered;window._keepScroll=same;_r();window._rendered=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{if(RH().startsWith('#/app')&&!$('#mback').classList.contains('open')&&!document.activeElement.matches('input,textarea,select'))render()},60000);
/* ---------- Supabase cloud layer ----------
   Real accounts, cards, Threads and Rooms live in Supabase (row-level security).
   The "Explore the live demo" account stays local to the browser so anyone can try it safely. */
const CFG=window.INTROTHREAD_CONFIG||{};
const SB=(window.supabase&&CFG.supabaseUrl&&CFG.supabaseAnonKey)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let MODE=DB.session?'demo':null;
const cloud=()=>MODE==='cloud'&&SB;
const SITE='https://introthread.com';
profileUrl=u=>SITE+'/'+u.handle;
const threadLink=t=>SITE+'/t/'+(t.token||t.id);

/* persist only demo data locally */
save=function(){const keep=x=>!x._c;localStorage.setItem(KEY,JSON.stringify({users:DB.users.filter(keep),threads:DB.threads.filter(keep),rooms:DB.rooms.filter(keep),session:MODE==='demo'?DB.session:null}))};
function clearCloud(){DB.users=DB.users.filter(x=>!x._c);DB.threads=DB.threads.filter(x=>!x._c);DB.rooms=DB.rooms.filter(x=>!x._c)}
const mapProfile=(p,email)=>({_c:true,id:p.id,name:p.name,email:email||'',role:p.role||'',company:p.company||'',city:p.city||'',bio:p.bio||'',handle:p.handle,theme:p.theme||'midnight',photo:(p.links||{}).photo||null,links:p.links||{},plan:p.plan||'Free',prefs:p.prefs||{},created:Date.parse(p.created_at)||Date.now()});
const mapThread=r=>({_c:true,id:r.id,token:r.guest_token,ownerId:r.owner_id,other:{name:r.other_name,role:r.other_role||'',company:r.other_company||'',email:r.other_email||''},where:r.where_met||'In person',note:r.note||'',createdAt:Date.parse(r.created_at),confirmed:!!r.confirmed,mine:r.mine,theirs:r.theirs,resolvedAt:r.resolved_at?Date.parse(r.resolved_at):null,roomId:r.room_id,
 events:(r.thread_events||[]).map(e=>({k:e.kind,at:Date.parse(e.at),text:e.text})).sort((a,b)=>a.at-b.at)});
const mapRoom=r=>({_c:true,id:r.id,ownerId:r.owner_id,name:r.name,date:Date.parse(r.event_date),location:r.location||'',code:r.code,created:Date.parse(r.created_at)});
function fail(e){console.error(e);toast((e&&e.message)?e.message:'Something went wrong. Please try again.');return null}

async function loadCloud(user){
 let {data:p,error}=await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return fail(error);
 if(!p){const m=(user.user_metadata||{}).profile;if(!m){MODE='cloud';DB.session=user.id;PENDING=user;return'needs-profile'}
  const ins=await SB.from('profiles').insert({id:user.id,handle:m.handle,name:m.name,role:m.role,company:m.company,city:m.city,bio:m.bio,theme:m.theme}).select().single();if(ins.error)return fail(ins.error);p=ins.data}
 const [th,rm]=await Promise.all([SB.from('threads').select('*, thread_events(*)').order('created_at',{ascending:false}),SB.from('rooms').select('*')]);
 if(th.error)return fail(th.error);if(rm.error)return fail(rm.error);
 clearCloud();DB.users.push(mapProfile(p,user.email));DB.threads.push(...th.data.map(mapThread));DB.rooms.push(...rm.data.map(mapRoom));DB.session=user.id;MODE='cloud';return'ok'}
let PENDING=null;
async function addEvent(t,k,text){const at=Date.now();t.events.push({k,at,text});if(cloud()){const {error}=await SB.from('thread_events').insert({thread_id:t.id,kind:k,text});if(error)fail(error)}}
async function upd(table,id,patch){if(!cloud())return true;const {error}=await SB.from(table).update(patch).eq('id',id);if(error){fail(error);return false}return true}

/* auth */
doLogin=function(e){e.preventDefault();const em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;
 if(em==='demo@introthread.com'){demoLogin();return false}
 if(!SB){$('#lerr').textContent='Accounts are not available right now. Try the demo account.';return false}
 const b=e.target.querySelector('button');b.disabled=true;b.textContent='Logging in...';
 SB.auth.signInWithPassword({email:em,password:pw}).then(async({data,error})=>{b.disabled=false;b.textContent='Log in';
  if(error){$('#lerr').textContent=/confirm/i.test(error.message)?'Please confirm your email first. Check your inbox for the link.':'That email and password do not match.';return}
  const r=await loadCloud(data.user);if(r==='needs-profile'){go('#/signup');SU={step:2,name:'',email:em};render();return}
  if(r){save();toast('Welcome back, '+me().name.split(' ')[0]);go('#/app')}});return false}
const _demoLogin=demoLogin;demoLogin=async function(){if(SB&&MODE==='cloud'){await SB.auth.signOut();clearCloud()}MODE='demo';_demoLogin()};
oauth=function(p){toast(p+' sign-in is coming soon. Please use email for now.')};
logout=async function(){if(cloud())await SB.auth.signOut();clearCloud();DB.session=null;MODE=null;save();toast('Logged out');go('#/')};

const _su1=su1;su1=function(e){e.preventDefault();const em=$('#se').value.trim().toLowerCase();if(em==='demo@introthread.com'){$('#serr').textContent='That email is reserved for the demo.';return false}
 Object.assign(SU,{name:$('#sn').value.trim(),email:em,pwRaw:$('#sp').value,step:2});render();return false};
su2=function(e){e.preventDefault();const h=slug($('#sh').value);const next=()=>{Object.assign(SU,{role:$('#sr').value.trim(),company:$('#sc').value.trim(),city:$('#sct').value.trim(),handle:h,bio:$('#sb').value.trim(),step:3,theme:SU.theme||'midnight'});render()};
 const taken=()=>{$('#shh').textContent='That link is taken. Try another.';$('#shh').style.color='var(--bad)'};
 if(DB.users.some(u=>u.handle===h))return taken(),false;
 if(!SB){next();return false}
 SB.rpc('handle_available',{p_handle:h}).then(({data,error})=>{if(error)return fail(error);data?next():taken()});return false};
su3=async function(){const prof={handle:SU.handle,name:SU.name,role:SU.role,company:SU.company,city:SU.city,bio:SU.bio,photo:SU.photo,theme:SU.theme||'midnight'};
 if(!SB){toast('Accounts are not available right now.');return}
 if(PENDING){const {error}=await SB.from('profiles').insert(Object.assign({id:PENDING.id},prof));if(error)return fail(error);const u=PENDING;PENDING=null;await loadCloud(u);SU={step:1};save();go('#/app');return}
 const {data,error}=await SB.auth.signUp({email:SU.email,password:SU.pwRaw,options:{data:{profile:prof},emailRedirectTo:'https://www.introthread.com/'}});
 if(error){SU.step=1;render();setTimeout(()=>{const el=$('#serr');if(el)el.textContent=/registered/i.test(error.message)?'An account with this email already exists. Log in instead.':error.message},0);return}
 const email=SU.email;SU={step:1};
 if(data.session){const r=await loadCloud(data.user);if(r){save();go('#/app');modal(`<div class="center"><div style="width:64px;height:64px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',30,'#12a065',3)}</div><h2 style="letter-spacing:-.8px">Your card is live</h2><p class="muted">introthread.com/${esc(prof.handle)}</p><button class="btn primary" onclick="closeModal();go('#/app/tap')">Start sharing</button></div>`)}}
 else{go('#/login');modal(`<div class="center"><div style="width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:auto">${ic('mail',28,'#3157ff')}</div><h2 style="letter-spacing:-.8px">Confirm your email</h2><p class="muted">We sent a link to <b>${esc(email)}</b>. Click it to activate your card at introthread.com/${esc(prof.handle)}.</p><button class="btn primary" onclick="closeModal()">OK</button></div>`)}};

/* thread actions */
answer=async function(id,k){const t=findThread(id);if(!(await upd('threads',id,{mine:k})))return;t.mine=k;if(k)await addEvent(t,'answer','You answered "What\'s next?"');save();render();if(k)toast(t.theirs?'Answers revealed':'Answer locked in privately')};
sendFollow=async function(id){const t=findThread(id);await addEvent(t,'followup','Follow-up sent to '+t.other.name.split(' ')[0]);save();toast('Follow-up logged');render()};
resolve=async function(id,how){const t=findThread(id);const now=new Date();if(!(await upd('threads',id,{resolved_at:now.toISOString(),resolved_how:how})))return;t.resolvedAt=now.getTime();await addEvent(t,'resolved','Thread resolved: '+how.toLowerCase());save();toast('Thread resolved');render()};
saveNote=async function(id){const v=$('#note').value;if(!(await upd('threads',id,{note:v})))return;findThread(id).note=v;save();toast('Note saved')};
delThread=async function(id){if(!confirm('Delete your side of this Thread? This cannot be undone.'))return;if(cloud()){const {error}=await SB.from('threads').delete().eq('id',id);if(error)return fail(error)}DB.threads=DB.threads.filter(t=>t.id!==id);save();toast('Thread deleted');go('#/app/threads')};
newThread=function(e){e.preventDefault();const rid=$('#tw').value,room=DB.rooms.find(r=>r.id===rid);const where=room?room.name:($('#tw2').value.trim()||'In person');
 const o={name:$('#tn').value.trim(),role:$('#tr').value.trim()||'Professional',company:$('#tc').value.trim(),email:$('#te').value.trim()},note=$('#tx').value.trim();
 if(!cloud()){const t={id:uid(),ownerId:DB.session,other:o,where,note,createdAt:Date.now(),confirmed:false,mine:null,theirs:null,resolvedAt:null,roomId:room?room.id:null,events:[{k:'tap',at:Date.now(),text:'Thread started at '+where}]};DB.threads.push(t);save();toast('Thread started');go('#/app/thread/'+t.id);return false}
 SB.from('threads').insert({owner_id:DB.session,other_name:o.name,other_role:o.role,other_company:o.company,other_email:o.email,where_met:where,note,room_id:room?room.id:null}).select().single().then(async({data,error})=>{if(error)return fail(error);
  const t=mapThread(data);DB.threads.push(t);await addEvent(t,'tap','Thread started at '+where);copy(threadLink(t),'Thread started. Confirm link copied, send it to '+o.name.split(' ')[0]);go('#/app/thread/'+t.id)});return false};
saveCard=function(e){e.preventDefault();const u=me();const patch={name:$('#cn').value.trim(),role:$('#cr').value.trim(),company:$('#cc').value.trim(),city:$('#cct').value.trim(),bio:$('#cb').value.trim(),links:{linkedin:$('#cl').value.trim(),website:$('#cw').value.trim(),calendar:$('#ck').value.trim()}};
 upd('profiles',u.id,patch).then(ok=>{if(!ok)return;Object.assign(u,patch);save();toast('Card updated');render()});return false};
async function setTheme(k){const u=me();if(await upd('profiles',u.id,{theme:k})){u.theme=k;save();render()}}
async function setPref(k,v){const u=me();const prefs=Object.assign({},u.prefs||{},{[k]:v});if(await upd('profiles',u.id,{prefs})){u.prefs=prefs;save();toast('Saved')}}
function setPlan(p){if(cloud())return toast('Pro billing opens soon. You will be first to know.');me().plan=p;save();render();toast('Upgraded to Pro (demo)')}
newRoom=function(e){e.preventDefault();const n=$('#rn').value.trim();const code=(n.replace(/[^A-Za-z]/g,'').slice(0,3)+Math.floor(100+Math.random()*899)).toUpperCase();const date=$('#rd').value,loc=$('#rl').value.trim();
 if(!cloud()){const r={id:uid(),ownerId:DB.session,name:n,date:new Date(date).getTime(),location:loc,code,created:Date.now()};DB.rooms.push(r);save();closeModal();toast('Room created');go('#/app/room/'+r.id);return false}
 SB.from('rooms').insert({owner_id:DB.session,name:n,event_date:date,location:loc,code}).select().single().then(({data,error})=>{if(error)return fail(error);const r=mapRoom(data);DB.rooms.push(r);closeModal();toast('Room created');go('#/app/room/'+r.id)});return false};
const _simTap=simTap;simTap=function(rid){if(cloud())return toast('Simulated taps are for the demo. In a live Room, log each Thread with this Room as the place.');_simTap(rid)};
delAccount=async function(){if(!confirm('Delete your account data and your side of every Thread?'))return;if(cloud()){const id=DB.session;await SB.from('threads').delete().eq('owner_id',id);await SB.from('rooms').delete().eq('owner_id',id);await SB.from('profiles').delete().eq('id',id);await SB.auth.signOut();clearCloud();DB.session=null;MODE=null;save();toast('Your data has been deleted');go('#/');return}
 const id=DB.session;DB.threads=DB.threads.filter(t=>t.ownerId!==id);DB.rooms=DB.rooms.filter(r=>r.ownerId!==id);DB.users=DB.users.filter(u=>u.id!==id);DB.session=null;MODE=null;save();toast('Account deleted');go('#/')};

/* public profile & guest (no account) */
const PUB={},GUEST={};
const _vPublic=vPublic;vPublic=function(h){h=String(h).toLowerCase();if(DB.users.some(u=>u.handle===h)||!SB||PUB[h]===null)return _vPublic(h);
 if(!PUB[h]){SB.from('profiles').select('id,handle,name,role,company,city,bio,theme,links').eq('handle',h).maybeSingle().then(({data})=>{PUB[h]=data?mapProfile(data,''):null;if(data)DB.users.push(PUB[h]);render()});return`<div class="pub"><div class="pubcard center"><div style="margin:60px 0">${logo()}</div><p class="muted">Loading card...</p></div></div>`}
 return _vPublic(h)};
vcard=function(id){const u=DB.users.find(x=>x.id===id);const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${u.name}\nTITLE:${u.role}\nORG:${u.company}\n${u.email?'EMAIL:'+u.email+'\n':''}URL:${profileUrl(u)}\nEND:VCARD`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=u.handle+'.vcf';a.click();toast('Contact saved')};
const _guestThread=guestThread;guestThread=function(e,oid){const owner=DB.users.find(u=>u.id===oid);if(!owner||!owner._c||!SB)return _guestThread(e,oid);e.preventDefault();
 const b=e.target.querySelector('button');b.disabled=true;
 SB.rpc('start_thread_from_card',{p_handle:owner.handle,p_name:$('#gn').value.trim(),p_email:$('#ge').value.trim(),p_role:$('#gr').value.trim(),p_company:$('#gc').value.trim(),p_where:$('#gw').value.trim()}).then(({data,error})=>{b.disabled=false;if(error)return fail(error);delete GUEST[data];go('#/t/'+data)});return false};
const _vGuest=vGuest;vGuest=function(tok){if(findThread(tok)&&!findThread(tok)._c)return _vGuest(tok);if(!SB)return _vGuest(tok);
 const g=GUEST[tok];if(g===undefined){SB.rpc('get_guest_thread',{p_token:tok}).then(({data})=>{GUEST[tok]=data||null;render()});return`<div class="pub"><div class="pubcard center"><div style="margin:60px 0">${logo()}</div><p class="muted">Loading Thread...</p></div></div>`}
 if(!g)return`<div class="pub"><div class="pubcard card pad-lg center">${logo()}<h2>This Thread is no longer available</h2></div></div>`;
 const o=g.owner,f=o.name.split(' ')[0];let body;
 if(!g.confirmed)body=`<h2 style="letter-spacing:-.8px;margin:0 0 6px">Did you meet ${esc(o.name)}?</h2><p class="muted">${esc(f)} started a Thread after meeting you at <b>${esc(g.where_met)}</b>. Confirm it to keep a shared record and decide what happens next.</p><div class="row" style="margin-top:18px"><button class="btn primary" style="flex:1" onclick="guestConfirm('${esc(tok)}')">${ic('check',16)} Yes, confirm</button><button class="btn secondary" onclick="toast('Thanks. ${esc(f)} will not be notified.')">Not me</button></div>`;
 else if(!g.theirs)body=`<div class="eyebrow">Verified Thread &middot; ${esc(g.where_met)}</div><h2 style="letter-spacing:-.8px;margin:8px 0 6px">What's next with ${esc(f)}?</h2><p class="small muted">${ic('lock',12)} Private until you both answer. A "Not now" is never shown.</p><div class="answer" style="margin-top:14px">${Object.entries(NEXT).map(([k,v])=>`<button class="ans" onclick="guestAnswer('${esc(tok)}','${k}')">${ic(v.icon,20,'#3157ff')}<b>${v.label}</b><span>${v.desc}</span></button>`).join('')}</div>`;
 else{const oa=g.owner_answer,match=oa&&oa===g.theirs&&oa!=='notnow';body=`<div class="center"><div style="width:60px;height:60px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',28,'#12a065',3)}</div><h2 style="letter-spacing:-.8px">${match?`It's a match: you both chose ${NEXT[oa].label.toLowerCase()}`:'Answer locked in'}</h2><p class="muted">${oa?(match?`${esc(f)} will follow up soon.`:`${esc(f)} chose ${NEXT[oa].label.toLowerCase()}.`):`We'll reveal both answers when ${esc(f)} replies.`}</p><a href="#/signup" class="btn primary">Get your own free card</a></div>`}
 return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div><div class="card pad row" style="margin-bottom:14px">${av(o.name,'lg')}<div><b style="font-size:17px">${esc(o.name)}</b><div class="small muted">${esc(o.role||'')}${o.company?', '+esc(o.company):''}</div></div></div><div class="card pad-lg">${body}</div><p class="tiny muted center" style="margin-top:16px">Introthread &middot; Every handshake, followed through.</p></div></div>`};
const _gc=guestConfirm;guestConfirm=function(tok){if(findThread(tok)&&!findThread(tok)._c)return _gc(tok);SB.rpc('guest_confirm',{p_token:tok}).then(({error})=>{if(error)return fail(error);delete GUEST[tok];refreshOwned(tok);render()})};
const _ga=guestAnswer;guestAnswer=function(tok,k){if(findThread(tok)&&!findThread(tok)._c)return _ga(tok,k);SB.rpc('guest_answer',{p_token:tok,p_answer:k}).then(({error})=>{if(error)return fail(error);delete GUEST[tok];refreshOwned(tok);render()})};
async function refreshOwned(tok){if(!cloud())return;const t=DB.threads.find(x=>x.token===tok&&x._c);if(!t)return;const {data}=await SB.from('threads').select('*, thread_events(*)').eq('id',t.id).maybeSingle();if(data){Object.assign(t,mapThread(data))}}
function vRoomCode(code){return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div><div class="card pad-lg center"><span class="chip blue">Room ${esc(String(code||'').toUpperCase())}</span><h2 style="letter-spacing:-.8px">You're in the Room</h2><p class="muted">Tap or scan the card of anyone you meet here to start a Thread. Every Thread is tagged to this event.</p><a href="#/signup" class="btn primary">Get your free card</a></div></div></div>`}

/* ===== v6 Tap to Thread: card tags, recent activity, sharing analytics ===== */
function tapTags(u){const c=['b','v','g'];const t=(u.tags||[]).filter(Boolean).slice(0,3);return t.length?`<div class="t-tags">${t.map((x,k)=>`<span class="${c[k]}">${esc(x)}</span>`).join('')}</div>`:''}
function tapInsights(){const T=myThreads().slice().sort((a,b)=>b.createdAt-a.createdAt);const D=864e5,now=Date.now();
 const m30=T.filter(t=>now-t.createdAt<30*D),conf=m30.filter(t=>t.confirmed).length,both=m30.filter(t=>t.mine&&t.theirs).length,rate=m30.length?Math.round(conf/m30.length*100):0;
 const days=[...Array(7)].map((_,k)=>{const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()-(6-k));const e=s.getTime()+D;return{l:s.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2),n:T.filter(t=>t.createdAt>=s.getTime()&&t.createdAt<e).length}});const mx=Math.max(1,...days.map(d=>d.n));
 const wk=days.reduce((a,d)=>a+d.n,0);
 const act=T.slice(0,5).map(t=>`<button type="button" class="t-act" onclick="go('/app/thread/${t.id}')">${av(t.other.name,'sm')}<span class="t-act-m"><b>${esc(t.other.name)}</b><small>${esc([t.other.role,t.other.company].filter(Boolean).join(', ')||'New connection')} &middot; ${esc(t.where||'In person')}</small></span><span class="t-act-r">${stateChip(t)}<small>${ago(t.createdAt)}</small></span></button>`).join('');
 const st=(n,l,s)=>`<div class="t-stat"><b>${n}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
 return`<div class="t-ins">
 <section class="t-panel"><div class="t-panel-h"><div><h3>Recent activity</h3><p>Your latest Threads and where each one stands.</p></div><a href="/app/threads">View all ${sv('chev',14)}</a></div>
  ${act?`<div class="t-acts-l">${act}</div>`:`<div class="t-empty">${sv('link',22)}<b>No Threads yet</b><small>Start your first Thread above. It will appear here with its status.</small></div>`}</section>
 <section class="t-panel"><div class="t-panel-h"><div><h3>Sharing analytics</h3><p>Last 30 days</p></div></div>
  <div class="t-stats">${st(m30.length,'Threads started')}${st(conf,'Confirmed',m30.length?rate+'% confirmation rate':'')}${st(both,'Both answered','&ldquo;What&rsquo;s next?&rdquo;')}${st(wk,'This week')}</div>
  <div class="t-chart" role="img" aria-label="Threads started in the last 7 days">${days.map(d=>`<div><span style="height:${Math.round(d.n/mx*100)}%" title="${d.n} Thread${d.n===1?'':'s'}"></span><small>${d.l}</small></div>`).join('')}</div></section>
 </div>`}

 PF={_id:u.id,name:u.name||'',role:u.role||'',company:u.company||'',city:u.city||'',bio:u.bio||'',theme:u.theme||'midnight',links:links.length?links:[''],hidden:!!L.hidden}}return PF}

 return Object.assign({},u,{name:PF.name,role:PF.role,company:PF.company,city:PF.city,bio:PF.bio,theme:PF.theme,links:L})}
