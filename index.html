<style>
:root{--bg:#f6f3ed;--paper:#fbf9f5;--surface:#fff;--ink:#171512;--text:#1c1a17;--muted:#6f6a61;--line:#e8e2d7;--brand:#c8442a;--brand2:#a8361e;--soft:#fbede7;--thread:#2f3e9e;--ok:#2f7d4f;--warn:#b0762a;--bad:#b3261e;--serif:'Fraunces',Georgia,serif;--sans:'Schibsted Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--r:16px;--sh:0 10px 30px rgba(16,24,40,.07);--sh2:0 30px 80px rgba(16,24,40,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;letter-spacing:-.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:14px;transition:.15s}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(200,68,42,.22)}.btn.primary:hover{background:var(--brand2);transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#2c2924}
.btn.secondary{background:#fff;border:1px solid var(--line);color:#344054}.btn.secondary:hover{border-color:#c9ced8}
.btn.ghost{background:transparent;color:var(--brand)}.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}.btn.lg{padding:15px 24px;font-size:15px}.btn.block{width:100%}
.btn.danger{background:#fff1f1;color:var(--bad)}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.6px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.logo b{color:var(--brand);font-weight:900}
.eyebrow{font-size:11.5px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11px}.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap-row{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}.pad{padding:22px}.pad-lg{padding:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#f1ece4;color:#475467;font-size:11.5px;font-weight:750}
.chip.blue{background:var(--soft);color:var(--brand)}.chip.green{background:#e8f8f0;color:#0e7c4f}.chip.orange{background:#fff3e8;color:#b5541d}.chip.red{background:#fff1f1;color:#b42318}.chip.dark{background:var(--ink);color:#fff}

.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12.5px;font-weight:800;color:#344054}.field .hint{font-size:11.5px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:850;font-size:13px;flex:none}
.avatar.lg{width:64px;height:64px;font-size:20px}.avatar.xl{width:88px;height:88px;font-size:28px}.avatar.sm{width:30px;height:30px;font-size:11px}
/* marketing */
.mnav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(230,232,236,.7)}

.wrap{max-width:1180px;margin:auto;padding:0 24px}

.trust span{display:flex;align-items:center;gap:7px}
.sec{padding:100px 0}.sec.alt{background:var(--bg)}.sec.dark{background:var(--ink);color:#fff}
.sec h2{font-size:48px;letter-spacing:-2.2px;line-height:1.05;margin:12px 0 18px}.sec p.lead{font-size:18px;color:#5b6576;line-height:1.7;max-width:720px}
.sec.dark p.lead{color:#aab3c4}
/* demo stage */
.stage{position:relative;height:560px}

.scr .top{padding:46px 18px 14px}

@keyframes draw{0%,20%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}

.q-opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px}
.step{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.step .n{font-size:13px;font-weight:900;color:var(--brand);letter-spacing:.1em}
.step h3{font-size:24px;letter-spacing:-.8px;margin:14px 0 8px}.step p{color:var(--muted);line-height:1.6;margin:0}
.step .vis{height:150px;margin-top:22px;border-radius:14px;background:var(--bg);display:grid;place-items:center;position:relative;overflow:hidden}
.compare{width:100%;border-collapse:separate;border-spacing:0;margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.compare th,.compare td{padding:16px 18px;text-align:left;border-bottom:1px solid #eef0f3;font-size:14px}
.compare th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#98a2b3;background:#faf7f2}
.compare td.us{background:#fdf3ef;font-weight:800;color:var(--brand)}.compare tr:last-child td{border-bottom:0}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.layer{border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.layer h3{font-size:22px;margin:14px 0 8px}.layer p{color:#aab3c4;line-height:1.6;margin:0}
.price{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--brand);box-shadow:0 20px 50px rgba(200,68,42,.14)}
.plan .amt{font-size:40px;font-weight:900;letter-spacing:-1.5px;margin:12px 0 2px}.plan ul{list-style:none;padding:0;margin:18px 0 24px;flex:1}
.plan li{display:flex;gap:9px;font-size:13.5px;margin:10px 0;color:#344054}
.seg{display:inline-flex;background:#f1ece4;border-radius:12px;padding:4px}.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:800;font-size:13px;color:#475467}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cta{background:var(--ink);color:#fff;border-radius:28px;padding:80px 30px;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:52px;letter-spacing:-2px;margin:0 0 14px}.cta p{color:#aab3c4;font-size:18px}
.foot{background:var(--ink);color:#98a2b3;padding:70px 0 40px}.foot .grid{grid-template-columns:1.6fr repeat(4,1fr)}.foot h4{color:#fff;margin:0 0 14px;font-size:14px}.foot a{display:block;margin:9px 0;font-size:13.5px}.foot a:hover{color:#fff}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:10px}.faq summary{font-weight:800;cursor:pointer}.faq p{color:var(--muted);line-height:1.6;margin:12px 0 0}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth .form{display:grid;place-items:center;padding:40px;background:#fff}.auth .box{width:min(420px,100%)}
.auth h1{font-size:34px;letter-spacing:-1.2px;margin:0 0 8px}
.oauth{display:grid;gap:10px;margin:24px 0}.or{display:flex;align-items:center;gap:12px;color:#98a2b3;font-size:12px;margin:18px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.progress{display:flex;gap:6px;margin-bottom:26px}.progress span{flex:1;height:5px;border-radius:9px;background:#eceef2}.progress span.on{background:var(--brand)}
/* app */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#475467;font-size:14px;font-weight:650;margin:2px 0}
.nav:hover{background:#f3efe8}.nav.on{background:var(--soft);color:var(--brand);font-weight:800}.nav .cnt{margin-left:auto;background:var(--thread);color:#fff;border-radius:99px;font-size:10.5px;padding:2px 7px;font-weight:850}

.main{margin-left:252px;flex:1;min-width:0}
.topbar{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:9px;width:380px;background:#f3efe8;border:1px solid var(--line);border-radius:11px;padding:9px 13px;color:#98a2b3;font-size:13.5px}
.search input{border:0;background:transparent;padding:0;box-shadow:none!important}
.content{padding:30px;max-width:1320px;margin:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}.ph h1{font-size:30px;letter-spacing:-1.1px;margin:6px 0 6px}.ph p{margin:0;color:var(--muted)}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}.metric .l{font-size:12.5px;color:var(--muted);font-weight:700}.metric .v{font-size:30px;font-weight:900;letter-spacing:-1px;margin:6px 0 2px}.metric .d{font-size:12px;color:var(--ok);font-weight:750}
.tl{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;transition:.15s;cursor:pointer}
.tl:hover{border-color:#e8b9ab;box-shadow:0 6px 18px rgba(200,68,42,.08)}
.tl .meta{flex:1;min-width:0}.tl .meta b{display:block;font-size:14.5px}.tl .meta span{font-size:12.5px;color:var(--muted)}
.ring{width:44px;height:44px;flex:none;position:relative}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:900}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{border:0;background:transparent;padding:11px 14px;font-weight:800;color:#667085;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}.tabs button.on{color:var(--brand);border-color:var(--brand)}
.answer{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ans{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left;transition:.15s}
.ans:hover{border-color:#e8b9ab}.ans.on{border-color:var(--brand);background:var(--soft)}.ans b{display:block;font-size:15px;margin:8px 0 3px}.ans span{font-size:12.5px;color:var(--muted)}
.reveal{border-radius:18px;padding:22px;background:linear-gradient(135deg,#171512,#24304d);color:#fff;position:relative;overflow:hidden}
.side-two{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.lock{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.event{position:relative;padding:0 0 18px 26px}.event:before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:1.5px;background:#e3e6eb}.event:last-child:before{display:none}
.event:after{content:"";position:absolute;left:2px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid var(--brand)}
.event b{font-size:13.5px}.event div{font-size:12.5px;color:var(--muted);margin-top:2px}
.bizcard{border-radius:22px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:250px;box-shadow:var(--sh2)}
.bizcard:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-120px;background:rgba(255,255,255,.07)}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:inline-block;line-height:0}
.qrbox img,.qrbox canvas{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:999;box-shadow:var(--sh2);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.5);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.open{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:var(--sh2);padding:28px;animation:pop .2s ease}

.x{border:0;background:#f1ece4;border-radius:9px;width:34px;height:34px;display:grid;place-items:center}
.draft{background:#faf7f2;border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.warm{display:flex;gap:3px}.warm i{width:7px;height:16px;border-radius:3px;background:#e6e8ec}.warm i.on{background:linear-gradient(180deg,var(--thread),#e9b872)}
.mobile-tab{display:none}
.pub{min-height:100vh;background:radial-gradient(900px 500px at 50% -20%,#f1e7dc,transparent 60%),var(--bg);padding:30px 16px 60px}
.pubcard{max-width:440px;margin:0 auto}
.livefeed .tl{cursor:default}

@media(max-width:760px){.sidebar{display:none}.main{margin-left:0}.search{display:none}.content{padding:18px 16px 90px}.g2,.steps,.layers,.g3,.g4,.price,.answer{grid-template-columns:1fr}.mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:8px 0 14px}.mobile-tab a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:#667085}.mobile-tab a.on{color:var(--brand)}.hero h1{font-size:42px}.phone{width:220px;height:450px}.stage{height:470px}.compare{font-size:12px}.cta h2{font-size:36px}.side-two{grid-template-columns:1fr}.topbar{padding:0 16px}}


/* ===== Editorial system v3 ===== */
:root{--serif:'Newsreader',Georgia,serif;--sans:'Schibsted Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--rule:#d9d2c5;--paper:#f7f4ee;--bg:#f2eee6}
body{background:var(--paper);font-family:var(--sans);font-size:15px;letter-spacing:-.003em;color:#1c1a17}
::selection{background:#171512;color:#f7f4ee}
h1,h2,h3,.hero h1,.sec h2,.ph h1,.auth h1,.cta h2,.step h3,.layer h3,.plan .amt,.metric .v,.pub h2,.modal h2{font-family:var(--serif);font-weight:300;letter-spacing:-.025em;font-optical-sizing:auto}
.serif,em.it{font-family:var(--serif);font-style:italic;font-weight:300;letter-spacing:-.02em}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#6f6a61}
.eyebrow:before{display:none}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:#6f6a61}
.btn{border-radius:2px;font-weight:600;font-size:14px;padding:13px 20px;letter-spacing:0}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:2px}.btn.lg{padding:16px 26px;font-size:15px}
.btn.primary{background:#171512;color:#f7f4ee;box-shadow:none}.btn.primary:hover{background:#c8442a;transform:none}
.btn.secondary{background:transparent;border:1px solid #171512;color:#171512}.btn.secondary:hover{background:#171512;color:#f7f4ee}
.btn.ghost{color:#171512;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn.dark{background:#171512;border-radius:2px}
.card,.metric,.tl,.plan,.step,.faq details{border-radius:3px;box-shadow:none;border-color:var(--rule);background:#fbf9f5}
.chip{border-radius:2px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:4px 7px}
input,select,textarea{border-radius:2px;background:#fff;border:1px solid #d6cfc2;padding:13px 14px}
input:focus,select:focus,textarea:focus{border-color:#171512;box-shadow:none}
.field label{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#57524a}
.avatar{border-radius:50%}
/* logo */
.logo{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.03em;gap:10px}
.logo .wm i{font-style:italic;color:inherit}
.logo .mark{background:transparent!important}
/* nav */
.mnav{background:rgba(247,244,238,.92);border-bottom:1px solid var(--rule)}
.mnav .in{height:66px;max-width:1320px}
.mnav .links{gap:34px;font-weight:500;font-size:14px;color:#3a362f}
.mnav .links a.on,.mnav .links a:hover{color:#171512;text-decoration:underline;text-underline-offset:6px}
.wrap{max-width:1320px;padding:0 40px}
/* hero */
.hero{background:var(--paper);padding:0;border-bottom:1px solid var(--rule)}
.hero .in{grid-template-columns:7fr 5fr;gap:0;align-items:stretch}
.hero .lede{padding:96px 64px 72px 0;border-right:1px solid var(--rule)}
.hero h1{font-size:104px;line-height:.92;letter-spacing:-.045em;font-weight:300;margin:28px 0 30px}
.hero h1 em{font-style:italic;color:#c8442a}
.hero p.lead{font-size:20px;line-height:1.55;color:#3a362f;max-width:560px}
.hero .art{padding:64px 0 64px 56px;display:flex;align-items:center}
.footnote{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#7c766c;margin-top:40px;display:flex;gap:26px;flex-wrap:wrap}
.footnote span:before{content:"— ";color:#c8442a}
/* receipt artefact */
.receipt{width:100%;max-width:440px;background:#fffdf8;border:1px solid #d6cfc2;position:relative;font-family:var(--mono);font-size:12px;color:#2a2722;box-shadow:0 30px 60px -30px rgba(23,21,18,.35)}
.receipt:before,.receipt:after{content:"";position:absolute;left:-1px;right:-1px;height:10px;background:radial-gradient(circle at 6px 5px,var(--paper) 4.2px,transparent 4.6px) 0 0/12px 10px repeat-x}
.receipt:before{top:-6px}.receipt:after{bottom:-6px;transform:rotate(180deg)}
.receipt .hd{display:flex;justify-content:space-between;padding:22px 24px 14px;border-bottom:1px dashed #cfc7b8;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;color:#6f6a61}
.receipt .names{padding:26px 24px 18px;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:6px}
.receipt .names b{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.05;display:block}
.receipt .names small{display:block;margin-top:4px;font-size:10.5px;color:#7c766c;text-transform:uppercase;letter-spacing:.05em}
.receipt .names .r{text-align:right}
.receipt .ln{height:30px}
.receipt .ln path{stroke-dasharray:4 4;animation:sew 6s linear infinite}
@keyframes sew{to{stroke-dashoffset:-80}}
.receipt dl{margin:0;padding:6px 24px 8px}
.receipt dl div{display:grid;grid-template-columns:132px 1fr;padding:9px 0;border-top:1px dotted #d8d0c2}
.receipt dt{color:#8a8378;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.receipt dd{margin:0;color:#1c1a17}
.seal{display:inline-block;position:relative;min-width:96px}
.seal .a,.seal .b{display:inline-block}
.seal .a{background:#1c1a17;color:transparent;border-radius:1px;animation:unseal 9s infinite;user-select:none}
.seal .b{position:absolute;left:0;top:0;opacity:0;animation:revealB 9s infinite;color:#c8442a;font-weight:500}
@keyframes unseal{0%,55%{opacity:1}62%,96%{opacity:0}100%{opacity:1}}
@keyframes revealB{0%,58%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
.receipt .ft{padding:16px 24px 24px;border-top:1px dashed #cfc7b8;display:flex;justify-content:space-between;align-items:flex-end}
.receipt .ft .st{font-family:var(--serif);font-style:italic;font-size:22px;letter-spacing:-.01em;color:#1c1a17}
.stamp{border:1.5px solid #c8442a;color:#c8442a;padding:5px 8px;transform:rotate(-6deg);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
/* index band */
.band{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
.band>div{padding:34px 28px 38px;border-right:1px solid var(--rule)}.band>div:last-child{border-right:0}.band>div:first-child{padding-left:0}
.band .n{font-family:var(--serif);font-weight:300;font-size:64px;letter-spacing:-.04em;line-height:1}
.band p{margin:12px 0 0;color:#57524a;line-height:1.5;font-size:14px;max-width:230px}
/* sections */
.sec{padding:120px 0;border-bottom:1px solid var(--rule)}.sec.alt{background:var(--bg)}
.sechead{display:grid;grid-template-columns:3fr 9fr;gap:40px;margin-bottom:64px}
.sechead .mono{padding-top:14px}
.sec h2{font-size:68px;line-height:1;letter-spacing:-.035em;margin:0;font-weight:300}
.sec h2 em{font-style:italic}
.sec p.lead{font-size:19px;color:#4a453e;margin-top:22px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #171512}
.cols3>div{padding:30px 32px 10px 0;margin-right:32px;border-right:1px solid var(--rule)}.cols3>div:last-child{border-right:0;margin-right:0}
.cols3 .num{font-family:var(--serif);font-weight:300;font-size:88px;line-height:.9;letter-spacing:-.05em;color:#171512}
.cols3 h3{font-size:30px;margin:22px 0 10px;font-weight:400;letter-spacing:-.02em}
.cols3 p{color:#57524a;line-height:1.6;margin:0 0 22px}
.optlist{list-style:none;padding:0;margin:0 0 24px;border-top:1px solid var(--rule)}
.optlist li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.optlist li.on{color:#c8442a;font-weight:600}
.dark{background:#171512!important;color:#efe9df}
.dark .mono,.dark .eyebrow{color:#9c958a}.dark p.lead{color:#b9b1a4}
.dark h2{color:#f7f4ee}
.reveal2{border:1px solid #3a362f;padding:34px;font-family:var(--mono);font-size:12px;color:#cfc7b8}
.reveal2 .row2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #3a362f;margin-top:20px}
.reveal2 .row2>div{padding:20px 0}.reveal2 .row2>div+div{border-left:1px solid #3a362f;padding-left:24px}
.reveal2 b{display:block;font-family:var(--serif);font-weight:300;font-size:30px;color:#f7f4ee;letter-spacing:-.02em;margin-top:8px}
.reveal2 .res{border-top:1px solid #3a362f;padding-top:22px;font-family:var(--serif);font-style:italic;font-size:30px;color:#f2a48e;letter-spacing:-.02em}
.compare{border:0;border-top:1px solid #171512;border-radius:0;background:transparent;margin-top:0}
.compare th{background:transparent;font-family:var(--mono);font-weight:500;color:#7c766c;font-size:10.5px;padding:16px 14px 16px 0}
.compare td{padding:18px 14px 18px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.compare td.us{background:transparent;color:#c8442a;font-weight:600}
.compare td:first-child{font-family:var(--serif);font-size:19px;font-weight:400}
.idx{border-top:1px solid #f7f4ee}
.idx .it{display:grid;grid-template-columns:80px 4fr 6fr 3fr;gap:24px;padding:34px 0;border-bottom:1px solid #3a362f;align-items:baseline}
.idx .it .k{font-family:var(--mono);font-size:12px;color:#9c958a}
.idx .it h3{font-size:40px;margin:0;font-weight:300;color:#f7f4ee}
.idx .it p{margin:0;color:#b9b1a4;line-height:1.6}
.idx .it .who{font-family:var(--mono);font-size:11px;color:#9c958a;text-transform:uppercase;letter-spacing:.05em}
.closing{padding:140px 0;text-align:left}
.closing h2{font-size:120px;line-height:.9;letter-spacing:-.05em;font-weight:300;margin:0 0 40px;max-width:1100px}
.closing h2 em{font-style:italic;color:#c8442a}
.foot{background:#171512;border-top:0}
.foot .grid{border-top:1px solid #3a362f;padding-top:40px}
/* auth */
.auth{grid-template-columns:5fr 6fr;background:var(--paper)}
.auth .side{background:var(--bg);color:#1c1a17;border-right:1px solid var(--rule);padding:44px 56px}
.auth .side .copy{font-family:var(--serif);font-weight:300;font-size:40px;line-height:1.05;letter-spacing:-.03em;max-width:460px;margin:0 0 34px}
.auth .side .copy em{font-style:italic;color:#c8442a}
.auth .side .receipt{max-width:400px}
.auth .form{background:var(--paper)}
.auth .box{width:min(420px,100%)}
.auth h1{font-size:46px;line-height:1;letter-spacing:-.035em;font-weight:300;margin:14px 0 10px}
.auth h1 em{font-style:italic}
.oauth .btn{border:1px solid #d6cfc2;background:#fff;color:#1c1a17}
.oauth .btn:hover{border-color:#171512;background:#fff;color:#171512}
.progress span{height:2px;background:#ddd5c8}.progress span.on{background:#171512}
.or{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.threadart,.q-mark,.stitch:after{display:none!important}
/* card */
.bizcard{border-radius:4px;box-shadow:0 24px 48px -24px rgba(23,21,18,.45)}
.bizcard:before{display:none}
.bizcard .bc-name{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-.025em}
.bizcard .bc-meta{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
/* app */
.sidebar{background:var(--paper);border-right:1px solid var(--rule)}
.nav{border-radius:2px;font-weight:500}
.nav.on{background:#171512;color:#f7f4ee}.nav .cnt{background:#c8442a;border-radius:2px}
.topbar{background:rgba(247,244,238,.92);border-bottom:1px solid var(--rule)}
.search{border-radius:2px;background:#fff;border-color:#d6cfc2}
.ph{border-bottom:1px solid #171512;padding-bottom:22px;margin-bottom:28px}
.ph h1{font-size:44px;font-weight:300;letter-spacing:-.035em}
.grid.g4:has(.metric){gap:0;border-bottom:1px solid var(--rule)}
.metric{border:0;border-right:1px solid var(--rule);background:transparent;border-radius:0;padding:6px 24px 22px}
.grid.g4 .metric:first-child{padding-left:0}.grid.g4 .metric:last-child{border-right:0}
.metric .l{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.metric .v{font-size:52px;font-weight:300;letter-spacing:-.04em}
.tl{border-radius:2px;background:#fff}.tl:hover{border-color:#171512;box-shadow:none}
.tabs button.on{color:#171512;border-color:#171512}
.ans{border-radius:2px;background:#fff}.ans.on,.ans:hover{border-color:#171512;background:#fff}
.ans b{font-family:var(--serif);font-weight:400;font-size:21px}
.reveal{border-radius:3px;background:#171512}
.modal{border-radius:4px;background:var(--paper)}
.toast{border-radius:2px}
.pub{background:var(--bg)}
.pub p,.pub .muted,.modal p{overflow-wrap:anywhere}
.layer{border-radius:2px}
.plan{border-radius:2px}.plan.hot{border:1px solid #171512;box-shadow:none}
@media(max-width:1000px){.hero .in{grid-template-columns:1fr}.hero .lede{border-right:0;padding:64px 0 30px}.hero .art{padding:10px 0 60px}.hero h1{font-size:68px}.band{grid-template-columns:1fr 1fr}.band>div{padding-left:0!important}.sechead{grid-template-columns:1fr;gap:10px}.sec h2{font-size:48px}.cols3{grid-template-columns:1fr}.cols3>div{border-right:0;margin-right:0;border-bottom:1px solid var(--rule)}.idx .it{grid-template-columns:1fr}.closing h2{font-size:72px}.auth{grid-template-columns:1fr}.wrap{padding:0 22px}}
@media(max-width:760px){.hero h1{font-size:52px}.closing h2{font-size:52px}.band{grid-template-columns:1fr}.band>div{border-right:0;border-bottom:1px solid var(--rule)}.receipt .names b{font-size:19px}}

/* v3.1: original type restored - Instrument Serif + Manrope */
:root{--serif:'Instrument Serif',Georgia,serif;--sans:Manrope,Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:Manrope,Inter,system-ui,sans-serif}
body{font-family:var(--sans);letter-spacing:0}
h1,h2,h3,.hero h1,.sec h2,.ph h1,.auth h1,.cta h2,.step h3,.layer h3,.plan .amt,.metric .v,.pub h2,.modal h2{font-weight:400;letter-spacing:-.015em}
.serif,em.it{font-weight:400;letter-spacing:-.01em}
.eyebrow,.mono,.chip,.field label{font-family:var(--sans);font-weight:700;letter-spacing:.08em}

</style>
</head>
<body>
<div id="root"></div>
<div class="modal-back" id="mback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* Introthread prototype — local data store, router, views */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5,HR=36e5;
const COLORS=['#c8442a','#2f3e9e','#2f7d4f','#8a5a2b','#6b3fa0','#1d6f78','#b0762a','#3c3a36'];
const colorFor=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(n,cls='')=>`<div class="avatar ${cls}" style="background:${colorFor(n)}">${esc(initials(n))}</div>`;
const ago=t=>{const d=Date.now()-t;if(d<HR)return Math.max(1,Math.round(d/6e4))+'m ago';if(d<DAY)return Math.round(d/HR)+'h ago';return Math.round(d/DAY)+'d ago'};
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20)||'me';

const IC={
 logo:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="3" fill="#fff"/><circle cx="18" cy="12" r="3" fill="#2f3e9e"/><path d="M9 12c2-4 4-4 6 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M9 12c2 4 4 4 6 0" stroke="#6f8cff" stroke-width="2" stroke-linecap="round"/></svg>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 thread:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12c2-4 5-4 7 0M8.5 12c2 4 5 4 7 0"/>',
 tap:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/><path d="M2 9c1.5-1.5 1.5-4.5 0-6M22 9c-1.5-1.5-1.5-4.5 0-6" transform="translate(0 6)"/>',
 room:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
 bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',
 intro:'<circle cx="5" cy="7" r="2.5"/><circle cx="19" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 8.5l3.5 7.5M17 8.5l-3.5 7.5"/>',
 keep:'<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',
 pause:'<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',
 out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 nfc:'<path d="M6 8a6 6 0 010 8M10 5a10 10 0 010 14M14 2a14 14 0 010 20"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'
};
const ic=(n,s=18,c='currentColor',w=1.9)=>n==='logo'?IC.logo:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
const logo=(dark)=>`<a href="#/" class="logo" style="${dark?'color:#f6f1e8':'color:#171512'}"><svg class="mark" width="30" height="22" viewBox="0 0 30 22" fill="none"><circle cx="5" cy="11" r="3.6" fill="${dark?'#f6f1e8':'#171512'}"/><circle cx="25" cy="11" r="3.6" fill="#c8442a"/><path d="M8.5 11c3-7 10-7 13 0" stroke="${dark?'#f6f1e8':'#171512'}" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2.2 2.4"/><path d="M8.5 11c3 7 10 7 13 0" stroke="#c8442a" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">intro<i>thread</i></span></a>`;

/* What's next options */
const NEXT={
 meet:{label:'Meet again',desc:'Book a proper conversation',icon:'calendar'},
 intro:{label:'Introduce someone',desc:'One of us knows someone useful',icon:'intro'},
 keep:{label:'Stay in touch',desc:'Keep the thread warm',icon:'keep'},
 notnow:{label:'Not now',desc:'Quietly close, no awkwardness',icon:'pause'}
};

/* ---------- store ---------- */
const KEY='introthread_v1';
let DB=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:[],session:null,threads:[],rooms:[]}}catch(e){return{users:[],session:null,threads:[],rooms:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const me=()=>DB.users.find(u=>u.id===DB.session);
const myThreads=()=>DB.threads.filter(t=>t.ownerId===DB.session).sort((a,b)=>b.createdAt-a.createdAt);
const myRooms=()=>DB.rooms.filter(r=>r.ownerId===DB.session).sort((a,b)=>b.date-a.date);
const findThread=id=>DB.threads.find(t=>t.id===id);

function threadState(t){
 if(t.mine==='notnow'||t.theirs==='notnow'){if(t.mine&&t.theirs)return'closed'}
 if(t.resolvedAt)return'resolved';
 if(t.mine&&t.theirs)return t.mine==='notnow'||t.theirs==='notnow'?'closed':'matched';
 if(!t.confirmed)return'pending';
 return'open';
}
function stateChip(t){const s=threadState(t);return{
 pending:'<span class="chip orange">Awaiting confirmation</span>',
 open:'<span class="chip blue">Waiting on "What\'s next?"</span>',
 matched:'<span class="chip green">Matched, act now</span>',
 resolved:'<span class="chip dark">Resolved</span>',
 closed:'<span class="chip">Closed gently</span>'}[s]}
/* Resolve window: 7 days. Pulse = remaining share. */
function pulse(t){if(t.resolvedAt||threadState(t)==='closed')return 1;const left=Math.max(0,t.createdAt+7*DAY-Date.now());return left/(7*DAY)}
function ring(t){const p=pulse(t),st=threadState(t);const c=st==='resolved'?'#171512':st==='closed'?'#98a2b3':p>.5?'#2f3e9e':p>.2?'#b0762a':'#b3261e';const r=18,C=2*Math.PI*r;const days=Math.ceil(p*7);
 const label=st==='resolved'?ic('check',14,'#171512',3):st==='closed'?'–':days+'d';
 return`<div class="ring" title="Thread pulse"><svg width="44" height="44"><circle cx="22" cy="22" r="${r}" stroke="#eceef2" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="${r}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div class="t" style="color:${c}">${label}</div></div>`}
function warmth(t){let s=1;if(t.confirmed)s++;if(t.mine&&t.theirs)s++;if(t.events.some(e=>e.k==='followup'))s++;if(t.resolvedAt)s++;return s}

 <p class="center small muted" style="margin-top:22px">Want your own card? <a href="#/signup" style="color:var(--brand);font-weight:800">Create one free</a></p></div></div>`}

function guestThread(e,oid){e.preventDefault();const n=$('#gn').value.trim();const t={id:uid(),ownerId:oid,other:{name:n,role:$('#gr').value.trim()||'Professional',company:$('#gc').value.trim(),email:$('#ge').value.trim()},where:$('#gw').value.trim()||'In person',note:'',createdAt:Date.now(),confirmed:true,mine:null,theirs:null,resolvedAt:null,roomId:null,guest:true,events:[{k:'tap',at:Date.now(),text:n.split(' ')[0]+' started a Thread from your card'},{k:'confirm',at:Date.now(),text:'Verified by both'}]};
 DB.threads.push(t);save();go('#/t/'+t.id);return false}
function vGuest(id){const t=findThread(id);if(!t)return`<div class="pub"><div class="pubcard card pad-lg center">${logo()}<h2>This Thread is no longer available</h2></div></div>`;const o=DB.users.find(u=>u.id===t.ownerId)||{name:'Your contact',role:'',company:''};const f=o.name.split(' ')[0];let body;
 if(!t.confirmed)body=`<h2 style="letter-spacing:-.8px;margin:0 0 6px">Did you meet ${esc(o.name)}?</h2><p class="muted">${esc(f)} started a Thread after meeting you at <b>${esc(t.where)}</b>. Confirm it to keep a shared record and decide what happens next.</p><div class="row" style="margin-top:18px"><button class="btn primary" style="flex:1" onclick="guestConfirm('${t.id}')">${ic('check',16)} Yes, confirm</button><button class="btn secondary" onclick="toast('Thanks. ${esc(f)} will not be notified.')">Not me</button></div>`;

 else body=`<div class="center"><div style="width:60px;height:60px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',28,'#2f7d4f',3)}</div><h2 style="letter-spacing:-.8px">Answer locked in</h2><p class="muted">${t.mine?`You both answered. ${esc(f)} will follow up.`:`We'll reveal both answers when ${esc(f)} replies.`}</p><a href="#/signup" class="btn primary">Get your own free card</a>${DB.session===t.ownerId?`<div style="margin-top:14px"><a href="#/app/thread/${t.id}" class="btn ghost">Back to your view as ${esc(f)}</a></div>`:''}</div>`;
 return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div><div class="card pad row" style="margin-bottom:14px">${av(o.name,'lg')}<div><b style="font-size:17px">${esc(o.name)}</b><div class="small muted">${esc(o.role)}${o.company?', '+esc(o.company):''}</div></div></div><div class="card pad-lg">${body}</div><p class="tiny muted center" style="margin-top:16px">Introthread &middot; Every handshake, followed through.</p></div></div>`}

 if(p[0]==='app'){if(!authed){go('#/login');return}
  html=!p[1]?vToday():p[1]==='threads'?vThreads():p[1]==='thread'?vThread(p[2]):p[1]==='tap'?vTap():p[1]==='card'?vCard():p[1]==='rooms'?vRooms():p[1]==='room'?vRoom(p[2]):p[1]==='settings'?vSettings():vToday()}
 else if(!p[0])html=vHome();
 else html=({how:vHow,rooms:vRoomsPage,networks:vNetworks,pricing:vPricing,about:vAbout,privacy:vPrivacy,login:()=>authed?(go('#/app'),''):vLogin(),signup:()=>authed?(go('#/app'),''):vSignup(),t:()=>vGuest(p[1])}[p[0]]||(()=>vPublic(p[0])))();
 if(html==null)return;$('#root').innerHTML=html;
 const u=me();if(u){qr($('#qrToday'),profileUrl(u),96);qr($('#qrTap'),profileUrl(u),210);qr($('#qrCard'),profileUrl(u),96)}
 const rq=$('#qrRoom');if(rq){const r=DB.rooms.find(x=>x.id===p[2]);qr(rq,'https://introthread.com/r/'+r.code,150)}
 document.title={app:'Introthread',login:'Log in | Introthread',signup:'Create your card | Introthread',pricing:'Pricing | Introthread'}[p[0]]||'Introthread | Every handshake, followed through';
 if(!window._keepScroll)window.scrollTo(0,0)}
let lastHash=location.hash;window.addEventListener('hashchange',()=>{window._keepScroll=false;lastHash=location.hash;render()});
const _r=render;render=function(){const same=location.hash===lastHash&&window._rendered;window._keepScroll=same;_r();window._rendered=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setInterval(()=>{if(location.hash.startsWith('#/app')&&!$('#mback').classList.contains('open')&&!document.activeElement.matches('input,textarea,select'))render()},60000);
/* ---------- Supabase cloud layer ----------
   Real accounts, cards, Threads and Rooms live in Supabase (row-level security).
   The "Explore the live demo" account stays local to the browser so anyone can try it safely. */
const CFG=window.INTROTHREAD_CONFIG||{};
const SB=(window.supabase&&CFG.supabaseUrl&&CFG.supabaseAnonKey)?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let MODE=DB.session?'demo':null;
const cloud=()=>MODE==='cloud'&&SB;
const SITE='https://introthread.com';
profileUrl=u=>SITE+'/'+u.handle;
const threadLink=t=>SITE+'/t/'+(t.token||t.id);

/* persist only demo data locally */
save=function(){const keep=x=>!x._c;localStorage.setItem(KEY,JSON.stringify({users:DB.users.filter(keep),threads:DB.threads.filter(keep),rooms:DB.rooms.filter(keep),session:MODE==='demo'?DB.session:null}))};
function clearCloud(){DB.users=DB.users.filter(x=>!x._c);DB.threads=DB.threads.filter(x=>!x._c);DB.rooms=DB.rooms.filter(x=>!x._c)}
const mapProfile=(p,email)=>({_c:true,id:p.id,name:p.name,email:email||'',role:p.role||'',company:p.company||'',city:p.city||'',bio:p.bio||'',handle:p.handle,theme:p.theme||'midnight',links:p.links||{},plan:p.plan||'Free',prefs:p.prefs||{},created:Date.parse(p.created_at)||Date.now()});
const mapThread=r=>({_c:true,id:r.id,token:r.guest_token,ownerId:r.owner_id,other:{name:r.other_name,role:r.other_role||'',company:r.other_company||'',email:r.other_email||''},where:r.where_met||'In person',note:r.note||'',createdAt:Date.parse(r.created_at),confirmed:!!r.confirmed,mine:r.mine,theirs:r.theirs,resolvedAt:r.resolved_at?Date.parse(r.resolved_at):null,roomId:r.room_id,
 events:(r.thread_events||[]).map(e=>({k:e.kind,at:Date.parse(e.at),text:e.text})).sort((a,b)=>a.at-b.at)});
const mapRoom=r=>({_c:true,id:r.id,ownerId:r.owner_id,name:r.name,date:Date.parse(r.event_date),location:r.location||'',code:r.code,created:Date.parse(r.created_at)});
function fail(e){console.error(e);toast((e&&e.message)?e.message:'Something went wrong. Please try again.');return null}

async function loadCloud(user){
 let {data:p,error}=await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return fail(error);
 if(!p){const m=(user.user_metadata||{}).profile;if(!m){MODE='cloud';DB.session=user.id;PENDING=user;return'needs-profile'}
  const ins=await SB.from('profiles').insert({id:user.id,handle:m.handle,name:m.name,role:m.role,company:m.company,city:m.city,bio:m.bio,theme:m.theme}).select().single();if(ins.error)return fail(ins.error);p=ins.data}
 const [th,rm]=await Promise.all([SB.from('threads').select('*, thread_events(*)').order('created_at',{ascending:false}),SB.from('rooms').select('*')]);
 if(th.error)return fail(th.error);if(rm.error)return fail(rm.error);
 clearCloud();DB.users.push(mapProfile(p,user.email));DB.threads.push(...th.data.map(mapThread));DB.rooms.push(...rm.data.map(mapRoom));DB.session=user.id;MODE='cloud';return'ok'}
let PENDING=null;
async function addEvent(t,k,text){const at=Date.now();t.events.push({k,at,text});if(cloud()){const {error}=await SB.from('thread_events').insert({thread_id:t.id,kind:k,text});if(error)fail(error)}}
async function upd(table,id,patch){if(!cloud())return true;const {error}=await SB.from(table).update(patch).eq('id',id);if(error){fail(error);return false}return true}

/* auth */
doLogin=function(e){e.preventDefault();const em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;
 if(em==='demo@introthread.com'){demoLogin();return false}
 if(!SB){$('#lerr').textContent='Accounts are not available right now. Try the demo account.';return false}

 SB.auth.signInWithPassword({email:em,password:pw}).then(async({data,error})=>{b.disabled=false;b.textContent='Log in';
  if(error){$('#lerr').textContent=/confirm/i.test(error.message)?'Please confirm your email first. Check your inbox for the link.':'That email and password do not match.';return}
  const r=await loadCloud(data.user);if(r==='needs-profile'){go('#/signup');SU={step:2,name:'',email:em};render();return}
  if(r){save();toast('Welcome back, '+me().name.split(' ')[0]);go('#/app')}});return false}

oauth=function(p){toast(p+' sign-in is coming soon. Please use email for now.')};

const _su1=su1;su1=function(e){e.preventDefault();const em=$('#se').value.trim().toLowerCase();if(em==='demo@introthread.com'){$('#serr').textContent='That email is reserved for the demo.';return false}

 const email=SU.email;SU={step:1};
 if(data.session){const r=await loadCloud(data.user);if(r){save();go('#/app');modal(`<div class="center"><div style="width:64px;height:64px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',30,'#2f7d4f',3)}</div><h2 style="letter-spacing:-.8px">Your card is live</h2><p class="muted">introthread.com/${esc(prof.handle)}</p><button class="btn primary" onclick="closeModal();go('#/app/tap')">Start sharing</button></div>`)}}

/* thread actions */

newThread=function(e){e.preventDefault();const rid=$('#tw').value,room=DB.rooms.find(r=>r.id===rid);const where=room?room.name:($('#tw2').value.trim()||'In person');
 const o={name:$('#tn').value.trim(),role:$('#tr').value.trim()||'Professional',company:$('#tc').value.trim(),email:$('#te').value.trim()},note=$('#tx').value.trim();
 if(!cloud()){const t={id:uid(),ownerId:DB.session,other:o,where,note,createdAt:Date.now(),confirmed:false,mine:null,theirs:null,resolvedAt:null,roomId:room?room.id:null,events:[{k:'tap',at:Date.now(),text:'Thread started at '+where}]};DB.threads.push(t);save();toast('Thread started');go('#/app/thread/'+t.id);return false}
 SB.from('threads').insert({owner_id:DB.session,other_name:o.name,other_role:o.role,other_company:o.company,other_email:o.email,where_met:where,note,room_id:room?room.id:null}).select().single().then(async({data,error})=>{if(error)return fail(error);
  const t=mapThread(data);DB.threads.push(t);await addEvent(t,'tap','Thread started at '+where);copy(threadLink(t),'Thread started. Confirm link copied, send it to '+o.name.split(' ')[0]);go('#/app/thread/'+t.id)});return false};
saveCard=function(e){e.preventDefault();const u=me();const patch={name:$('#cn').value.trim(),role:$('#cr').value.trim(),company:$('#cc').value.trim(),city:$('#cct').value.trim(),bio:$('#cb').value.trim(),links:{linkedin:$('#cl').value.trim(),website:$('#cw').value.trim(),calendar:$('#ck').value.trim()}};

 if(!g)return`<div class="pub"><div class="pubcard card pad-lg center">${logo()}<h2>This Thread is no longer available</h2></div></div>`;
 const o=g.owner,f=o.name.split(' ')[0];let body;
 if(!g.confirmed)body=`<h2 style="letter-spacing:-.8px;margin:0 0 6px">Did you meet ${esc(o.name)}?</h2><p class="muted">${esc(f)} started a Thread after meeting you at <b>${esc(g.where_met)}</b>. Confirm it to keep a shared record and decide what happens next.</p><div class="row" style="margin-top:18px"><button class="btn primary" style="flex:1" onclick="guestConfirm('${esc(tok)}')">${ic('check',16)} Yes, confirm</button><button class="btn secondary" onclick="toast('Thanks. ${esc(f)} will not be notified.')">Not me</button></div>`;
 else if(!g.theirs)body=`<div class="eyebrow">Verified Thread &middot; ${esc(g.where_met)}</div><h2 style="letter-spacing:-.8px;margin:8px 0 6px">What's next with ${esc(f)}?</h2><p class="small muted">${ic('lock',12)} Private until you both answer. A "Not now" is never shown.</p><div class="answer" style="margin-top:14px">${Object.entries(NEXT).map(([k,v])=>`<button class="ans" onclick="guestAnswer('${esc(tok)}','${k}')">${ic(v.icon,20,'#c8442a')}<b>${v.label}</b><span>${v.desc}</span></button>`).join('')}</div>`;
 else{const oa=g.owner_answer,match=oa&&oa===g.theirs&&oa!=='notnow';body=`<div class="center"><div style="width:60px;height:60px;border-radius:50%;background:#e8f8f0;display:grid;place-items:center;margin:auto">${ic('check',28,'#2f7d4f',3)}</div><h2 style="letter-spacing:-.8px">${match?`It's a match: you both chose ${NEXT[oa].label.toLowerCase()}`:'Answer locked in'}</h2><p class="muted">${oa?(match?`${esc(f)} will follow up soon.`:`${esc(f)} chose ${NEXT[oa].label.toLowerCase()}.`):`We'll reveal both answers when ${esc(f)} replies.`}</p><a href="#/signup" class="btn primary">Get your own free card</a></div>`}
 return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div><div class="card pad row" style="margin-bottom:14px">${av(o.name,'lg')}<div><b style="font-size:17px">${esc(o.name)}</b><div class="small muted">${esc(o.role||'')}${o.company?', '+esc(o.company):''}</div></div></div><div class="card pad-lg">${body}</div><p class="tiny muted center" style="margin-top:16px">Introthread &middot; Every handshake, followed through.</p></div></div>`};
const _gc=guestConfirm;guestConfirm=function(tok){if(findThread(tok)&&!findThread(tok)._c)return _gc(tok);SB.rpc('guest_confirm',{p_token:tok}).then(({error})=>{if(error)return fail(error);delete GUEST[tok];refreshOwned(tok);render()})};
const _ga=guestAnswer;guestAnswer=function(tok,k){if(findThread(tok)&&!findThread(tok)._c)return _ga(tok,k);SB.rpc('guest_answer',{p_token:tok,p_answer:k}).then(({error})=>{if(error)return fail(error);delete GUEST[tok];refreshOwned(tok);render()})};
async function refreshOwned(tok){if(!cloud())return;const t=DB.threads.find(x=>x.token===tok&&x._c);if(!t)return;const {data}=await SB.from('threads').select('*, thread_events(*)').eq('id',t.id).maybeSingle();if(data){Object.assign(t,mapThread(data))}}
function vRoomCode(code){return`<div class="pub"><div class="pubcard"><div class="center" style="margin-bottom:22px">${logo()}</div><div class="card pad-lg center"><span class="chip blue">Room ${esc(String(code||'').toUpperCase())}</span><h2 style="letter-spacing:-.8px">You're in the Room</h2><p class="muted">Tap or scan the card of anyone you meet here to start a Thread. Every Thread is tagged to this event.</p><a href="#/signup" class="btn primary">Get your free card</a></div></div></div>`}

/* Supabase email-link callback: introthread.com/app#access_token=... or #error=... */
const AUTH_CB=/(^|[#&])(access_token|error_description|error)=/.test(location.hash);
if(AUTH_CB){const hp=new URLSearchParams(location.hash.slice(1));window._authErr=hp.get('error_description');}
/* path URLs (introthread.com/handle, /t/token, /r/code) -> hash routes */
if(!AUTH_CB&&location.pathname.length>1&&!location.hash){history.replaceState(null,'','/#'+location.pathname)}
const _render2=render;render=function(){const p=(location.hash||'#/').slice(1).split('/').filter(Boolean);
 if(p[0]==='r'){$('#root').innerHTML=vRoomCode(p[1]);return}
 if(p[0]==='app'&&MODE==='cloud'&&PENDING&&!me()){go('#/signup');return}
 _render2()};
(async function boot(){
 if(AUTH_CB){$('#root').innerHTML=`<div class="pub"><div class="pubcard center"><div style="margin:80px 0 20px">${logo()}</div><p class="muted">Signing you in...</p></div></div>`}
 if(SB){const {data}=await SB.auth.getSession();const s=data&&data.session;
  if(s&&MODE!=='demo'){const r=await loadCloud(s.user);if(r==='needs-profile'){SU={step:2,name:(s.user.user_metadata||{}).full_name||'',email:s.user.email};location.hash='#/signup'}}
  SB.auth.onAuthStateChange(async(ev,sess)=>{if(ev==='SIGNED_IN'&&sess&&MODE!=='demo'&&!me()){const r=await loadCloud(sess.user);if(r==='ok'){save();render()}}})}
  if(AUTH_CB){if(SB)await new Promise(r=>setTimeout(r,400));const ok=SB&&(await SB.auth.getSession()).data.session;history.replaceState(null,'','/'+(ok?'#/app':'#/login'));if(!ok&&window._authErr)setTimeout(()=>toast(window._authErr.replace(/\+/g,' ')),300);else if(ok&&!me()){const r=await loadCloud(ok.user);if(r==='needs-profile'){SU={step:2,name:'',email:ok.user.email};location.hash='#/signup'}}if(ok)setTimeout(()=>toast('Email confirmed. Welcome to Introthread.'),300)}
 render()})();

</script>
</body>
