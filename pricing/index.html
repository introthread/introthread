/* ---------- store ---------- */
const KEY='introthread_v1';
let DB=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:[],session:null,threads:[],rooms:[]}}catch(e){return{users:[],session:null,threads:[],rooms:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
const me=()=>DB.users.find(u=>u.id===DB.session);
const myThreads=()=>DB.threads.filter(t=>t.ownerId===DB.session).sort((a,b)=>b.createdAt-a.createdAt);
const myRooms=()=>DB.rooms.filter(r=>r.ownerId===DB.session).sort((a,b)=>b.date-a.date);

function threadState(t){
 if(t.mine==='notnow'||t.theirs==='notnow'){if(t.mine&&t.theirs)return'closed'}
 if(t.resolvedAt)return'resolved';
 if(t.mine&&t.theirs)return t.mine==='notnow'||t.theirs==='notnow'?'closed':'matched';
 if(!t.confirmed)return'pending';
 return'open';
}
function stateChip(t){const s=threadState(t);return{
 pending:'<span class="chip orange">Awaiting confirmation</span>',
 open:'<span class="chip blue">Waiting on "What\'s next?"</span>',
 matched:'<span class="chip green">Matched, act now</span>',
 resolved:'<span class="chip dark">Resolved</span>',
 closed:'<span class="chip">Closed gently</span>'}[s]}
/* Resolve window: 7 days. Pulse = remaining share. */
function pulse(t){if(t.resolvedAt||threadState(t)==='closed')return 1;const left=Math.max(0,t.createdAt+7*DAY-Date.now());return left/(7*DAY)}
function ring(t){const p=pulse(t),st=threadState(t);const c=st==='resolved'?'#0f1218':st==='closed'?'#98a2b3':p>.5?'#3157ff':p>.2?'#ff6b3d':'#d14343';const r=18,C=2*Math.PI*r;const days=Math.ceil(p*7);
 const label=st==='resolved'?ic('check',14,'#0f1218',3):st==='closed'?'–':days+'d';
 return`<div class="ring" title="Thread pulse"><svg width="44" height="44"><circle cx="22" cy="22" r="${r}" stroke="#eceef2" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="${r}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div class="t" style="color:${c}">${label}</div></div>`}
function warmth(t){let s=1;if(t.confirmed)s++;if(t.mine&&t.theirs)s++;if(t.events.some(e=>e.k==='followup'))s++;if(t.resolvedAt)s++;return s}
const warmBar=n=>`<div class="warm" title="Verified warmth ${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;

function seed(u){
 const now=Date.now();
 const people=[
  ['Sarah Williams','Marketing Director','Acme Technologies','London Tech Week','Interested in an enterprise partnership. Wants a pilot proposal.',2*DAY,true,'meet','meet',false],
  ['James Carter','CEO','Northwind Capital','SaaStr Europa','Raising a fund focused on HR tech. Asked about our data story.',4*DAY,true,'intro',null,false],
  ['Priya Shah','Head of Platform','Lattice Ventures','Founders Breakfast, Shoreditch','Runs portfolio talent programme. Possible design partner.',6*DAY+10*HR,true,null,null,false],
  ['Daniel Okafor','Partner','Atlas Seed','Web Summit','Great chat on Africa to UK expansion.',11*DAY,true,'keep','keep',true],
  ['Emma Laurent','Product Lead','Helio','London Tech Week','Not a fit right now.',9*DAY,true,'notnow','keep',false],
  ['Michael Brown','VP Sales','Brightline','Coffee, Kings Cross','',5*HR,false,null,null,false]
 ];
 const room={id:uid(),ownerId:u.id,name:'London Tech Week Founders Night',date:now-2*DAY,location:'Shoreditch, London',code:'LTW26',created:now-3*DAY};
 DB.rooms.push(room);
 people.forEach(([name,role,company,where,note,age,conf,mine,theirs,res],i)=>{
  const c=now-age;const t={id:uid(),ownerId:u.id,other:{name,role,company,email:slug(name)+'@example.com'},where,note,createdAt:c,confirmed:conf,mine,theirs,resolvedAt:res?c+3*DAY:null,roomId:where==='London Tech Week'?room.id:null,
   events:[{k:'tap',at:c,text:'Tapped at '+where}]};
  if(conf)t.events.push({k:'confirm',at:c+20*6e4,text:name.split(' ')[0]+' confirmed the Thread'});
  if(mine)t.events.push({k:'answer',at:c+HR,text:'You answered "What\'s next?"'});
  if(theirs)t.events.push({k:'answer',at:c+3*HR,text:name.split(' ')[0]+' answered "What\'s next?"'});
  if(res){t.events.push({k:'followup',at:c+DAY,text:'Follow-up sent'});t.events.push({k:'resolved',at:c+3*DAY,text:'Thread resolved: stayed in touch'})}
  DB.threads.push(t)});
 for(let i=0;i<14;i++){const n=['Ava Thompson','Leo Martins','Grace Kim','Noah Patel','Zara Ahmed','Oliver Grant','Mia Rossi','Ethan Cole','Isla Murray','Lucas Bauer','Chloe Evans','Ben Adeyemi','Sofia Ruiz','Jack Turner'][i];
  const c=room.date+i*9*6e4;const mine=['meet','intro','keep','keep','meet',null,'notnow'][i%7];const theirs=i%3?mine:'keep';
  DB.threads.push({id:uid(),ownerId:u.id,other:{name:n,role:['Founder','Investor','Engineer','Designer','Operator'][i%5],company:['Kite','Orbit','Fable','Verve','Atlas'][i%5],email:slug(n)+'@example.com'},where:room.name,note:'',createdAt:c,confirmed:i%5!==4,mine,theirs:i%5!==4?theirs:null,resolvedAt:i%4===0?c+DAY:null,roomId:room.id,events:[{k:'tap',at:c,text:'Tapped in room '+room.code}]})}
}

ow up. It also belongs to you, while company email and its contacts stay with your employer when you change jobs.'],['What are the main advantages?','No app needed to connect, contacts confirmed by both people, context you never lose, a clear next step with reminders before a connection goes cold, private by default, and Rooms that show which event connections actually led somewhere.'],['Why choose Introthread over a business card app, a CRM or LinkedIn?','Card apps pass on your details and stop there. CRMs are built for sales pipelines, need manual typing and are owned by the company. LinkedIn gives you a connection without context or a next step. Introthread is built around the moment two people meet and agree what happens next, and then helps make sure it happens.'],['Can I delete my account and data?','Yes. Settings, Privacy and visibility, Your data. Export first if you want a copy, then delete permanently. Nothing is kept after deletion.']].map(([q,a],i)=>`<details ${i?'':'open'}><summary>${q}<span>${sv('chevd',18)}</span></summary><p>${a}</p></details>`).join('')}</div></div></section>`+ctaBand()+foot()}

const POLICY=[['who','Who we are','<p>Introthread (&ldquo;we&rdquo;, &ldquo;us&rdquo;) provides digital professional cards and shared Threads that record when two people meet. We are the controller of the personal data described here. Contact us at <a href="mailto:privacy@introthread.com">privacy@introthread.com</a>.</p>'],
['data','Data we collect','<ul><li><b>Account data:</b> name, email address and password (stored as a secure hash by our authentication provider).</li><li><b>Card data:</b> job title, company, city, bio, links, profile photo and card style you choose to add.</li><li><b>Thread data:</b> who you met, when and where, your private notes and your answer to What&rsquo;s next?.</li><li><b>Details of people you meet or import:</b> when you add someone (typed, scanned from a QR code or business card, pasted, picked from your phone contacts or imported from a LinkedIn, Google or Outlook file), we store the name, email, phone, LinkedIn, job title, company and other details you choose to keep. Importing never contacts anyone.</li><li><b>Billing data:</b> if you buy a paid plan, your plan, payment status and invoices. Card details are handled by our payment provider and never reach us.</li><li><b>Time and location of a Thread:</b> when you save a Thread, the exact time and, if you allow it, your phone&rsquo;s location. See &ldquo;Location when you save a Thread&rdquo; below.</li><li><b>Technical data:</b> basic device and log information needed to keep the service secure.</li></ul>'],
['location','Location when you save a Thread','<p>When you save a new Thread, we record the exact time you saved it. If you allow it, we also record your phone&rsquo;s location at that moment: the coordinates, how accurate they are (for example &ldquo;about 12 m&rdquo;) and a place name, so you can remember where you met.</p><ul><li><b>Your permission:</b> your phone asks before sharing your location. If you say no, the Thread is still saved, with the time only.</li><li><b>Only your own location:</b> we record the location of your phone, never the location of the person you met.</li><li><b>Place name:</b> to turn the coordinates into a place name, we send them to OpenStreetMap&rsquo;s Nominatim service. We send only the coordinates, not your name or any details about the person you met.</li><li><b>Who can see it:</b> the time and location are shown only to you, on your Thread, and are included when you export your data.</li><li><b>Turn it off:</b> you can stop recording location at any time in Settings, under &ldquo;Your data and privacy&rdquo;, with the &ldquo;Save where I meet people&rdquo; switch. You can also remove location permission in your phone or browser settings.</li></ul><p>We use this data to provide the feature you chose to use (contract), and the location part only with your permission, which you can withdraw at any time. It is kept and deleted with the Thread it belongs to.</p>'],
['scan','Business card and QR scanning','<p>When you scan a business card, the text is read on your own phone or computer. The photo is not uploaded to us; only the details you choose to save are stored with your Thread or contact.</p>'],
['ai','AI follow-up drafts','<p>If you switch on &ldquo;Draft follow-ups with AI&rdquo;, we send the context of that one Thread (names, where you met, your note and your answers) to our AI provider to write a suggested message. Drafts are never sent without you. Our AI provider processes this data only to create the draft, under a data processing agreement, and may not use it to train its models. You can switch this off at any time in Settings.</p>'],
['use','How and why we use it','<p>We use your data to provide the service you asked for (contract), to keep it secure and improve it (legitimate interests), and to send service messages such as sign-in codes, Thread invitations to the person you met, and follow-up reminders you have switched on. When you start a Thread with someone, we email them once so they can confirm it; they can ignore it and nothing more is sent. We do not sell your personal data and we do not use it for third-party advertising.</p>'],
['sharing','Who can see what','<p>Your public card is visible to anyone with your link. A Thread is only created when both people confirm it. Your answer to What&rsquo;s next? stays hidden until both people reply, and your private notes are never shown to anyone else. Event organisers and networks only see aggregate results, and only where you opted in.</p>'],
['processors','Service providers and transfers','<p>We use trusted providers to run Introthread, including hosting (Vercel), database and authentication (Supabase), email delivery (Resend), payments (Paystack), AI follow-up drafts when you switch them on, sign-in with Google, Microsoft or LinkedIn when you choose it, fonts (Google Fonts) and place names for saved locations (OpenStreetMap Nominatim, which receives only coordinates). Where data is transferred outside the UK or EEA, we rely on appropriate safeguards such as the UK International Data Transfer Addendum or Standard Contractual Clauses.</p>'],
['retention','How long we keep it','<p>We keep your data while your account is active. If you delete your account, we delete your card and your side of every Thread within 30 days, except where we must keep limited records by law.</p>'],
['rights','Your rights','<p>Under UK GDPR and applicable US state laws you can access, correct, export or delete your data, object to or restrict certain processing, and withdraw consent at any time. You can export or delete your data in Settings, or email <a href="mailto:privacy@introthread.com">privacy@introthread.com</a>. You may also complain to the UK Information Commissioner&rsquo;s Office (ico.org.uk).</p>'],
['cookies','Cookies and storage','<p>We only use storage that is strictly necessary to keep you signed in and remember your preferences. We do not use advertising cookies. If we add product analytics to understand how the service is used, we will ask for your consent first where the law requires it and update this policy.</p>'],

['changes','Changes to this policy','<p>If we make material changes we will tell you by email or in the app before they take effect.</p>']];

function tapInsights(){const T=myThreads().slice().sort((a,b)=>b.createdAt-a.createdAt);const D=864e5,now=Date.now();
 const m30=T.filter(t=>now-t.createdAt<30*D),conf=m30.filter(t=>t.confirmed).length,both=m30.filter(t=>t.mine&&t.theirs).length,rate=m30.length?Math.round(conf/m30.length*100):0;
 const days=[...Array(7)].map((_,k)=>{const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()-(6-k));const e=s.getTime()+D;return{l:s.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2),n:T.filter(t=>t.createdAt>=s.getTime()&&t.createdAt<e).length}});const mx=Math.max(1,...days.map(d=>d.n));
 const wk=days.reduce((a,d)=>a+d.n,0);

 const st=(n,l,s)=>`<div class="t-stat"><b>${n}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
 return`<div class="t-ins">
 <section class="t-panel"><div class="t-panel-h"><div><h3>Recent activity</h3><p>Your latest Threads and where each one stands.</p></div><a href="/app/threads">View all ${sv('chev',14)}</a></div>

 <section class="t-panel"><div class="t-panel-h"><div><h3>Sharing analytics</h3><p>Last 30 days</p></div></div>
  <div class="t-stats">${st(m30.length,'Threads started')}${st(conf,'Confirmed',m30.length?rate+'% confirmation rate':'')}${st(both,'Both answered','&ldquo;What&rsquo;s next?&rdquo;')}${st(wk,'This week')}</div>
  <div class="t-chart" role="img" aria-label="Threads started in the last 7 days">${days.map(d=>`<div><span style="height:${Math.round(d.n/mx*100)}%" title="${d.n} Thread${d.n===1?'':'s'}"></span><small>${d.l}</small></div>`).join('')}</div></section>

function amClose(){const m=document.getElementById('acm');if(m)m.remove();document.querySelectorAll('[data-am]').forEach(b=>b.setAttribute('aria-expanded','false'));document.removeEventListener('keydown',amKey,true);document.removeEventListener('mousedown',amOut,true)}
function amOut(e){const m=document.getElementById('acm');if(m&&!m.contains(e.target)&&!e.target.closest('[data-am]'))amClose()}
function amKey(e){const m=document.getElementById('acm');if(!m)return;const it=[...m.querySelectorAll('[role="menuitem"]')];const i=it.indexOf(document.activeElement);
 if(e.key==='Escape'){e.preventDefault();const t=document.querySelector('[data-am][aria-expanded="true"]');amClose();if(t)t.focus()}
 else if(e.key==='ArrowDown'){e.preventDefault();(it[(i+1)%it.length]||it[0]).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(it[(i-1+it.length)%it.length]||it[0]).focus()}
 else if(e.key==='Tab'){amClose()}}
function amGo(path,tab){amClose();if(tab){STAB=tab}go(path)}
function acctMenu(btn,dir){const open=document.getElementById('acm');if(open){const same=btn&&btn.getAttribute('aria-expanded')==='true';amClose();if(same)return}

 const m=document.createElement('div');m.id='acm';m.className='am';m.setAttribute('role','menu');m.setAttribute('aria-label','Account menu');
 m.innerHTML=`<div class="am-h">${avatarC(u,48)}<div class="am-hi"><b>${esc(u.name||'')}</b><small>${esc(u.email||('introthread.com/'+u.handle))}</small><span class="am-tags"><span class="am-plan ${pro?'pro':''}">${pro?sv('spark',11)+' '+esc(u.plan):'Free plan'}</span><span class="am-vis ${pub?'':'off'}"><i></i>${pub?'Profile live':'Profile private'}</span></span></div></div>
 <div class="am-link"><span>introthread.com/${esc(u.handle)}</span><button type="button" role="menuitem" aria-label="Copy my link" onclick="copy('${profileUrl(u)}','Link copied')">${sv('copy',15)}</button></div>
 <div class="am-g">${it('user','My card',"amGo('/app/card')")}${it('globe','Public profile',"amGo('/app/profile')")}${it('eye','View as visitor',`amClose();window.open('/${esc(u.handle)}','_blank','noopener')`,{ext:1})}</div>
 <div class="am-g">${it('gear','Account settings',"amGo('/app/settings','account')")}${it('shield','Privacy &amp; visibility',"amGo('/app/settings','privacy')")}${it('bell','Notifications',"amGo('/app/settings','notifications')")}${it('brief','Plan &amp; billing',"amGo('/app/settings','billing')",{badge:pro?'':'Upgrade',bc:'up'})}</div>
 <div class="am-g">${it('mail','Help &amp; support',"amClose();location.href='mailto:hello@introthread.com?subject=Introthread%20support'")}${it('play','How Introthread works',"amClose();go('/how')")}</div>
 <div class="am-g">${it('out','Log out',"amClose();logout()",{cls:'am-out'})}</div>`;
 document.body.appendChild(m);btn.setAttribute('aria-expanded','true');
 const r=btn.getBoundingClientRect(),W=m.offsetWidth,H=m.offsetHeight,vw=innerWidth,vh=innerHeight;let left,top;
 if(dir==='up'){left=Math.max(8,Math.min(r.left,vw-W-8));top=Math.max(8,r.top-H-8)}else{left=Math.max(8,Math.min(r.right-W,vw-W-8));top=Math.min(r.bottom+8,vh-H-8);if(top<8)top=8}
 m.style.left=left+'px';m.style.top=top+'px';m.classList.add(dir==='up'?'up':'down');
 document.addEventListener('keydown',amKey,true);setTimeout(()=>document.addEventListener('mousedown',amOut,true),0);
 const f=m.querySelector('[role="menuitem"]');if(f)f.focus({preventScroll:true})}
